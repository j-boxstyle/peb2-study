,"we":{"1":"論拠が逆。経済=安い方、道徳=平等。","2":"バスを決して利用可能にすべきでないという結論ではない。","3":"まさに経済と道徳の間に緊張がある。"}},{"id":319,"conceptId":"cMLM_paternalism","ch":"MLM","type":"E","source":"PEB2 Textbook","q":"[L6] Subsidizing local culture even when the public will pay for the product reflects which objection (cultural goods / paternalism)?","opts":["A) Economic argument: local heritage is valuable for identity; Moral argument: market should rule","B) Economic argument: subsidy is wasteful and the market should rule; Moral argument: local heritage is valuable for people’s identity","C) Both arguments say the government should never subsidize culture","D) It illustrates capital export neutrality","E) わからない"],"ans":1,"exp":"文化財/パターナリズムの論点: 経済的議論は補助は無駄で市場に委ねるべき、道徳的議論は地域の遺産が人々のアイデンティティに価値を持つ、と対立する。市場万能論への反論例。","we":{"0":"論拠が逆。経済=市場に委ねる、道徳=遺産に価値。","2":"政府が決して補助すべきでないという一方的結論ではない。","3":"資本輸出中立性はTAXの概念で無関係。"}},{"id":320,"conceptId":"cMLM_scarcity_mani","ch":"MLM","type":"C","source":"PEB2 Textbook","q":"[L6] Mani et al. (2013): the less well-off use less preventive care, keep fewer appointments, etc. What is the correct conclusion the slide warns about?","opts":["A) Being less productive simply causes people to be poor","B) Poverty has no relationship with productivity","C) One must be careful: the data do not straightforwardly prove \"being less well-off causes being less productive\" (correlation vs. causation)","D) Preventive care always increases income","E) わからない"],"ans":2,"exp":"Mani et al.(2013)のスライドは、相関を因果と短絡しない注意を促す。貧しさと低生産性の相関から「貧しさが低生産性を生む」と単純に結論づけるのは、因果方向や交絡の問題で慎重を要する。科学的主張の評価の例。","we":{"0":"低生産性が貧困を生むと断定するのは因果の早合点。慎重さが論点。","1":"","3":"貧困と生産性に関係が無いという主張ではない。"}},{"id":401,"conceptId":"cSUST_brundtland","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L7] The most popular definition of sustainable development (Brundtland 1987) is development that:","opts":["A) maximizes present consumption regardless of the future","B) keeps GDP growth constant forever","C) replaces all natural capital with human-made capital","D) meets the needs of the present without compromising the ability of future generations to meet their own needs","E) わからない"],"ans":3,"exp":"Brundtland(1987)の定義: 持続可能な開発とは、将来世代が自らのニーズを満たす能力を損なわずに現在のニーズを満たす開発。300超の定義の中で最も広く引用される。","we":{"0":"将来を顧みず現在の消費を最大化するのは持続可能性の定義に反する。","1":"GDP成長の一定維持を求める定義ではない。","2":"自然資本を人工資本で全置換するのは強い持続可能性に反し、定義そのものでもない。"}},{"id":402,"conceptId":"cSUST_strong_weak","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L7] Costanza & Daly distinguish strong vs. weak sustainability. Strong sustainability requires:","opts":["A) maintaining natural capital and human-made capital intact separately","B) maintaining the sum of human-made and natural capital intact","C) maximizing human-made capital only","D) ignoring natural capital entirely","E) わからない"],"ans":0,"exp":"強い持続可能性(strong sustainability)は、自然資本と人工資本を「別々に」非減少に保つことを求める(自然資本は代替不可)。弱い持続可能性は両者の「合計」を保てばよい(代替可能)とする。","we":{"1":"合計を保つのは弱い持続可能性(weak)の定義。","2":"","3":"人工資本のみ最大化は持続可能性の定義ではない。"}},{"id":403,"conceptId":"cSUST_5cs","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L7] Lange & Pfarrer say a good article formulates 5 Cs. Which is one of them?","opts":["A) Commodification","B) Common ground (what is established in the literature)","C) Counterfactual","D) Capital neutrality","E) わからない"],"ans":1,"exp":"Lange & Pfarrer(2017)の5C: Common ground(共通基盤)、Complication(問題化)、Concern(関連性)、Course of action(対処)、Contribution(貢献)。論文の構造を読み書きする枠組みで、講義の各論文分析に用いられる。","we":{"0":"Commodification(商品化)は5Cではない(Costanzaの議論で別出)。","2":"Counterfactual(反事実)はWest et al.の概念で5Cではない。","3":"Capital neutrality(資本中立性)はTAXの概念で無関係。"}},{"id":404,"conceptId":"cSUST_ehrenfeld","ch":"SUST","type":"C","source":"PEB2 Textbook","q":"[L7] Ehrenfeld’s complication is summarized as:","opts":["A) \"Eco-efficiency solves sustainability completely\"","B) \"Business should maximize shareholder value only\"","C) \"Reducing unsustainability is not the same as creating sustainability\"","D) \"Natural and human-made capital are perfectly substitutable\"","E) わからない"],"ans":2,"exp":"Ehrenfeld(2005)の問題化(complication): 「持続不可能性を減らすことは、持続可能性を作ることと同じではない」。現状の企業の取組はBand-Aid(対症療法)にすぎないと批判。貢献は幸福(eudaimonia)に根ざした持続可能性の定義。","we":{"0":"エコ効率が完全解決という主張はEhrenfeldの批判対象(common ground)。","1":"株主価値最大化はFriedmanドクトリンの説明で、Ehrenfeldの問題化そのものではない。","3":"資本の完全代替は弱い持続可能性の前提で、Ehrenfeldの問題化ではない。"}},{"id":405,"conceptId":"cSUST_friedman","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L7] The Friedman doctrine states that:","opts":["A) The social responsibility of business is to reduce its profits for social causes","B) Business should be owned by the state","C) Profits must always be donated to charity","D) The social responsibility of business is to increase its profits (CEOs’ sole responsibility is to maximize shareholder profit, within the law)","E) わからない"],"ans":3,"exp":"Friedmanドクトリン(1970): 企業の社会的責任は利益を増やすこと。CEOの唯一の責任は(法の枠内で)株主の利益を最大化すること。Smithの「見えざる手」のように、利益と効率の追求が社会に最も貢献するとする。反論: 弱い政府/政府の失敗、telecoupling(遠隔影響)。","we":{"0":"社会的目的のため利益を減らすのはFriedmanの主張と逆。","1":"","2":"企業の国有化を説くものではない。"}},{"id":406,"conceptId":"cSUST_jevons","ch":"SUST","type":"C","source":"PEB2 Textbook","q":"[L7] Jevons’ paradox states that efficiency improvements can:","opts":["A) raise total resource consumption (through increased profitability, new uses, and consumer behavior)","B) always reduce total resource consumption to zero","C) have no effect on consumption","D) only apply to renewable energy","E) わからない"],"ans":0,"exp":"Jevonsのパラドックス: 資源利用の効率化は、(1)収益性向上、(2)新用途の発明、(3)消費者行動を通じて、総資源消費を「増やしうる」(リバウンド効果)。Alcottは実測リバウンドが1%未満〜数百%で、ゼロ以下にはならないとした。","we":{"1":"効率化が消費をゼロにするのではなく、逆に増やしうるのがパラドックス。","2":"消費に影響しないのではなく、増加させうる。","3":"再生可能エネルギーに限った話ではない。"}},{"id":407,"conceptId":"cSUST_busch_course","ch":"SUST","type":"C","source":"PEB2 Textbook","q":"[L7] Busch et al.’s \"course of action\" (how to make business cases work) includes:","opts":["A) abandoning all government intervention","B) sustainable entrepreneurship, business-model transformation, and sensitivity to market failures (need for government intervention)","C) maximizing consumerism","D) ignoring market failures entirely","E) わからない"],"ans":1,"exp":"Busch et al.(2024)の対処(course of action): 持続可能な起業(社会的使命が中核; B Corp等)、ビジネスモデル変革(循環型・シェアリング)、市場の失敗への感応(政府介入の必要性を認める)。貢献はシステム視点(影響・協働・抑制)への再定位。","we":{"0":"むしろ政府介入の必要性を認める(完全撤廃ではない)。","2":"消費主義の最大化はBuschの批判対象。","3":"市場の失敗を無視するのではなく、それに感応すべきとする。"}},{"id":408,"conceptId":"cSUST_west_finding","ch":"SUST","type":"C","source":"PEB2 Textbook","q":"[L7] What was West et al.’s key empirical finding on forest-conservation carbon offsets?","opts":["A) All offset projects delivered their promised reductions","B) Offsets reduced more emissions than promised","C) Only about 6% of promised offsets gave actual emission reductions (most overcredited vs. synthetic controls)","D) Counterfactual analysis was impossible","E) わからない"],"ans":2,"exp":"West et al.(2023)は、合成コントロール(事後の反事実)で26件のプロジェクトを評価し、約束された削減のうち実際に削減を生んだのは約6%にすぎないと結論。多くが過大クレジット。事前ベースライン依存の追加性評価の問題を示す。","we":{"0":"すべてが約束を達成したのではなく、ごく一部のみ。","1":"約束以上に削減したのではなく、ほとんどが過大クレジット。","3":"合成コントロールで反事実分析は可能だった(本研究の手法)。"}},{"id":409,"conceptId":"cSUST_counterfactual","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L7] What is a counterfactual in West et al.’s analysis?","opts":["A) The actual observed deforestation in the project area","B) The project developer’s marketing claim","C) The carbon price on the market","D) A hypothetical outcome of what would have happened under a different treatment (e.g., no conservation)","E) わからない"],"ans":3,"exp":"反事実(counterfactual)とは、別の処置(例: 保全しなかった場合)の下で起きたであろう仮想的な結果(「もし〜だったら」)。ランダム化や、観察特性が似た合成コントロール(matching)で作る。追加性の判定に不可欠。","we":{"0":"実際に観測された森林減少は事実であって反事実ではない。","1":"","2":"開発者のマーケティング主張は反事実ではない。"}},{"id":410,"conceptId":"cSUST_boulding","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L8] Boulding (1966) contrasts which two metaphors of the economy?","opts":["A) Cowboy economy vs. spaceman economy","B) Pipeline economy vs. platform economy","C) Cowboy economy vs. pipeline economy","D) Hub economy vs. keystone economy","E) わからない"],"ans":0,"exp":"Boulding(1966)は、無限の資源と消費を前提とする「カウボーイ経済(cowboy economy)」と、閉じた限られた地球で循環を要する「宇宙船経済(spaceman economy)」を対比した。生態経済学の思想的基盤。","we":{"1":"pipeline/platformはDF(デジタル企業)の対比で、Bouldingの対比ではない。","2":"cowboy対pipelineではなく、cowboy対spaceman。","3":"hub/keystoneはIansitiのプラットフォーム概念。"}},{"id":411,"conceptId":"cSUST_malthus","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L8] Malthus argued that population grows geometrically while subsistence grows arithmetically. He was criticized because:","opts":["A) population always grows faster than food in every era","B) fertility rates decrease with income and food production increased faster than population","C) food production cannot increase at all","D) population growth is unrelated to resources","E) わからない"],"ans":1,"exp":"Malthus(1798)は人口が幾何級数的、食料が算術級数的に増えると論じた。批判: 所得上昇で出生率が低下し、食料生産が人口より速く増加した(実証的に外れた)。Limits to Growthはこのロジックを継承(人口→経済、食料→資源)。","we":{"0":"実際には食料が人口より速く増えた時期もあり、常に人口が上回るわけではない。","2":"","3":"食料生産は実際には増加した。"}},{"id":412,"conceptId":"cSUST_solow","ch":"SUST","type":"C","source":"PEB2 Textbook","q":"[L8] Solow (1973) argues that rising prices of exhaustible resources lead to:","opts":["A) immediate collapse of the economy","B) a permanent end to economic growth","C) substitution toward more plentiful materials, raising the productivity of natural resources","D) the impossibility of any substitution","E) わからない"],"ans":2,"exp":"Solow(1973)は、枯渇性資源の価格上昇が、より豊富で安価な材料への代替を促し、資源生産性(GDP当たり資源必要量の低下)を高めると論じた(相対的希少性・代替可能性=弱い持続可能性)。留保: 価格付けされない外部性、持続可能性の十分条件ではない。","we":{"0":"即時の経済崩壊を予測したのではなく、価格による代替を論じた。","1":"経済成長の恒久的終焉ではなく、代替で成長は続きうるとする。","3":"代替が不可能とするのは生態経済学側(強い持続可能性)。Solowは代替可能とする。"}},{"id":413,"conceptId":"cSUST_decoupling_def","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L8] What is the difference between absolute and relative decoupling (Hickel & Kallis)?","opts":["A) Absolute: impact rises slower than GDP; Relative: GDP rises while impact falls","B) Both mean impact and GDP rise at the same rate","C) Both mean GDP falls while impact rises","D) Absolute: GDP increases while impact decreases; Relative: impact increases but slower than GDP","E) わからない"],"ans":3,"exp":"絶対的デカップリング(absolute): GDPが増加しつつ環境影響が「減少」する。相対的デカップリング(relative): 影響は増えるがGDPより緩やかに増える。グリーン成長と呼べるのは絶対的のみ。","we":{"0":"定義が逆。絶対=影響減少、相対=影響はGDPより遅く増加。","1":"両者とも同率上昇ではない。","2":"両者ともGDP減少・影響増加を意味しない。"}},{"id":414,"conceptId":"cSUST_green_growth_evidence","ch":"SUST","type":"C","source":"PEB2 Textbook","q":"[L8] What do Hickel & Kallis (2020) conclude about evidence for green growth (absolute decoupling)?","opts":["A) There is no evidence of absolute decoupling of resource use at the global scale; recent decades show \"recoupling\"","B) There is strong global evidence of absolute decoupling of resource use","C) Global GHG emissions fell steadily every year","D) Decoupling to net-zero will happen within 10 years","E) わからない"],"ans":0,"exp":"Hickel & Kallis(2020): 世界規模での資源利用の絶対的デカップリングの証拠は無く、近年はむしろ「再結合(recoupling/rematerialization)」が見られる。世界のGHGは世界的不況時のみ減少。Global Northの絶対的デカップリングはパリ目標には遅すぎる(Vogel & Hickel: ネットゼロまで200年超)。","we":{"1":"絶対的デカップリングの強い証拠は「無い」とするのが結論。","2":"","3":"GHGは世界的不況時のみ減少し、毎年安定的に減ったわけではない。"}},{"id":415,"conceptId":"cSUST_easterlin","ch":"SUST","type":"C","source":"PEB2 Textbook","q":"[L8] Which statement reflects Easterlin’s paradox?","opts":["A) Income is unrelated to happiness within countries at a point in time","B) Income is positively correlated with happiness within countries at a moment, but is unrelated to happiness across countries and over time","C) Income always raises happiness over time","D) Happiness cannot be measured at all","E) わからない"],"ans":1,"exp":"Easterlinのパラドックス: ある時点・一国内では所得と幸福は正の相関を持つが、国家間および時系列では所得は幸福と無相関。説明候補: 相対所得(地位)、快楽適応、非経済的成長(uneconomic growth)。","we":{"0":"一国内・一時点では所得と幸福は正の相関がある(無相関ではない)。","2":"","3":"時系列では所得は幸福と無相関で、常に幸福を高めるわけではない。"}},{"id":416,"conceptId":"cSUST_doughnut_concept","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L8] What does the doughnut framework (Raworth) add to the planetary boundaries concept?","opts":["A) A maximum GDP ceiling for each country","B) A global carbon tax schedule","C) A social foundation (inner ring) below which human deprivation occurs, alongside the ecological ceiling","D) A ranking of platforms by network effects","E) わからない"],"ans":2,"exp":"ドーナツ枠組み(Raworth)は、惑星限界(生態的天井=外輪)に加え、社会的基盤(内輪: 下回ると人間の困窮が生じる)を加える。Fanning & Raworth(2025)は21の社会指標と13の生態指標で「均衡を欠いた世界」を示した。","we":{"0":"各国のGDP上限を設けるものではない。","1":"","3":"世界炭素税の料率表ではない。"}},{"id":417,"conceptId":"cSUST_world_out_of_balance","ch":"SUST","type":"C","source":"PEB2 Textbook","q":"[L8] Fanning & Raworth’s \"a world out of balance\" observes that typically:","opts":["A) countries that meet more social foundations also stay within ecological ceilings","B) all countries are within both social and ecological limits","C) income has no relation to ecological footprint","D) countries that meet more social foundations tend to exceed more ecological ceilings, while those within planetary boundaries fail to provide social conditions","E) わからない"],"ans":3,"exp":"Fanning & Raworth(2025)/O’Neill et al.(2018): 典型的に、社会的基盤をより多く満たす国ほど生態的天井をより多く超過し、逆に惑星限界内に収まる国は社会的条件を提供できていない。両立の難しさ=「均衡を欠いた世界」。","we":{"0":"むしろ社会的基盤を満たす国ほど生態的天井を超えがち(両立できていない)。","1":"","2":"全ての国が両限界内にあるのではなく、均衡を欠く。"}},{"id":418,"conceptId":"cSUST_valuation_methods","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L8] Which is a revealed preference method for valuing ecosystem services?","opts":["A) Hotelling’s travel cost method and hedonic regression (e.g., house prices)","B) Contingent valuation (asking hypothetical willingness to pay)","C) The arm’s length principle","D) The maximin principle","E) わからない"],"ans":0,"exp":"顕示選好法(revealed preference)は実際の行動から価値を推定: Hotellingの旅行費用法(公園までの移動費用)やヘドニック回帰(住宅価格差で緑地近接・大気質・騒音の価値を推定)。一方、表明選好法(contingent valuation)は仮想的WTPを尋ねる。","we":{"1":"仮想的WTPを尋ねる仮想評価法(contingent valuation)は表明選好法であり、顕示選好法ではない。","2":"","3":"独立企業間原則はTAXの移転価格の概念。"}},{"id":419,"conceptId":"cSUST_vsl","ch":"SUST","type":"C","source":"PEB2 Predicted","q":"[L8] The Value of a Statistical Life (VSL) is used to:","opts":["A) set corporate tax rates on multinationals","B) express the \"benefits of saving a life\" in cost-benefit analyses of safety and pollution standards","C) measure network effects on platforms","D) define strong sustainability","E) わからない"],"ans":1,"exp":"統計的生命価値(VSL)は、安全・汚染基準の費用便益分析で「生命を救う便益」を金銭表現するのに用いる(米EU等で約1000万US$)。仮想的賭けや割引後の将来稼得、政府支出から推定。欠点: 所得に依存する。","we":{"0":"多国籍企業の法人税率設定とは無関係。","2":"","3":"ネットワーク効果の測定はDFの概念。"}},{"id":420,"conceptId":"cSUST_nonexcludable","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L8] Many ecosystem services are public goods. \"Non-excludable\" means:","opts":["A) consumption by one person decreases the amount available to others","B) the good can be sold at a market price easily","C) it is impossible to exclude someone from consumption","D) only the government may consume it","E) わからない"],"ans":2,"exp":"非排除性(non-excludable)は、誰かを消費から排除することが不可能であること。非競合性(non-rival)は、一人の消費が他者の消費可能量を減らさないこと。多くの生態系サービスは両性質を持つ公共財(Costanza 2024)。","we":{"0":"これは競合性(rival)の説明で、非排除性ではない。","1":"","3":"公共財はむしろ市場で容易に売れない(非排除性ゆえタダ乗り)。"}},{"id":421,"conceptId":"cSUST_uber_planet","ch":"SUST","type":"E","source":"PEB2 Textbook","q":"[L7] \"Uber Planet\" lets customers pay ~+5% to offset emissions. Which is a \"con\" raised in the lecture?","opts":["A) Any mitigation of climate change helps","B) It fully decarbonizes Uber’s fleet","C) It eliminates deadheading entirely","D) It shifts responsibility to consumers, the symbolic amount is not enough to offset emissions, and offsets may not deliver promised reductions","E) わからない"],"ans":3,"exp":"Uber Planetの「con(短所)」: 責任を消費者に転嫁する、象徴的な金額では排出を相殺するのに不十分、オフセットは約束された削減を生まないことがある(West et al.の知見)。Proは「どんな緩和も助けになる」。","we":{"0":"これはpro(長所)の側の主張。","1":"","2":"+5%課金は車両を完全脱炭素化しない。"}},{"id":422,"conceptId":"cSUST_wright_framing","ch":"SUST","type":"C","source":"PEB2 Predicted","q":"[L7] In Wright & Nyberg’s model, the three stages by which firms translate climate change into business-as-usual are:","opts":["A) Framing, localizing, and normalizing","B) Resourcing, securing, and integrating","C) Common ground, complication, and contribution","D) Cowboy, spaceman, and steady-state","E) わからない"],"ans":0,"exp":"Wright & Nyberg(2017)の3段階: Framing(連想/非連想)、Localizing(取り込み・指標化・布教)、Normalizing(純化・希釈)。最終的に当初の気候への取組が支配的言説に再整合され通常業務に戻る。","we":{"1":"resourcing/securingはDF(境界資源モデル)の概念。","2":"","3":"common ground等はLange & Pfarrerの5Cの一部。"}},{"id":423,"conceptId":"cSUST_intrinsic_rights","ch":"SUST","type":"C","source":"PEB2 Textbook","q":"[L8] Why does Costanza (2024) hold that intrinsic values cannot be translated to monetary estimates?","opts":["A) Because they are the same as instrumental values","B) Because they concern the rights of nature (e.g., legal personhood like the Whanganui River)","C) Because they are easy to price via travel cost","D) Because they only apply to private goods","E) わからない"],"ans":1,"exp":"Costanza(2024)は、内在的価値が「自然の権利(rights of nature)」に関わるため金銭推定に翻訳できないとする(例: NZのWhanganui川の法人格、エクアドルのPachamama)。生態系サービス評価は権利ベースのアプローチと補完的。","we":{"0":"内在的価値は手段的価値とは別で、金銭化しやすい手段的価値とは異なる。","2":"","3":"旅行費用法で容易に価格付けできるのは手段的(利用)価値。内在的価値は不可。"}},{"id":424,"conceptId":"cSUST_contingent_valuation","ch":"SUST","type":"C","source":"PEB2 Predicted","q":"[L8] Diamond & Hausman (1994) criticize contingent valuation (CV) because of issues such as:","opts":["A) it perfectly measures willingness to pay with no bias","B) it relies only on revealed market behavior","C) embedding/scope effects (WTP_total ≈ WTP_part) and order effects, suggesting policy is better informed by expert opinion","D) it is identical to hedonic regression","E) わからない"],"ans":2,"exp":"Diamond & Hausman(1994)はCV(仮想評価法)を批判: 埋め込み/スコープ効果(全体WTP≒部分WTP)、順序効果、支払手段で異なるWTP、WTP≠WTA(保有効果)。政策は専門家意見でより良く判断されるとする。賛成側はKling et al.(ベストプラクティス遵守で妥当)。","we":{"0":"CVが偏りなく完全に測定できるとは批判者は考えない(むしろ偏りを指摘)。","1":"","3":"CVは表明選好法で、顕示された市場行動に依拠するのは顕示選好法。"}},{"id":425,"conceptId":"cSUST_biodiversity_importance","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L8] Which is a reason given for why biodiversity conservation is important?","opts":["A) Biodiversity loss improves ecosystem efficiency","B) Biodiversity loss has no effect on disease transmission","C) Biodiversity loss raises GDP automatically","D) Biodiversity loss harms ecosystem efficiency and stability and increases risks of infectious diseases","E) わからない"],"ans":3,"exp":"生物多様性損失は、(1)生態系効率を損ない(Cardinale et al.)、(2)生態系安定性を損ない(Rockström et al.)、(3)感染症リスクを高める(Keesing et al.)。単一種依存の生態系は撹乱に脆弱。","we":{"0":"損失は効率を「改善」するのではなく損なう。","1":"","2":"損失はむしろ病原体伝播・疾病発生を「増やす」。"}},{"id":426,"conceptId":"cSUST_postgrowth","ch":"SUST","type":"C","source":"PEB2 Predicted","q":"[L8] Kallis et al. (2025) on post-growth argues that:","opts":["A) continued growth is unlikely to be environmentally sustainable or socially beneficial (especially in high-income countries), questioning growth’s feasibility and desirability","B) economic growth in high-income countries is the surest path to sustainability","C) absolute decoupling has already been achieved globally","D) the Easterlin paradox proves income always raises wellbeing","E) わからない"],"ans":0,"exp":"Kallis et al.(2025)のポストグロース: 特に高所得国では継続的成長が環境的に持続可能でも社会的に有益でもなさそうとし、成長の実現可能性と望ましさを問う。Limits to Growthのレビュー、絶対的デカップリングの否定、Easterlinパラドックスのレビューを行い、ポストグロース政策を提示。","we":{"1":"高所得国の成長を持続可能性への確実な道とはせず、むしろ疑問視する。","2":"","3":"絶対的デカップリングは世界規模で達成されていないとする(Hickel & Kallis)。"}}];

<script>

   0=全範囲, 2=教科書(Textbook), 3=過去問(Mock Exam), 4=Exercise, 5=Problem, 6=予想問題(Predicted) */

};

var SM2=loadSM2();
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function getSM2(id){return SM2[id]||{ef:2.5,interval:1,reps:0,nextReview:todayStr(),lastQ:null};}
function updateSM2(id,quality){
  var s=getSM2(id);
  if(quality<3){s.reps=0;s.interval=1;}
  else{ if(s.reps===0)s.interval=1; else if(s.reps===1)s.interval=6; else s.interval=Math.round(s.interval*s.ef); s.reps++; }
  s.ef=Math.max(1.3, s.ef+(0.1-(5-quality)*(0.08+(5-quality)*0.02)));
  s.lastQ=quality;
  var n=new Date(); n.setDate(n.getDate()+s.interval);
  s.nextReview=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
  SM2[id]=s; saveSM2();
  return s;
}
function isDue(id){var s=SM2[id]; return !s || s.nextReview<=todayStr();}
function dueCount(){return QUESTIONS.filter(function(q){return isDue(q.id);}).length;}
function rateSM2(id,quality,btn){
  var s=updateSM2(id,quality);
  Array.prototype.forEach.call(document.querySelectorAll('.sm2-btn'),function(b){b.disabled=true;});
  if(btn) btn.classList.add('picked');
  var meta=document.querySelector('.sm2-meta');
  if(meta) meta.textContent='次回復習: '+s.nextReview+'（'+s.interval+'日後）・ 連続正解 '+s.reps+'回 ・ EF '+s.ef.toFixed(2);
  toast('記録しました：'+s.interval+'日後に復習');
  updateStat();
}

/* ---- option shuffling (stratified) ---- */
function shuffleQuestionOptionsAt(q, targetSlot){
  // real options = indices 0..(n-2); last = わからない (fixed)
  var n = q.opts.length;
  var dk = q.opts[n-1];
  var real = q.opts.slice(0,n-1).map(function(s){return s.replace(/^[A-E]\)\s*/,'');});
  var correctText = real[q.ans];
  // wrong reasons mapped by original index
  var weByText = {};
  if(q.we) Object.keys(q.we).forEach(function(k){ weByText[real[+k]] = q.we[k]; });
  // fisher-yates on distractors
  var distract = real.filter(function(_,i){return i!==q.ans;});
  for(var i=distract.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=distract[i];distract[i]=distract[j];distract[j]=t;}
  var slots = new Array(real.length).fill(null);
  var ts = Math.max(0,Math.min(real.length-1,targetSlot));
  slots[ts]=correctText;
  var di=0; for(var p=0;p<slots.length;p++){if(slots[p]===null)slots[p]=distract[di++];}
  var letters=["A","B","C","D","E","F"];
  var newOpts = slots.map(function(txt,idx){return letters[idx]+") "+txt;});
  newOpts.push(dk);
  var newWe={};
  slots.forEach(function(txt,idx){ if(txt!==correctText && weByText[txt]!==undefined) newWe[idx]=weByText[txt]; });
  return {opts:newOpts, ans:ts, we:newWe};
}
function shuffleBlockOptions(block){
  var nReal = 4;
  // stratified targets: cycle 0..3, then anti-streak (no 3 same in a row)
  var targets=[]; for(var i=0;i<block.length;i++) targets.push(i%nReal);
  for(var s=targets.length-1;s>0;s--){var j=Math.floor(Math.random()*(s+1));var t=targets[s];targets[s]=targets[j];targets[j]=t;}
  // anti-streak
  for(var i=2;i<targets.length;i++){
    if(targets[i]===targets[i-1] && targets[i-1]===targets[i-2]){
      for(var k=i+1;k<targets.length;k++){ if(targets[k]!==targets[i]){var tmp=targets[i];targets[i]=targets[k];targets[k]=tmp;break;} }
    }
  }
  block.forEach(function(q,idx){
    var r=shuffleQuestionOptionsAt(q, targets[idx]%((q.opts.length-1)||4));
    q._opts=r.opts; q._ans=r.ans; q._we=r.we;
  });
}

/* ---- filtering: week×ch×passModes (AND) × modes (OR) ---- */
function categoryOf(id){ return store.cat[id]||null; }
function getFilteredQuestions(){
  var sw=quizState.selectedWeeks, sc=quizState.selectedChs, pm=quizState.passModes, modes=quizState.modes;
  return QUESTIONS.filter(function(q){
    if(sw.length && sw.indexOf(WEEK_OF[q.ch])<0) return false;
    if(sc.length && sc.indexOf(q.ch)<0) return false;
    if(!(pm.length===0 || pm.indexOf(0)>=0)){
      if(pm.indexOf(passModeOf(q.source))<0) return false;
    }
    if(modes.indexOf('all')>=0) return true;
    // OR union across selected modes
    var cat=categoryOf(q.id);
    var ok=false;
    if(modes.indexOf('wrong')>=0 && (cat==='wrong'||cat==='wrong_studied')) ok=true;
    if(modes.indexOf('dk')>=0 && cat==='dk') ok=true;
    if(modes.indexOf('unanswered')>=0 && !cat) ok=true;
    if(modes.indexOf('due')>=0 && isDue(q.id)) ok=true;
    return ok;
  });
}

/* ---- build / render ---- */
function buildBlock(){
  var list=getFilteredQuestions().slice();
  // shuffle order
  for(var i=list.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=list[i];list[i]=list[j];list[j]=t;}
  quizState.block=list; quizState.blockResults=new Array(list.length); quizState.index=0;
  shuffleBlockOptions(list);
  batchLog=[];
}
function curQ(){return quizState.block[quizState.index];}

function renderQuestion(){
  var area=document.getElementById('q-area');
  var nav=document.getElementById('q-nav');
  if(!quizState.block.length){
    area.innerHTML='<div class="empty">該当する問題がありません。<br>フィルターを変更してください。</div>';
    nav.style.display='none';
    document.getElementById('q-stat').innerHTML='';
    document.getElementById('q-prog').style.width='0%';
    return;
  }
  nav.style.display='flex';
  var q=curQ();
  var prev=quizState.blockResults[quizState.index];
  var answered=!!prev;
  var isExam=passModeOf(q.source)===3;
  var srcCls='src'+(isExam?' exam':'');
  var html='';
  html+='<div class="card">';
  html+='<div class="qmeta"><span class="'+srcCls+'">'+esc(q.source)+'</span>'+
        '<span>'+CH_LABEL[q.ch]+' · Week '+WEEK_OF[q.ch]+' · '+(quizState.index+1)+'/'+quizState.block.length+'</span></div>';
  html+='<div class="qtext">'+esc(q.q)+'</div>';
  if(q.fig) html+='<div class="fig">'+q.fig+'</div>';
  var chosen = answered? prev.chosen : -1;
  for(var i=0;i<q._opts.length;i++){
    var cls='opt';
    var isDkOpt=(i===q._opts.length-1);
    if(answered){
      cls+=' disabled';
      if(i===q._ans) cls+=' correct';
      else if(i===chosen) cls+=' wrong';
    }
    var lt=q._opts[i].slice(0,2);
    var body=q._opts[i].slice(2).trim();
    html+='<button class="'+cls+'" data-i="'+i+'"'+(answered?' disabled':'')+'>'+
          '<span class="lt">'+esc(lt)+'</span>'+esc(body)+'</button>';
  }
  // explanation (restore if answered)
  html+='<div class="exp'+(answered?' show':'')+'" id="exp">';
  html+='<div class="h">解説</div>'+esc(q.exp);
  if(q._we && Object.keys(q._we).length){
    html+='<div class="we"><b>誤答の理由:</b>';
    var lets=["A","B","C","D","E"];
    Object.keys(q._we).sort().forEach(function(k){ html+='<div>'+lets[k]+') '+esc(q._we[k])+'</div>'; });
    html+='</div>';
  }
  html+='</div>';
  // SM2 spaced-repetition rating (only after answering)
  if(answered){
    var sm=getSM2(q.id);
    html+='<div class="sm2"><div class="h">🧠 記憶度を記録（間隔反復スケジューリング）</div>';
    html+='<div class="sm2-meta">次回復習: '+sm.nextReview+(sm.lastQ===null?'（未評価）':'（連続正解 '+sm.reps+'回・EF '+sm.ef.toFixed(2)+'）')+'</div>';
    html+='<div class="sm2-row">';
    var rates=[[0,'😵','忘れた'],[2,'😟','間違えた'],[3,'🤔','キツい'],[4,'😊','少し迷い'],[5,'😎','即答']];
    rates.forEach(function(r){ html+='<button class="sm2-btn" data-q="'+r[0]+'">'+r[1]+'<br>'+r[2]+'</button>'; });
    html+='</div></div>';
  }
  // AI buttons
  html+='<div class="aibtns">'+
        '<button class="aibtn" id="ai-analyze">📋 分析プロンプト</button>'+
        '<button class="aibtn alt" id="ai-test">🎯 確認テスト</button></div>';
  if(answeredCount()>=10){
    html+='<div class="aibtns"><button class="aibtn" id="ai-batch" style="flex:1">📦 バッチ一括分析（'+answeredCount()+'問）</button></div>';
  }
  html+='</div>';
  area.innerHTML=html;

  // bind options
  if(!answered){
    Array.prototype.forEach.call(area.querySelectorAll('.opt'),function(b){
      b.onclick=function(){selectOption(+b.getAttribute('data-i'));};
    });
  }
  document.getElementById('ai-analyze').onclick=function(){copyAnalyze(q);};
  document.getElementById('ai-test').onclick=function(){copyTest(q);};
  var bb=document.getElementById('ai-batch'); if(bb) bb.onclick=copyBatch;
  if(answered){
    Array.prototype.forEach.call(area.querySelectorAll('.sm2-btn'),function(b){
      b.onclick=function(){ rateSM2(q.id, +b.getAttribute('data-q'), b); };
    });
  }

  // nav buttons
  document.getElementById('btn-prev').disabled=(quizState.index===0);
  document.getElementById('btn-next').textContent=(quizState.index===quizState.block.length-1)?'最初へ ▶':'次へ ▶';
  updateStat();
}

function selectOption(idx){
  var q=curQ();
  if(quizState.blockResults[quizState.index]) return;
  var isDk=(idx===q._opts.length-1);
  var correct=(idx===q._ans);
  var usedPrompt=!!store.prompted[q.id];
  var category = isDk?'dk':(correct?(usedPrompt?'review':'correct'):(usedPrompt?'wrong_studied':'wrong'));
  store.cat[q.id]=category; saveLS(store);
  var res={q:q,chosen:idx,correct:correct,isDk:isDk,usedAnalysis:usedPrompt,usedVerify:false,category:category};
  quizState.blockResults[quizState.index]=res;
  batchLog.push(res);
  renderQuestion();
}

function nextQuestion(){
  if(quizState.index<quizState.block.length-1) quizState.index++;
  else { buildBlock(); }
  renderQuestion();
  document.getElementById('p-quiz').scrollIntoView({behavior:'smooth',block:'start'});
}
function prevQuestion(){
  if(quizState.index>0){quizState.index--;renderQuestion();
    document.getElementById('p-quiz').scrollIntoView({behavior:'smooth',block:'start'});}
}

function answeredCount(){return batchLog.length;}
function updateStat(){
  var done=quizState.blockResults.filter(Boolean).length;
  var corr=quizState.blockResults.filter(function(r){return r&&r.correct;}).length;
  var wr=quizState.blockResults.filter(function(r){return r&&!r.correct&&!r.isDk;}).length;
  var dk=quizState.blockResults.filter(function(r){return r&&r.isDk;}).length;
  document.getElementById('q-stat').innerHTML=
    '<span>📚 '+quizState.block.length+'問</span>'+
    '<span style="color:#3fb950">✅ '+corr+'</span>'+
    '<span style="color:#f85149">❌ '+wr+'</span>'+
    '<span style="color:#8b949e">❓ '+dk+'</span>'+
    '<span>進捗 '+done+'/'+quizState.block.length+'</span>';
  document.getElementById('q-prog').style.width=(quizState.block.length?Math.round(done/quizState.block.length*100):0)+'%';
}

/* ---- filter chips ---- */
function buildFilters(){
  // week
  var fw=document.getElementById('f-week'); fw.innerHTML='';
  [[1,'Week 1（DF・EoT課税）'],[2,'Week 2（MLM・Sust）']].forEach(function(p){
    fw.appendChild(chip(p[1], quizState.selectedWeeks.indexOf(p[0])>=0, function(el){
      toggle(quizState.selectedWeeks,p[0]); el.classList.toggle('on'); persist(); refreshQuiz();}));
  });
  // ch
  var fc=document.getElementById('f-ch'); fc.innerHTML='';
  ['DF','TAX','MLM','SUST'].forEach(function(c){
    fc.appendChild(chip(CH_LABEL[c], quizState.selectedChs.indexOf(c)>=0, function(el){
      toggle(quizState.selectedChs,c); el.classList.toggle('on'); persist(); refreshQuiz();}));
  });
  // pass/source
  var fp=document.getElementById('f-pass'); fp.innerHTML='';
  [[0,'全範囲'],[3,'過去問 (Mock)'],[2,'教科書/講義'],[6,'予想問題']].forEach(function(p){
    fp.appendChild(chip(p[1], quizState.passModes.indexOf(p[0])>=0, function(el){
      passToggle(p[0]); buildFilters(); persist(); refreshQuiz();}));
  });
  // mode
  var fm=document.getElementById('f-mode'); fm.innerHTML='';
  [['all','すべて'],['due','復習予定('+dueCount()+')'],['wrong','復習(誤答)'],['dk','わからない'],['unanswered','未回答']].forEach(function(p){
    var c=chip(p[1], quizState.modes.indexOf(p[0])>=0, function(el){ modeToggle(p[0]); buildFilters(); persist(); refreshQuiz();});
    c.classList.add('mode'); fm.appendChild(c);
  });
}
function chip(label,on,fn){var b=document.createElement('button');b.className='chip'+(on?' on':'');b.textContent=label;b.onclick=function(){fn(b);};return b;}
function toggle(arr,v){var i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);}
function passToggle(v){
  if(v===0){quizState.passModes=[0];return;}
  var i=quizState.passModes.indexOf(v);
  if(i>=0)quizState.passModes.splice(i,1); else quizState.passModes.push(v);
  var z=quizState.passModes.indexOf(0); if(z>=0)quizState.passModes.splice(z,1);
  if(!quizState.passModes.length)quizState.passModes=[0];
}
function modeToggle(v){
  if(v==='all'){quizState.modes=['all'];return;}
  var i=quizState.modes.indexOf(v);
  if(i>=0)quizState.modes.splice(i,1); else quizState.modes.push(v);
  var a=quizState.modes.indexOf('all'); if(a>=0)quizState.modes.splice(a,1);
  if(!quizState.modes.length)quizState.modes=['all'];
}
function persist(){
  store.filters={modes:quizState.modes,selectedWeeks:quizState.selectedWeeks,selectedChs:quizState.selectedChs,passModes:quizState.passModes};
  saveLS(store);
}
function refreshQuiz(){ buildBlock(); renderQuestion(); }

/* ---- AI prompts (Opus 4.8) ---- */
var RULES =
"【作問ルール（厳守）】\n"+
"1. 同じ概念を、新しいシナリオ・数値で問う（問題文のコピペ禁止）。\n"+
"2. 形式は5択（A〜E）。E)は必ず「わからない」。\n"+
"3. 正解位置を完全ランダムに。まず [D,A,E,C,B] のように正解配列を決めてから本文を書く。B偏り禁止。\n"+
"3b. 正解は必ず1つだけ。複数正解・等価判定（A and B both correct / Either A or B 等）は禁止。誤答は明確に誤りと分かる選択肢にする。\n"+
"4. 計算問題は substitution（代入）形式で段階的に。\n"+
"5. 難易度は 基礎→本番レベル へ。\n"+
"6. 出典は UvA Canvas 教材（講義スライド・Mock Exam・指定論文）のみ。Canvas外の一般知識・他大学資料・Student wiki は使用禁止。\n"+
"7. 言語: 問題文と選択肢は英語、解説は日本語。数式はLaTeX、グラフは言葉で記述。\n";

function qBlock(q){
  var lets=["A","B","C","D","E"];
  var s="- 出典: "+q.source+" / トラック: "+CH_LABEL[q.ch]+"\n";
  s+="- 問題: "+q.q+"\n";
  for(var i=0;i<q._opts.length;i++) s+="  "+q._opts[i]+"\n";
  s+="- 正解: "+lets[q._ans]+") "+q._opts[q._ans].slice(2).trim()+"\n";
  var r=quizState.blockResults[quizState.index];
  if(r){ s+="- あなたの解答: "+(r.isDk?"わからない":lets[r.chosen])+"（"+(r.correct?"正解":"不正解")+"）\n"; }
  s+="- 解説: "+q.exp+"\n";
  return s;
}
function copyAnalyze(q){
  markPromptUsed(q);
  var t="あなたは PEB2（Principles of Economics and Business 2）の経済学講師です。【Opus 4.8】\n"+
    "以下の問題について、私の理解を深める詳しい解説をしてください。なぜ正解が正解で、各誤答がなぜ誤りかを、関連する講義概念・論文と結びつけて説明し、つまずきやすい点を指摘してください。最後に、同じ概念を別角度から確認する一問一答を3問（5択・E=わからない）出してください。\n\n"+
    qBlock(q)+"\n"+RULES;
  doCopy(t,"📋 分析プロンプトをコピーしました");
}
function copyTest(q){
  markPromptUsed(q);
  var t="あなたは PEB2 の経済学講師です。【Opus 4.8】\n"+
    "次の問題と同じ概念を扱う確認テストを5問作ってください。シナリオと数値は変え、コピペは禁止。各問5択（A〜E、E=わからない）、正解は1つだけ。出題後に解答と日本語解説をまとめて提示してください。\n\n"+
    "【対象概念】\n"+qBlock(q)+"\n"+RULES;
  doCopy(t,"🎯 確認テストをコピーしました");
}
function copyBatch(){
  if(!batchLog.length){doCopy("",""); return;}
  var cats={wrong:[],wrong_studied:[],dk:[],review:[],correct:[]};
  batchLog.forEach(function(r){ (cats[r.category]||cats.correct).push(r); });
  var lets=["A","B","C","D","E"];
  function dump(arr){ return arr.map(function(r){var q=r.q;
    return "  ・["+q.source+"/"+q.ch+"] "+q.q+"\n     正解:"+lets[q._ans]+" / あなた:"+(r.isDk?"わからない":lets[r.chosen]); }).join("\n"); }
  var t="あなたは PEB2 の経済学講師です。【Opus 4.8】\n"+
    "以下は私が解いた"+batchLog.length+"問のバッチです。5カテゴリ（⚠️誤答+確認 / ❌単純誤答 / ❓わからない / 🔍正解+確認 / ✅完全正解）に分けて講評し、私の弱点TOP3を特定してください。最後に弱点を補強する確認テストを15問（5択・E=わからない・正解1つだけ）作り、解答と日本語解説を付けてください。\n\n";
  t+="⚠️ 誤答＋要確認(wrong_studied):\n"+(dump(cats.wrong_studied)||"  （なし）")+"\n\n";
  t+="❌ 単純誤答(wrong):\n"+(dump(cats.wrong)||"  （なし）")+"\n\n";
  t+="❓ わからない(dk):\n"+(dump(cats.dk)||"  （なし）")+"\n\n";
  t+="🔍 正解＋要確認(review):\n"+(dump(cats.review)||"  （なし）")+"\n\n";
  t+="✅ 完全正解(correct):\n"+(dump(cats.correct)||"  （なし）")+"\n\n";
  t+=RULES;
  doCopy(t,"📦 バッチを封印してコピーしました");
  batchLog=[]; renderQuestion();
}
function markPromptUsed(q){
  store.prompted[q.id]=true;
  // re-judge category if already answered
  var c=store.cat[q.id];
  if(c==='correct') store.cat[q.id]='review';
  if(c==='wrong') store.cat[q.id]='wrong_studied';
  saveLS(store);
}
function doCopy(text,msg){
  if(!text){return;}
  function ok(){toast(msg);}
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok,function(){fallbackCopy(text,ok);});
  } else fallbackCopy(text,ok);
}
function fallbackCopy(text,cb){
  var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');cb();}catch(e){}
  document.body.removeChild(ta);
}
var toastT;
function toast(m){var el=document.getElementById('toast');el.textContent=m;el.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show');},1800);}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ---- tabs ---- */
function initTabs(){
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
    t.onclick=function(){
      document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
      document.querySelectorAll('.panel').forEach(function(x){x.classList.remove('active');});
      t.classList.add('active');
      document.getElementById('p-'+t.getAttribute('data-t')).classList.add('active');
      window.scrollTo(0,0);
    };
  });
}

/* ---- content tabs (textbook / summary / glossary / menu) rendered from CONTENT ---- */
document.getElementById('btn-prev').onclick=prevQuestion;
document.getElementById('btn-next').onclick=nextQuestion;

function init(){
  initTabs();
  buildFilters();
  buildBlock();
  renderQuestion();
  renderContent();
}
