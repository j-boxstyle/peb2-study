onceptId":"cMLM_crowding_out","ch":"MLM","type":"E","source":"PEB2 Textbook","q":"[L5] In Gneezy & Rustichini’s daycare study, what happened after a fine for late pick-ups was introduced?","opts":["A) The number of late parents increased (the fine crowded out moral motivation)","B) The number of late parents decreased sharply","C) Parents stopped using daycare entirely","D) The fine had no measurable effect","E) わからない"],"ans":0,"exp":"Gneezy & Rustichini(2000)では、遅刻への罰金導入後、遅刻する親が「増えた」。罰金が道徳的動機を締め出し(crowding out)、遅刻を金で買える行為に変えてしまったため。価格設定が動機を変質させる例。","we":{"1":"遅刻は減らず、むしろ増えた。","2":"保育所利用をやめたわけではない。","3":"罰金は遅刻増という明確な効果を持った。"}},{"id":307,"conceptId":"cMLM_willful_ignorance","ch":"MLM","type":"A","source":"PEB2 Textbook","q":"[L6] \"Willful ignorance\" in the moral-markets context refers to:","opts":["A) Forgetting information by accident","B) Avoiding information about the negative externalities of self-serving decisions","C) Sharing all information transparently","D) Always acting altruistically regardless of cost","E) わからない"],"ans":1,"exp":"意図的無知(willful ignorance)は、自己利益的な決定の負の外部性に関する情報を「意図的に避ける」こと。メタ分析(Vu et al. 2023)では40%が情報を避け、利他性が16%低下した。","we":{"0":"偶発的な忘却ではなく、意図的に情報を避ける行為。","2":"情報を透明に共有するのは逆。","3":"常に利他的に行動するのとは逆の概念。"}},{"id":308,"conceptId":"cMLM_six_objections","ch":"MLM","type":"A","source":"PEB2 Textbook","q":"[L6] Cowen & Tabarrok list six objections to standard economic reasoning in moral domains. Which is one of them?","opts":["A) The benefit principle of taxation","B) The boundary resources model","C) The problem of exploitation","D) Capital export neutrality","E) わからない"],"ans":2,"exp":"Cowen & Tabarrokの6つの反論は、(1)搾取の問題、(2)干渉的選好、(3)公平・平等な扱い、(4)文化財とパターナリズム、(5)貧困・不平等・所得分配、(6)誰を数えるか。搾取の問題はその一つ。","we":{"0":"受益者原則は課税(TAX)の概念で、MLMの6反論ではない。","1":"境界資源モデルはDF(プラットフォーム)の概念。","3":"資本輸出中立性はTAXの概念。"}},{"id":309,"conceptId":"cMLM_utilitarianism","ch":"MLM","type":"A","source":"PEB2 Textbook","q":"[L6] According to the utilitarian view of just distribution, the best society:","opts":["A) maximizes the income of the worst-off group","B) requires income to be exactly equal for all","C) is just if property is justly acquired and voluntarily exchanged","D) maximizes the sum of utility (taking incentives into account)","E) わからない"],"ans":3,"exp":"功利主義は、効用の総和を最大化する社会を最善とする(必ずしも弱者を優先しない)。インセンティブも考慮し、富者から取りすぎると稼ぐ意欲が下がり、貧者へ払いすぎると貧困に留まる動機を生むとする。","we":{"0":"最下層の所得最大化はRawlsのマキシミン原理。","1":"","2":"所得の完全平等は功利主義の主張ではない。"}},{"id":310,"conceptId":"cMLM_nozick","ch":"MLM","type":"A","source":"PEB2 Textbook","q":"[L6] Nozick’s entitlement theory holds that a distribution of income is just if:","opts":["A) property is justly acquired and voluntarily exchanged (even if the result is inequality)","B) it maximizes the sum of social utility","C) the worst-off group is made as well-off as possible","D) everyone ends with an equal share","E) わからない"],"ans":0,"exp":"Nozickの権原理論(entitlement theory)は、財産が正当に取得され、自発的に交換されたなら、その結果としての分配は(不平等でも)正義であるとする。人々が望んで取引する限り、他者の権利を侵さなければ自由。","we":{"1":"効用総和の最大化は功利主義。","2":"","3":"最下層の最大化はRawlsのマキシミン。"}},{"id":311,"conceptId":"cMLM_moral_machine_concept","ch":"MLM","type":"A","source":"PEB2 Textbook","q":"[L6] The Moral Machine experiment (Awad et al.) primarily studies:","opts":["A) How to price carbon offsets fairly","B) How people decide whom an autonomous vehicle should spare in unavoidable accidents","C) How platforms tax third-party developers","D) How fines change daycare behavior","E) わからない"],"ans":1,"exp":"Moral Machine実験(Awad et al. 2018)は、自動運転車が不可避な事故で「誰を助けるべきか」を人々がどう判断するかを大規模に調べた研究。アルゴリズムが中立かという問いに関わる。","we":{"0":"炭素オフセットの価格付けはSustのWest et al.の話。","2":"","3":"第三者開発者への課税はDF/TAXの話。"}},{"id":312,"conceptId":"cMLM_survivorship","ch":"MLM","type":"C","source":"PEB2 Textbook","q":"[L6] \"Steve Jobs, Bill Gates, and Mark Zuckerberg dropped out and became billionaires, so will I.\" This reasoning illustrates:","opts":["A) Statistical significance","B) The decoy effect","C) Survivorship bias (and confusing correlation with causation)","D) Hedonic adaptation","E) わからない"],"ans":2,"exp":"成功者だけを見て一般化するのは生存者バイアス(survivorship bias)。中退者全体ではなく成功した少数だけを見ており、相関と因果も混同している。講義の「科学的主張の評価」の例。","we":{"0":"統計的有意性の話ではない。サンプル選択の偏りの問題。","1":"おとり効果(decoy effect)は選択肢設計の話で別概念。","3":"快楽適応はEasterlinパラドックスの説明概念。"}},{"id":313,"conceptId":"cMLM_pay_for_performance","ch":"MLM","type":"C","source":"PEB2 Textbook","q":"[L6] \"Pay teachers by student performance.\" What problem does the lecture flag (managing incentives, ch.22)?","opts":["A) It guarantees better learning with no downside","B) It eliminates all teacher motivation","C) It is identical to a nudge","D) What you pay for may not equal what you want — it can introduce cheating","E) わからない"],"ans":3,"exp":"インセンティブ管理(ch.22)の「You get what you pay for」: 成果連動報酬は、支払う対象(測定指標)が本当に望むもの(真の学習)と一致せず、カンニング等の歪みを招きうる。","we":{"0":"下振れ無しで学習が改善するとは限らない。歪みを生む。","1":"動機を完全に消すのではなく、誤った行動を誘発しうる。","2":"ナッジ(経済的誘因を変えずに行動を変える)とは別概念。"}},{"id":314,"conceptId":"cMLM_nudge","ch":"MLM","type":"A","source":"PEB2 Textbook","q":"[L6] A \"nudge\" is best defined as:","opts":["A) Altering people’s behavior predictably without significantly changing their economic incentives","B) A large financial penalty for non-compliance","C) A legal ban on a product","D) A market price set by supply and demand","E) わからない"],"ans":0,"exp":"ナッジ(nudge)は、経済的インセンティブを大きく変えずに、人々の行動を予測可能な形で変えること(選択アーキテクチャの変更)。例: 臓器提供のデフォルト設定(Johnson & Goldstein)。","we":{"1":"多額の罰金は経済的誘因を変える手段で、ナッジではない。","2":"","3":"製品の法的禁止は強制であり、ナッジ(選択は残す)ではない。"}},{"id":315,"conceptId":"cMLM_default_donation","ch":"MLM","type":"C","source":"PEB2 Predicted","q":"[L6] Johnson & Goldstein’s organ-donation study shows that high donation rates are best explained by:","opts":["A) Higher financial payments to donors","B) The default option (opt-in vs. opt-out) in the choice architecture","C) Stronger criminal penalties for non-donors","D) Differences in national income","E) わからない"],"ans":1,"exp":"Johnson & Goldstein(2003)は、臓器提供率の大きな差が、デフォルト設定(オプトイン対オプトアウト)という選択アーキテクチャで説明されることを示した。ナッジの代表例で、経済的誘因を変えずに行動を変える。","we":{"0":"提供者への金銭支払いの差ではなく、デフォルト設定の差。","2":"","3":"非提供者への刑事罰ではない。"}},{"id":316,"conceptId":"cMLM_motivated_reasoning","ch":"MLM","type":"C","source":"PEB2 Textbook","q":"[L6] In Pittarello et al. (report the number nearest the X), the finding was:","opts":["A) People always report the exact correct number","B) People report lower numbers when high numbers pay","C) When reporting high numbers pays, self-serving \"mistakes\" become common; when accuracy pays, mistakes are rare","D) Incentives had no effect on reported numbers","E) わからない"],"ans":2,"exp":"Pittarello et al.(2015)では、高い数字の報告が得になるとき、自己利益的な「間違い」が多くなり、正確さが報われるときは間違いが稀になる。意図的無知・動機づけられた推論の例。","we":{"0":"常に正確に報告するわけではなく、誘因で歪む。","1":"","3":"高い数字が得なら高い方向へ間違える。低い方向ではない。"}},{"id":317,"conceptId":"cMLM_adverse_selection","ch":"MLM","type":"A","source":"PEB2 Predicted","q":"[L5] Adverse selection arises when:","opts":["A) both parties have full information about what is traded","B) prices are set by a regulator","C) all products are reviewed honestly","D) there is asymmetric information about what is being traded (e.g., hidden quality)","E) わからない"],"ans":3,"exp":"逆選択(adverse selection)は、取引対象の質などについて情報の非対称性があるときに生じる(隠れた情報)。完全情報下では生じない。レビュー・評価は情報非対称を緩和しモラルハザード/逆選択を抑える。","we":{"0":"完全情報下では逆選択は生じない。","1":"","2":"規制価格の有無は逆選択の発生条件ではない。"}},{"id":318,"conceptId":"cMLM_fair_treatment","ch":"MLM","type":"E","source":"PEB2 Textbook","q":"[L6] NYC buses for all vs. cheaper taxi coupons: which captures the tension (Cowen & Tabarrok, \"fair and equal treatment\")?","opts":["A) Economic argument: taxi coupons are cheaper; Moral argument: equal treatment is important","B) Economic argument: equal treatment matters; Moral argument: taxi coupons are cheaper","C) Both arguments conclude buses should never be accessible","D) There is no tension between the two arguments","E) わからない"],"ans":0,"exp":"「公平・平等な扱い」の論点: 経済的議論はタクシークーポンの方が安い(効率)、道徳的議論は平等な扱いが重要、と対立する。標準的経済推論が道徳領域で物足りなくなる例。","we":{"1":"論拠が逆。経済=安い方、道徳=平等。","2":"バスを決して利用可能にすべきでないという結論ではない。","3":"まさに経済と道徳の間に緊張がある。"}},{"id":319,"conceptId":"cMLM_paternalism","ch":"MLM","type":"E","source":"PEB2 Textbook","q":"[L6] Subsidizing local culture even when the public will pay for the product reflects which objection (cultural goods / paternalism)?","opts":["A) Economic argument: local heritage is valuable for identity; Moral argument: market should rule","B) Economic argument: subsidy is wasteful and the market should rule; Moral argument: local heritage is valuable for people’s identity","C) Both arguments say the government should never subsidize culture","D) It illustrates capital export neutrality","E) わからない"],"ans":1,"exp":"文化財/パターナリズムの論点: 経済的議論は補助は無駄で市場に委ねるべき、道徳的議論は地域の遺産が人々のアイデンティティに価値を持つ、と対立する。市場万能論への反論例。","we":{"0":"論拠が逆。経済=市場に委ねる、道徳=遺産に価値。","2":"政府が決して補助すべきでないという一方的結論ではない。","3":"資本輸出中立性はTAXの概念で無関係。"}},{"id":320,"conceptId":"cMLM_scarcity_mani","ch":"MLM","type":"C","source":"PEB2 Textbook","q":"[L6] Mani et al. (2013): the less well-off use less preventive care, keep fewer appointments, etc. What is the correct conclusion the slide warns about?","opts":["A) Being less productive simply causes people to be poor","B) Poverty has no relationship with productivity","C) One must be careful: the data do not straightforwardly prove \"being less well-off causes being less productive\" (correlation vs. causation)","D) Preventive care always increases income","E) わからない"],"ans":2,"exp":"Mani et al.(2013)のスライドは、相関を因果と短絡しない注意を促す。貧しさと低生産性の相関から「貧しさが低生産性を生む」と単純に結論づけるのは、因果方向や交絡の問題で慎重を要する。科学的主張の評価の例。","we":{"0":"低生産性が貧困を生むと断定するのは因果の早合点。慎重さが論点。","1":"","3":"貧困と生産性に関係が無いという主張ではない。"}},{"id":401,"conceptId":"cSUST_brundtland","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L7] The most popular definition of sustainable development (Brundtland 1987) is development that:","opts":["A) maximizes present consumption regardless of the future","B) keeps GDP growth constant forever","C) replaces all natural capital with human-made capital","D) meets the needs of the present without compromising the ability of future generations to meet their own needs","E) わからない"],"ans":3,"exp":"Brundtland(1987)の定義: 持続可能な開発とは、将来世代が自らのニーズを満たす能力を損なわずに現在のニーズを満たす開発。300超の定義の中で最も広く引用される。","we":{"0":"将来を顧みず現在の消費を最大化するのは持続可能性の定義に反する。","1":"GDP成長の一定維持を求める定義ではない。","2":"自然資本を人工資本で全置換するのは強い持続可能性に反し、定義そのものでもない。"}},{"id":402,"conceptId":"cSUST_strong_weak","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L7] Costanza & Daly distinguish strong vs. weak sustainability. Strong sustainability requires:","opts":["A) maintaining natural capital and human-made capital intact separately","B) maintaining the sum of human-made and natural capital intact","C) maximizing human-made capital only","D) ignoring natural capital entirely","E) わからない"],"ans":0,"exp":"強い持続可能性(strong sustainability)は、自然資本と人工資本を「別々に」非減少に保つことを求める(自然資本は代替不可)。弱い持続可能性は両者の「合計」を保てばよい(代替可能)とする。","we":{"1":"合計を保つのは弱い持続可能性(weak)の定義。","2":"","3":"人工資本のみ最大化は持続可能性の定義ではない。"}},{"id":403,"conceptId":"cSUST_5cs","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L7] Lange & Pfarrer say a good article formulates 5 Cs. Which is one of them?","opts":["A) Commodification","B) Common ground (what is established in the literature)","C) Counterfactual","D) Capital neutrality","E) わからない"],"ans":1,"exp":"Lange & Pfarrer(2017)の5C: Common ground(共通基盤)、Complication(問題化)、Concern(関連性)、Course of action(対処)、Contribution(貢献)。論文の構造を読み書きする枠組みで、講義の各論文分析に用いられる。","we":{"0":"Commodification(商品化)は5Cではない(Costanzaの議論で別出)。","2":"Counterfactual(反事実)はWest et al.の概念で5Cではない。","3":"Capital neutrality(資本中立性)はTAXの概念で無関係。"}},{"id":404,"conceptId":"cSUST_ehrenfeld","ch":"SUST","type":"C","source":"PEB2 Textbook","q":"[L7] Ehrenfeld’s complication is summarized as:","opts":["A) \"Eco-efficiency solves sustainability completely\"","B) \"Business should maximize shareholder value only\"","C) \"Reducing unsustainability is not the same as creating sustainability\"","D) \"Natural and human-made capital are perfectly substitutable\"","E) わからない"],"ans":2,"exp":"Ehrenfeld(2005)の問題化(complication): 「持続不可能性を減らすことは、持続可能性を作ることと同じではない」。現状の企業の取組はBand-Aid(対症療法)にすぎないと批判。貢献は幸福(eudaimonia)に根ざした持続可能性の定義。","we":{"0":"エコ効率が完全解決という主張はEhrenfeldの批判対象(common ground)。","1":"株主価値最大化はFriedmanドクトリンの説明で、Ehrenfeldの問題化そのものではない。","3":"資本の完全代替は弱い持続可能性の前提で、Ehrenfeldの問題化ではない。"}},{"id":405,"conceptId":"cSUST_friedman","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L7] The Friedman doctrine states that:","opts":["A) The social responsibility of business is to reduce its profits for social causes","B) Business should be owned by the state","C) Profits must always be donated to charity","D) The social responsibility of business is to increase its profits (CEOs’ sole responsibility is to maximize shareholder profit, within the law)","E) わからない"],"ans":3,"exp":"Friedmanドクトリン(1970): 企業の社会的責任は利益を増やすこと。CEOの唯一の責任は(法の枠内で)株主の利益を最大化すること。Smithの「見えざる手」のように、利益と効率の追求が社会に最も貢献するとする。反論: 弱い政府/政府の失敗、telecoupling(遠隔影響)。","we":{"0":"社会的目的のため利益を減らすのはFriedmanの主張と逆。","1":"","2":"企業の国有化を説くものではない。"}},{"id":406,"conceptId":"cSUST_jevons","ch":"SUST","type":"C","source":"PEB2 Textbook","q":"[L7] Jevons’ paradox states that efficiency improvements can:","opts":["A) raise total resource consumption (through increased profitability, new uses, and consumer behavior)","B) always reduce total resource consumption to zero","C) have no effect on consumption","D) only apply to renewable energy","E) わからない"],"ans":0,"exp":"Jevonsのパラドックス: 資源利用の効率化は、(1)収益性向上、(2)新用途の発明、(3)消費者行動を通じて、総資源消費を「増やしうる」(リバウンド効果)。Alcottは実測リバウンドが1%未満〜数百%で、ゼロ以下にはならないとした。","we":{"1":"効率化が消費をゼロにするのではなく、逆に増やしうるのがパラドックス。","2":"消費に影響しないのではなく、増加させうる。","3":"再生可能エネルギーに限った話ではない。"}},{"id":407,"conceptId":"cSUST_busch_course","ch":"SUST","type":"C","source":"PEB2 Textbook","q":"[L7] Busch et al.’s \"course of action\" (how to make business cases work) includes:","opts":["A) abandoning all government intervention","B) sustainable entrepreneurship, business-model transformation, and sensitivity to market failures (need for government intervention)","C) maximizing consumerism","D) ignoring market failures entirely","E) わからない"],"ans":1,"exp":"Busch et al.(2024)の対処(course of action): 持続可能な起業(社会的使命が中核; B Corp等)、ビジネスモデル変革(循環型・シェアリング)、市場の失敗への感応(政府介入の必要性を認める)。貢献はシステム視点(影響・協働・抑制)への再定位。","we":{"0":"むしろ政府介入の必要性を認める(完全撤廃ではない)。","2":"消費主義の最大化はBuschの批判対象。","3":"市場の失敗を無視するのではなく、それに感応すべきとする。"}},{"id":408,"conceptId":"cSUST_west_finding","ch":"SUST","type":"C","source":"PEB2 Textbook","q":"[L7] What was West et al.’s key empirical finding on forest-conservation carbon offsets?","opts":["A) All offset projects delivered their promised reductions","B) Offsets reduced more emissions than promised","C) Only about 6% of promised offsets gave actual emission reductions (most overcredited vs. synthetic controls)","D) Counterfactual analysis was impossible","E) わからない"],"ans":2,"exp":"West et al.(2023)は、合成コントロール(事後の反事実)で26件のプロジェクトを評価し、約束された削減のうち実際に削減を生んだのは約6%にすぎないと結論。多くが過大クレジット。事前ベースライン依存の追加性評価の問題を示す。","we":{"0":"すべてが約束を達成したのではなく、ごく一部のみ。","1":"約束以上に削減したのではなく、ほとんどが過大クレジット。","3":"合成コントロールで反事実分析は可能だった(本研究の手法)。"}},{"id":409,"conceptId":"cSUST_counterfactual","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L7] What is a counterfactual in West et al.’s analysis?","opts":["A) The actual observed deforestation in the project area","B) The project developer’s marketing claim","C) The carbon price on the market","D) A hypothetical outcome of what would have happened under a different treatment (e.g., no conservation)","E) わからない"],"ans":3,"exp":"反事実(counterfactual)とは、別の処置(例: 保全しなかった場合)の下で起きたであろう仮想的な結果(「もし〜だったら」)。ランダム化や、観察特性が似た合成コントロール(matching)で作る。追加性の判定に不可欠。","we":{"0":"実際に観測された森林減少は事実であって反事実ではない。","1":"","2":"開発者のマーケティング主張は反事実ではない。"}},{"id":410,"conceptId":"cSUST_boulding","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L8] Boulding (1966) contrasts which two metaphors of the economy?","opts":["A) Cowboy economy vs. spaceman economy","B) Pipeline economy vs. platform economy","C) Cowboy economy vs. pipeline economy","D) Hub economy vs. keystone economy","E) わからない"],"ans":0,"exp":"Boulding(1966)は、無限の資源と消費を前提とする「カウボーイ経済(cowboy economy)」と、閉じた限られた地球で循環を要する「宇宙船経済(spaceman economy)」を対比した。生態経済学の思想的基盤。","we":{"1":"pipeline/platformはDF(デジタル企業)の対比で、Bouldingの対比ではない。","2":"cowboy対pipelineではなく、cowboy対spaceman。","3":"hub/keystoneはIansitiのプラットフォーム概念。"}},{"id":411,"conceptId":"cSUST_malthus","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L8] Malthus argued that population grows geometrically while subsistence grows arithmetically. He was criticized because:","opts":["A) population always grows faster than food in every era","B) fertility rates decrease with income and food production increased faster than population","C) food production cannot increase at all","D) population growth is unrelated to resources","E) わからない"],"ans":1,"exp":"Malthus(1798)は人口が幾何級数的、食料が算術級数的に増えると論じた。批判: 所得上昇で出生率が低下し、食料生産が人口より速く増加した(実証的に外れた)。Limits to Growthはこのロジックを継承(人口→経済、食料→資源)。","we":{"0":"実際には食料が人口より速く増えた時期もあり、常に人口が上回るわけではない。","2":"","3":"食料生産は実際には増加した。"}},{"id":412,"conceptId":"cSUST_solow","ch":"SUST","type":"C","source":"PEB2 Textbook","q":"[L8] Solow (1973) argues that rising prices of exhaustible resources lead to:","opts":["A) immediate collapse of the economy","B) a permanent end to economic growth","C) substitution toward more plentiful materials, raising the productivity of natural resources","D) the impossibility of any substitution","E) わからない"],"ans":2,"exp":"Solow(1973)は、枯渇性資源の価格上昇が、より豊富で安価な材料への代替を促し、資源生産性(GDP当たり資源必要量の低下)を高めると論じた(相対的希少性・代替可能性=弱い持続可能性)。留保: 価格付けされない外部性、持続可能性の十分条件ではない。","we":{"0":"即時の経済崩壊を予測したのではなく、価格による代替を論じた。","1":"経済成長の恒久的終焉ではなく、代替で成長は続きうるとする。","3":"代替が不可能とするのは生態経済学側(強い持続可能性)。Solowは代替可能とする。"}},{"id":413,"conceptId":"cSUST_decoupling_def","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L8] What is the difference between absolute and relative decoupling (Hickel & Kallis)?","opts":["A) Absolute: impact rises slower than GDP; Relative: GDP rises while impact falls","B) Both mean impact and GDP rise at the same rate","C) Both mean GDP falls while impact rises","D) Absolute: GDP increases while impact decreases; Relative: impact increases but slower than GDP","E) わからない"],"ans":3,"exp":"絶対的デカップリング(absolute): GDPが増加しつつ環境影響が「減少」する。相対的デカップリング(relative): 影響は増えるがGDPより緩やかに増える。グリーン成長と呼べるのは絶対的のみ。","we":{"0":"定義が逆。絶対=影響減少、相対=影響はGDPより遅く増加。","1":"両者とも同率上昇ではない。","2":"両者ともGDP減少・影響増加を意味しない。"}},{"id":414,"conceptId":"cSUST_green_growth_evidence","ch":"SUST","type":"C","source":"PEB2 Textbook","q":"[L8] What do Hickel & Kallis (2020) conclude about evidence for green growth (absolute decoupling)?","opts":["A) There is no evidence of absolute decoupling of resource use at the global scale; recent decades show \"recoupling\"","B) There is strong global evidence of absolute decoupling of resource use","C) Global GHG emissions fell steadily every year","D) Decoupling to net-zero will happen within 10 years","E) わからない"],"ans":0,"exp":"Hickel & Kallis(2020): 世界規模での資源利用の絶対的デカップリングの証拠は無く、近年はむしろ「再結合(recoupling/rematerialization)」が見られる。世界のGHGは世界的不況時のみ減少。Global Northの絶対的デカップリングはパリ目標には遅すぎる(Vogel & Hickel: ネットゼロまで200年超)。","we":{"1":"絶対的デカップリングの強い証拠は「無い」とするのが結論。","2":"","3":"GHGは世界的不況時のみ減少し、毎年安定的に減ったわけではない。"}},{"id":415,"conceptId":"cSUST_easterlin","ch":"SUST","type":"C","source":"PEB2 Textbook","q":"[L8] Which statement reflects Easterlin’s paradox?","opts":["A) Income is unrelated to happiness within countries at a point in time","B) Income is positively correlated with happiness within countries at a moment, but is unrelated to happiness across countries and over time","C) Income always raises happiness over time","D) Happiness cannot be measured at all","E) わからない"],"ans":1,"exp":"Easterlinのパラドックス: ある時点・一国内では所得と幸福は正の相関を持つが、国家間および時系列では所得は幸福と無相関。説明候補: 相対所得(地位)、快楽適応、非経済的成長(uneconomic growth)。","we":{"0":"一国内・一時点では所得と幸福は正の相関がある(無相関ではない)。","2":"","3":"時系列では所得は幸福と無相関で、常に幸福を高めるわけではない。"}},{"id":416,"conceptId":"cSUST_doughnut_concept","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L8] What does the doughnut framework (Raworth) add to the planetary boundaries concept?","opts":["A) A maximum GDP ceiling for each country","B) A global carbon tax schedule","C) A social foundation (inner ring) below which human deprivation occurs, alongside the ecological ceiling","D) A ranking of platforms by network effects","E) わからない"],"ans":2,"exp":"ドーナツ枠組み(Raworth)は、惑星限界(生態的天井=外輪)に加え、社会的基盤(内輪: 下回ると人間の困窮が生じる)を加える。Fanning & Raworth(2025)は21の社会指標と13の生態指標で「均衡を欠いた世界」を示した。","we":{"0":"各国のGDP上限を設けるものではない。","1":"","3":"世界炭素税の料率表ではない。"}},{"id":417,"conceptId":"cSUST_world_out_of_balance","ch":"SUST","type":"C","source":"PEB2 Textbook","q":"[L8] Fanning & Raworth’s \"a world out of balance\" observes that typically:","opts":["A) countries that meet more social foundations also stay within ecological ceilings","B) all countries are within both social and ecological limits","C) income has no relation to ecological footprint","D) countries that meet more social foundations tend to exceed more ecological ceilings, while those within planetary boundaries fail to provide social conditions","E) わからない"],"ans":3,"exp":"Fanning & Raworth(2025)/O’Neill et al.(2018): 典型的に、社会的基盤をより多く満たす国ほど生態的天井をより多く超過し、逆に惑星限界内に収まる国は社会的条件を提供できていない。両立の難しさ=「均衡を欠いた世界」。","we":{"0":"むしろ社会的基盤を満たす国ほど生態的天井を超えがち(両立できていない)。","1":"","2":"全ての国が両限界内にあるのではなく、均衡を欠く。"}},{"id":418,"conceptId":"cSUST_valuation_methods","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L8] Which is a revealed preference method for valuing ecosystem services?","opts":["A) Hotelling’s travel cost method and hedonic regression (e.g., house prices)","B) Contingent valuation (asking hypothetical willingness to pay)","C) The arm’s length principle","D) The maximin principle","E) わからない"],"ans":0,"exp":"顕示選好法(revealed preference)は実際の行動から価値を推定: Hotellingの旅行費用法(公園までの移動費用)やヘドニック回帰(住宅価格差で緑地近接・大気質・騒音の価値を推定)。一方、表明選好法(contingent valuation)は仮想的WTPを尋ねる。","we":{"1":"仮想的WTPを尋ねる仮想評価法(contingent valuation)は表明選好法であり、顕示選好法ではない。","2":"","3":"独立企業間原則はTAXの移転価格の概念。"}},{"id":419,"conceptId":"cSUST_vsl","ch":"SUST","type":"C","source":"PEB2 Predicted","q":"[L8] The Value of a Statistical Life (VSL) is used to:","opts":["A) set corporate tax rates on multinationals","B) express the \"benefits of saving a life\" in cost-benefit analyses of safety and pollution standards","C) measure network effects on platforms","D) define strong sustainability","E) わからない"],"ans":1,"exp":"統計的生命価値(VSL)は、安全・汚染基準の費用便益分析で「生命を救う便益」を金銭表現するのに用いる(米EU等で約1000万US$)。仮想的賭けや割引後の将来稼得、政府支出から推定。欠点: 所得に依存する。","we":{"0":"多国籍企業の法人税率設定とは無関係。","2":"","3":"ネットワーク効果の測定はDFの概念。"}},{"id":420,"conceptId":"cSUST_nonexcludable","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L8] Many ecosystem services are public goods. \"Non-excludable\" means:","opts":["A) consumption by one person decreases the amount available to others","B) the good can be sold at a market price easily","C) it is impossible to exclude someone from consumption","D) only the government may consume it","E) わからない"],"ans":2,"exp":"非排除性(non-excludable)は、誰かを消費から排除することが不可能であること。非競合性(non-rival)は、一人の消費が他者の消費可能量を減らさないこと。多くの生態系サービスは両性質を持つ公共財(Costanza 2024)。","we":{"0":"これは競合性(rival)の説明で、非排除性ではない。","1":"","3":"公共財はむしろ市場で容易に売れない(非排除性ゆえタダ乗り)。"}},{"id":421,"conceptId":"cSUST_uber_planet","ch":"SUST","type":"E","source":"PEB2 Textbook","q":"[L7] \"Uber Planet\" lets customers pay ~+5% to offset emissions. Which is a \"con\" raised in the lecture?","opts":["A) Any mitigation of climate change helps","B) It fully decarbonizes Uber’s fleet","C) It eliminates deadheading entirely","D) It shifts responsibility to consumers, the symbolic amount is not enough to offset emissions, and offsets may not deliver promised reductions","E) わからない"],"ans":3,"exp":"Uber Planetの「con(短所)」: 責任を消費者に転嫁する、象徴的な金額では排出を相殺するのに不十分、オフセットは約束された削減を生まないことがある(West et al.の知見)。Proは「どんな緩和も助けになる」。","we":{"0":"これはpro(長所)の側の主張。","1":"","2":"+5%課金は車両を完全脱炭素化しない。"}},{"id":422,"conceptId":"cSUST_wright_framing","ch":"SUST","type":"C","source":"PEB2 Predicted","q":"[L7] In Wright & Nyberg’s model, the three stages by which firms translate climate change into business-as-usual are:","opts":["A) Framing, localizing, and normalizing","B) Resourcing, securing, and integrating","C) Common ground, complication, and contribution","D) Cowboy, spaceman, and steady-state","E) わからない"],"ans":0,"exp":"Wright & Nyberg(2017)の3段階: Framing(連想/非連想)、Localizing(取り込み・指標化・布教)、Normalizing(純化・希釈)。最終的に当初の気候への取組が支配的言説に再整合され通常業務に戻る。","we":{"1":"resourcing/securingはDF(境界資源モデル)の概念。","2":"","3":"common ground等はLange & Pfarrerの5Cの一部。"}},{"id":423,"conceptId":"cSUST_intrinsic_rights","ch":"SUST","type":"C","source":"PEB2 Textbook","q":"[L8] Why does Costanza (2024) hold that intrinsic values cannot be translated to monetary estimates?","opts":["A) Because they are the same as instrumental values","B) Because they concern the rights of nature (e.g., legal personhood like the Whanganui River)","C) Because they are easy to price via travel cost","D) Because they only apply to private goods","E) わからない"],"ans":1,"exp":"Costanza(2024)は、内在的価値が「自然の権利(rights of nature)」に関わるため金銭推定に翻訳できないとする(例: NZのWhanganui川の法人格、エクアドルのPachamama)。生態系サービス評価は権利ベースのアプローチと補完的。","we":{"0":"内在的価値は手段的価値とは別で、金銭化しやすい手段的価値とは異なる。","2":"","3":"旅行費用法で容易に価格付けできるのは手段的(利用)価値。内在的価値は不可。"}},{"id":424,"conceptId":"cSUST_contingent_valuation","ch":"SUST","type":"C","source":"PEB2 Predicted","q":"[L8] Diamond & Hausman (1994) criticize contingent valuation (CV) because of issues such as:","opts":["A) it perfectly measures willingness to pay with no bias","B) it relies only on revealed market behavior","C) embedding/scope effects (WTP_total ≈ WTP_part) and order effects, suggesting policy is better informed by expert opinion","D) it is identical to hedonic regression","E) わからない"],"ans":2,"exp":"Diamond & Hausman(1994)はCV(仮想評価法)を批判: 埋め込み/スコープ効果(全体WTP≒部分WTP)、順序効果、支払手段で異なるWTP、WTP≠WTA(保有効果)。政策は専門家意見でより良く判断されるとする。賛成側はKling et al.(ベストプラクティス遵守で妥当)。","we":{"0":"CVが偏りなく完全に測定できるとは批判者は考えない(むしろ偏りを指摘)。","1":"","3":"CVは表明選好法で、顕示された市場行動に依拠するのは顕示選好法。"}},{"id":425,"conceptId":"cSUST_biodiversity_importance","ch":"SUST","type":"A","source":"PEB2 Textbook","q":"[L8] Which is a reason given for why biodiversity conservation is important?","opts":["A) Biodiversity loss improves ecosystem efficiency","B) Biodiversity loss has no effect on disease transmission","C) Biodiversity loss raises GDP automatically","D) Biodiversity loss harms ecosystem efficiency and stability and increases risks of infectious diseases","E) わからない"],"ans":3,"exp":"生物多様性損失は、(1)生態系効率を損ない(Cardinale et al.)、(2)生態系安定性を損ない(Rockström et al.)、(3)感染症リスクを高める(Keesing et al.)。単一種依存の生態系は撹乱に脆弱。","we":{"0":"損失は効率を「改善」するのではなく損なう。","1":"","2":"損失はむしろ病原体伝播・疾病発生を「増やす」。"}},{"id":426,"conceptId":"cSUST_postgrowth","ch":"SUST","type":"C","source":"PEB2 Predicted","q":"[L8] Kallis et al. (2025) on post-growth argues that:","opts":["A) continued growth is unlikely to be environmentally sustainable or socially beneficial (especially in high-income countries), questioning growth’s feasibility and desirability","B) economic growth in high-income countries is the surest path to sustainability","C) absolute decoupling has already been achieved globally","D) the Easterlin paradox proves income always raises wellbeing","E) わからない"],"ans":0,"exp":"Kallis et al.(2025)のポストグロース: 特に高所得国では継続的成長が環境的に持続可能でも社会的に有益でもなさそうとし、成長の実現可能性と望ましさを問う。Limits to Growthのレビュー、絶対的デカップリングの否定、Easterlinパラドックスのレビューを行い、ポストグロース政策を提示。","we":{"1":"高所得国の成長を持続可能性への確実な道とはせず、むしろ疑問視する。","2":"","3":"絶対的デカップリングは世界規模で達成されていないとする(Hickel & Kallis)。"}}];

</script>
<script>
/* =========================================================
   PEB2 Quiz Engine — vanilla JS, Canvas-derived content only
   ========================================================= */
"use strict";
var QUESTIONS = window.QUESTIONS || [];
var DK_LABEL = "E) わからない";

/* ---- source -> passMode mapping ----
   0=全範囲, 2=教科書(Textbook), 3=過去問(Mock Exam), 4=Exercise, 5=Problem, 6=予想問題(Predicted) */
function passModeOf(src){
  if(/Mock Exam|Sample Exam|Past Exam/i.test(src)) return 3;
  if(/Textbook/i.test(src)) return 2;
  if(/Exercise/i.test(src)) return 4;
  if(/Problem/i.test(src)) return 5;
  if(/Predicted/i.test(src)) return 6;
  return 2;
}
var WEEK_OF = {DF:1,TAX:1,MLM:2,SUST:2};
var CH_LABEL = {DF:"DF デジタル企業",TAX:"EoT 課税",MLM:"MLM 市場の道徳",SUST:"Sust 持続可能性"};

/* ---- persistent state ---- */
var LS="peb2_v1";
function loadLS(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return{}}}
function saveLS(o){try{localStorage.setItem(LS,JSON.stringify(o))}catch(e){}}
var store = loadLS();
store.cat = store.cat||{};          // id -> category
store.prompted = store.prompted||{}; // id -> true if prompt copied
store.filters = store.filters||{};

var quizState = {
  block:[], blockResults:[], index:0, answered:false, chosen:-1,
  modes: store.filters.modes || ['all'],
  selectedWeeks: store.filters.selectedWeeks || [],
  selectedChs: store.filters.selectedChs || [],
  passModes: store.filters.passModes || [0]
};
var batchLog = []; // questions answered since last copy (for batch prompt)

/* ---- SM2 spaced repetition (separate storage; survives history reset) ---- */
var SM2_LS="peb2_sm2";
function loadSM2(){try{return JSON.parse(localStorage.getItem(SM2_LS))||{}}catch(e){return{}}}
function saveSM2(){try{localStorage.setItem(SM2_LS,JSON.stringify(SM2))}catch(e){}}
var SM2=loadSM2();
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function getSM2(id){return SM2[id]||{ef:2.5,interval:1,reps:0,nextReview:todayStr(),lastQ:null};}
function updateSM2(id,quality){
  var s=getSM2(id);
  if(quality<3){s.reps=0;s.interval=1;}
  else{ if(s.reps===0)s.interval=1; else if(s.reps===1)s.interval=6; else s.interval=Math.round(s.interval*s.ef); s.reps++; }
  s.ef=Math.max(1.3, s.ef+(0.1-(5-quality)*(0.08+(5-quality)*0.02)));
  s.lastQ=quality;
  var n=new Date(); n.setDate(n.getDate()+s.interval);
  s.nextReview=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
  SM2[id]=s; saveSM2();
  return s;
}
function isDue(id){var s=SM2[id]; return !s || s.nextReview<=todayStr();}
function dueCount(){return QUESTIONS.filter(function(q){return isDue(q.id);}).length;}
function rateSM2(id,quality,btn){
  var s=updateSM2(id,quality);
  Array.prototype.forEach.call(document.querySelectorAll('.sm2-btn'),function(b){b.disabled=true;});
  if(btn) btn.classList.add('picked');
  var meta=document.querySelector('.sm2-meta');
  if(meta) meta.textContent='次回復習: '+s.nextReview+'（'+s.interval+'日後）・ 連続正解 '+s.reps+'回 ・ EF '+s.ef.toFixed(2);
  toast('記録しました：'+s.interval+'日後に復習');
  updateStat();
}

/* ---- option shuffling (stratified) ---- */
function shuffleQuestionOptionsAt(q, targetSlot){
  // real options = indices 0..(n-2); last = わからない (fixed)
  var n = q.opts.length;
  var dk = q.opts[n-1];
  var real = q.opts.slice(0,n-1).map(function(s){return s.replace(/^[A-E]\)\s*/,'');});
  var correctText = real[q.ans];
  // wrong reasons mapped by original index
  var weByText = {};
  if(q.we) Object.keys(q.we).forEach(function(k){ weByText[real[+k]] = q.we[k]; });
  // fisher-yates on distractors
  var distract = real.filter(function(_,i){return i!==q.ans;});
  for(var i=distract.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=distract[i];distract[i]=distract[j];distract[j]=t;}
  var slots = new Array(real.length).fill(null);
  var ts = Math.max(0,Math.min(real.length-1,targetSlot));
  slots[ts]=correctText;
  var di=0; for(var p=0;p<slots.length;p++){if(slots[p]===null)slots[p]=distract[di++];}
  var letters=["A","B","C","D","E","F"];
  var newOpts = slots.map(function(txt,idx){return letters[idx]+") "+txt;});
  newOpts.push(dk);
  var newWe={};
  slots.forEach(function(txt,idx){ if(txt!==correctText && weByText[txt]!==undefined) newWe[idx]=weByText[txt]; });
  return {opts:newOpts, ans:ts, we:newWe};
}
function shuffleBlockOptions(block){
  var nReal = 4;
  // stratified targets: cycle 0..3, then anti-streak (no 3 same in a row)
  var targets=[]; for(var i=0;i<block.length;i++) targets.push(i%nReal);
  for(var s=targets.length-1;s>0;s--){var j=Math.floor(Math.random()*(s+1));var t=targets[s];targets[s]=targets[j];targets[j]=t;}
  // anti-streak
  for(var i=2;i<targets.length;i++){
    if(targets[i]===targets[i-1] && targets[i-1]===targets[i-2]){
      for(var k=i+1;k<targets.length;k++){ if(targets[k]!==targets[i]){var tmp=targets[i];targets[i]=targets[k];targets[k]=tmp;break;} }
    }
  }
  block.forEach(function(q,idx){
    var r=shuffleQuestionOptionsAt(q, targets[idx]%((q.opts.length-1)||4));
    q._opts=r.opts; q._ans=r.ans; q._we=r.we;
  });
}

/* ---- filtering: week×ch×passModes (AND) × modes (OR) ---- */
function categoryOf(id){ return store.cat[id]||null; }
function getFilteredQuestions(){
  var sw=quizState.selectedWeeks, sc=quizState.selectedChs, pm=quizState.passModes, modes=quizState.modes;
  return QUESTIONS.filter(function(q){
    if(sw.length && sw.indexOf(WEEK_OF[q.ch])<0) return false;
    if(sc.length && sc.indexOf(q.ch)<0) return false;
    if(!(pm.length===0 || pm.indexOf(0)>=0)){
      if(pm.indexOf(passModeOf(q.source))<0) return false;
    }
    if(modes.indexOf('all')>=0) return true;
    // OR union across selected modes
    var cat=categoryOf(q.id);
    var ok=false;
    if(modes.indexOf('wrong')>=0 && (cat==='wrong'||cat==='wrong_studied')) ok=true;
    if(modes.indexOf('dk')>=0 && cat==='dk') ok=true;
    if(modes.indexOf('unanswered')>=0 && !cat) ok=true;
    if(modes.indexOf('due')>=0 && isDue(q.id)) ok=true;
    return ok;
  });
}

/* ---- build / render ---- */
function buildBlock(){
  var list=getFilteredQuestions().slice();
  // shuffle order
  for(var i=list.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=list[i];list[i]=list[j];list[j]=t;}
  quizState.block=list; quizState.blockResults=new Array(list.length); quizState.index=0;
  shuffleBlockOptions(list);
  batchLog=[];
}
function curQ(){return quizState.block[quizState.index];}

function renderQuestion(){
  var area=document.getElementById('q-area');
  var nav=document.getElementById('q-nav');
  if(!quizState.block.length){
    area.innerHTML='<div class="empty">該当する問題がありません。<br>フィルターを変更してください。</div>';
    nav.style.display='none';
    document.getElementById('q-stat').innerHTML='';
    document.getElementById('q-prog').style.width='0%';
    return;
  }
  nav.style.display='flex';
  var q=curQ();
  var prev=quizState.blockResults[quizState.index];
  var answered=!!prev;
  var isExam=passModeOf(q.source)===3;
  var srcCls='src'+(isExam?' exam':'');
  var html='';
  html+='<div class="card">';
  html+='<div class="qmeta"><span class="'+srcCls+'">'+esc(q.source)+'</span>'+
        '<span>'+CH_LABEL[q.ch]+' · Week '+WEEK_OF[q.ch]+' · '+(quizState.index+1)+'/'+quizState.block.length+'</span></div>';
  html+='<div class="qtext">'+esc(q.q)+'</div>';
  if(q.fig) html+='<div class="fig">'+q.fig+'</div>';
  var chosen = answered? prev.chosen : -1;
  for(var i=0;i<q._opts.length;i++){
    var cls='opt';
    var isDkOpt=(i===q._opts.length-1);
    if(answered){
      cls+=' disabled';
      if(i===q._ans) cls+=' correct';
      else if(i===chosen) cls+=' wrong';
    }
    var lt=q._opts[i].slice(0,2);
    var body=q._opts[i].slice(2).trim();
    html+='<button class="'+cls+'" data-i="'+i+'"'+(answered?' disabled':'')+'>'+
          '<span class="lt">'+esc(lt)+'</span>'+esc(body)+'</button>';
  }
  // explanation (restore if answered)
  html+='<div class="exp'+(answered?' show':'')+'" id="exp">';
  html+='<div class="h">解説</div>'+esc(q.exp);
  if(q._we && Object.keys(q._we).length){
    html+='<div class="we"><b>誤答の理由:</b>';
    var lets=["A","B","C","D","E"];
    Object.keys(q._we).sort().forEach(function(k){ html+='<div>'+lets[k]+') '+esc(q._we[k])+'</div>'; });
    html+='</div>';
  }
  html+='</div>';
  // SM2 spaced-repetition rating (only after answering)
  if(answered){
    var sm=getSM2(q.id);
    html+='<div class="sm2"><div class="h">🧠 記憶度を記録（間隔反復スケジューリング）</div>';
    html+='<div class="sm2-meta">次回復習: '+sm.nextReview+(sm.lastQ===null?'（未評価）':'（連続正解 '+sm.reps+'回・EF '+sm.ef.toFixed(2)+'）')+'</div>';
    html+='<div class="sm2-row">';
    var rates=[[0,'😵','忘れた'],[2,'😟','間違えた'],[3,'🤔','キツい'],[4,'😊','少し迷い'],[5,'😎','即答']];

      b.onclick=function(){ rateSM2(q.id, +b.getAttribute('data-q'), b); };
    });
  }

  // nav buttons
  document.getElementById('btn-prev').disabled=(quizState.index===0);
  document.getElementById('btn-next').textContent=(quizState.index===quizState.block.length-1)?'最初へ ▶':'次へ ▶';

}

function selectOption(idx){
  var q=curQ();
  if(quizState.blockResults[quizState.index]) return;
  var isDk=(idx===q._opts.length-1);
  var correct=(idx===q._ans);
  var usedPrompt=!!store.prompted[q.id];
  var category = isDk?'dk':(correct?(usedPrompt?'review':'correct'):(usedPrompt?'wrong_studied':'wrong'));
  store.cat[q.id]=category; saveLS(store);
  var res={q:q,chosen:idx,correct:correct,isDk:isDk,usedAnalysis:usedPrompt,usedVerify:false,category:category};
  quizState.blockResults[quizState.index]=res;
  batchLog.push(res);
  renderQuestion();
}

function nextQuestion(){
  if(quizState.index<quizState.block.length-1) quizState.index++;
  else { buildBlock(); }
  renderQuestion();
  document.getElementById('p-quiz').scrollIntoView({behavior:'smooth',block:'start'});
}
function prevQuestion(){
  if(quizState.index>0){quizState.index--;renderQuestion();
    document.getElementById('p-quiz').scrollIntoView({behavior:'smooth',block:'start'});}
}

function answeredCount(){return batchLog.length;}
function updateStat(){
  var done=quizState.blockResults.filter(Boolean).length;
  var corr=quizState.blockResults.filter(function(r){return r&&r.correct;}).length;
  var wr=quizState.blockResults.filter(function(r){return r&&!r.correct&&!r.isDk;}).length;
  var dk=quizState.blockResults.filter(function(r){return r&&r.isDk;}).length;
  document.getElementById('q-stat').innerHTML=
    '<span>📚 '+quizState.block.length+'問</span>'+
    '<span style="color:#3fb950">✅ '+corr+'</span>'+
    '<span style="color:#f85149">❌ '+wr+'</span>'+
    '<span style="color:#8b949e">❓ '+dk+'</span>'+
    '<span>進捗 '+done+'/'+quizState.block.length+'</span>';
  document.getElementById('q-prog').style.width=(quizState.block.length?Math.round(done/quizState.block.length*100):0)+'%';
}

/* ---- filter chips ---- */
function buildFilters(){
  // week
  var fw=document.getElementById('f-week'); fw.innerHTML='';
  [[1,'Week 1（DF・EoT課税）'],[2,'Week 2（MLM・Sust）']].forEach(function(p){
    fw.appendChild(chip(p[1], quizState.selectedWeeks.indexOf(p[0])>=0, function(el){
      toggle(quizState.selectedWeeks,p[0]); el.classList.toggle('on'); persist(); refreshQuiz();}));
  });
  // ch
  var fc=document.getElementById('f-ch'); fc.innerHTML='';
  ['DF','TAX','MLM','SUST'].forEach(function(c){
    fc.appendChild(chip(CH_LABEL[c], quizState.selectedChs.indexOf(c)>=0, function(el){
      toggle(quizState.selectedChs,c); el.classList.toggle('on'); persist(); refreshQuiz();}));
  });
  // pass/source
  var fp=document.getElementById('f-pass'); fp.innerHTML='';
  [[0,'全範囲'],[3,'過去問 (Mock)'],[2,'教科書/講義'],[6,'予想問題']].forEach(function(p){
    fp.appendChild(chip(p[1], quizState.passModes.indexOf(p[0])>=0, function(el){
      passToggle(p[0]); buildFilters(); persist(); refreshQuiz();}));
  });
  // mode
  var fm=document.getElementById('f-mode'); fm.innerHTML='';
  [['all','すべて'],['due','復習予定('+dueCount()+')'],['wrong','復習(誤答)'],['dk','わからない'],['unanswered','未回答']].forEach(function(p){
    var c=chip(p[1], quizState.modes.indexOf(p[0])>=0, function(el){ modeToggle(p[0]); buildFilters(); persist(); refreshQuiz();});
    c.classList.add('mode'); fm.appendChild(c);
  });
}
function chip(label,on,fn){var b=document.createElement('button');b.className='chip'+(on?' on':'');b.textContent=label;b.onclick=function(){fn(b);};return b;}
function toggle(arr,v){var i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);}
function passToggle(v){
  if(v===0){quizState.passModes=[0];return;}
  var i=quizState.passModes.indexOf(v);
  if(i>=0)quizState.passModes.splice(i,1); else quizState.passModes.push(v);
  var z=quizState.passModes.indexOf(0); if(z>=0)quizState.passModes.splice(z,1);
  if(!quizState.passModes.length)quizState.passModes=[0];
}
function modeToggle(v){
  if(v==='all'){quizState.modes=['all'];return;}
  var i=quizState.modes.indexOf(v);
  if(i>=0)quizState.modes.splice(i,1); else quizState.modes.push(v);
  var a=quizState.modes.indexOf('all'); if(a>=0)quizState.modes.splice(a,1);
  if(!quizState.modes.length)quizState.modes=['all'];
}
function persist(){
  store.filters={modes:quizState.modes,selectedWeeks:quizState.selectedWeeks,selectedChs:quizState.selectedChs,passModes:quizState.passModes};
  saveLS(store);
}
function refreshQuiz(){ buildBlock(); renderQuestion(); }

var RULES =
"【作問ルール（厳守）】\n"+
"1. 同じ概念を、新しいシナリオ・数値で問う（問題文のコピペ禁止）。\n"+
"2. 形式は5択（A〜E）。E)は必ず「わからない」。\n"+
"3. 正解位置を完全ランダムに。まず [D,A,E,C,B] のように正解配列を決めてから本文を書く。B偏り禁止。\n"+
"3b. 正解は必ず1つだけ。複数正解・等価判定（A and B both correct / Either A or B 等）は禁止。誤答は明確に誤りと分かる選択肢にする。\n"+
"4. 計算問題は substitution（代入）形式で段階的に。\n"+
"5. 難易度は 基礎→本番レベル へ。\n"+
"6. 出典は UvA Canvas 教材（講義スライド・Mock Exam・指定論文）のみ。Canvas外の一般知識・他大学資料・Student wiki は使用禁止。\n"+
"7. 言語: 問題文と選択肢は英語、解説は日本語。数式はLaTeX、グラフは言葉で記述。\n";

function qBlock(q){
  var lets=["A","B","C","D","E"];
  var s="- 出典: "+q.source+" / トラック: "+CH_LABEL[q.ch]+"\n";
  s+="- 問題: "+q.q+"\n";
  for(var i=0;i<q._opts.length;i++) s+="  "+q._opts[i]+"\n";
  s+="- 正解: "+lets[q._ans]+") "+q._opts[q._ans].slice(2).trim()+"\n";
  var r=quizState.blockResults[quizState.index];
  if(r){ s+="- あなたの解答: "+(r.isDk?"わからない":lets[r.chosen])+"（"+(r.correct?"正解":"不正解")+"）\n"; }
  s+="- 解説: "+q.exp+"\n";
  return s;
}
function copyAnalyze(q){
  markPromptUsed(q);
  var t="あなたは PEB2（Principles of Economics and Business 2）の経済学講師です。【Opus 4.8】\n"+
    "以下の問題について、私の理解を深める詳しい解説をしてください。なぜ正解が正解で、各誤答がなぜ誤りかを、関連する講義概念・論文と結びつけて説明し、つまずきやすい点を指摘してください。最後に、同じ概念を別角度から確認する一問一答を3問（5択・E=わからない）出してください。\n\n"+
    qBlock(q)+"\n"+RULES;
  doCopy(t,"📋 分析プロンプトをコピーしました");
}
function copyTest(q){
  markPromptUsed(q);
  var t="あなたは PEB2 の経済学講師です。【Opus 4.8】\n"+
    "次の問題と同じ概念を扱う確認テストを5問作ってください。シナリオと数値は変え、コピペは禁止。各問5択（A〜E、E=わからない）、正解は1つだけ。出題後に解答と日本語解説をまとめて提示してください。\n\n"+
    "【対象概念】\n"+qBlock(q)+"\n"+RULES;
  doCopy(t,"🎯 確認テストをコピーしました");
}
function copyBatch(){
  if(!batchLog.length){doCopy("",""); return;}
  var cats={wrong:[],wrong_studied:[],dk:[],review:[],correct:[]};
  batchLog.forEach(function(r){ (cats[r.category]||cats.correct).push(r); });
  var lets=["A","B","C","D","E"];
  function dump(arr){ return arr.map(function(r){var q=r.q;
    return "  ・["+q.source+"/"+q.ch+"] "+q.q+"\n     正解:"+lets[q._ans]+" / あなた:"+(r.isDk?"わからない":lets[r.chosen]); }).join("\n"); }
  var t="あなたは PEB2 の経済学講師です。【Opus 4.8】\n"+
    "以下は私が解いた"+batchLog.length+"問のバッチです。5カテゴリ（⚠️誤答+確認 / ❌単純誤答 / ❓わからない / 🔍正解+確認 / ✅完全正解）に分けて講評し、私の弱点TOP3を特定してください。最後に弱点を補強する確認テストを15問（5択・E=わからない・正解1つだけ）作り、解答と日本語解説を付けてください。\n\n";
  t+="⚠️ 誤答＋要確認(wrong_studied):\n"+(dump(cats.wrong_studied)||"  （なし）")+"\n\n";
  t+="❌ 単純誤答(wrong):\n"+(dump(cats.wrong)||"  （なし）")+"\n\n";
  t+="❓ わからない(dk):\n"+(dump(cats.dk)||"  （なし）")+"\n\n";
  t+="🔍 正解＋要確認(review):\n"+(dump(cats.review)||"  （なし）")+"\n\n";
  t+="✅ 完全正解(correct):\n"+(dump(cats.correct)||"  （なし）")+"\n\n";
  t+=RULES;
  doCopy(t,"📦 バッチを封印してコピーしました");
  batchLog=[]; renderQuestion();
}
function markPromptUsed(q){
  store.prompted[q.id]=true;
  // re-judge category if already answered
  var c=store.cat[q.id];
  if(c==='correct') store.cat[q.id]='review';
  if(c==='wrong') store.cat[q.id]='wrong_studied';
  saveLS(store);
}
function doCopy(text,msg){
  if(!text){return;}
  function ok(){toast(msg);}
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok,function(){fallbackCopy(text,ok);});
  } else fallbackCopy(text,ok);
}
function fallbackCopy(text,cb){
  var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');cb();}catch(e){}
  document.body.removeChild(ta);
}
var toastT;
function toast(m){var el=document.getElementById('toast');el.textContent=m;el.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show');},1800);}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

}

  defJA:'**Switching costs**（スイッチングコスト）は、別のサービスへ乗り換えるときに発生する費用（手間・お金・データ移行・学び直し）です。ソフト市場では大きくなりがちで、ユーザーを囲い込み既存企業を有利にします。**network effects** と組んで独占を強めます。',
  example:'Moving years of email, contacts and calendar data out of Gmail is costly and risky, so users stay \u2014 a high switching cost.',
  whyNeeded:'囲い込みは独占の源泉であり、**multihoming**（複数併用）を促す規制（Tirole/DMA）の標的になる。',
  mistakes:['Switching costs は需要側の囲い込み。供給側の固定費(**fixed costs**)と混同しない。'],
  memorize:null
},
{
  id:'cDF_pipeline_platform', ch:'DF', name:'Pipeline vs Platform', star:true,
  scene:'Fordはゴム農園まで自分で持ち、線形に車を作って売りました（pipeline）。Uberは何も所有せず、運転手と乗客を「つなぐ」だけ（platform）。価値の作り方が正反対です。',
  compare:{ a:'Pipeline', b:'Platform', table:[
    {dim:'Value creation', a:'Optimize a linear value chain (source \u2192 make \u2192 sell)', b:'Mediate interactions between external producers & consumers'},
    {dim:'Assets', a:'Owns physical infrastructure', b:'Need not own infrastructure; capitalises on network effects'},
    {dim:'Sides', a:'One-sided', b:'Multi-sided (two or more user groups)'},
    {dim:'Focus', a:'Resource control & efficiency', b:'Ecosystem value & network growth'} ]},
  punchline:'Pipelines create value by optimizing a linear value chain; platforms create value by mediating interactions between external producers and consumers.',
  defEN:'A **pipeline** business creates value through a step-by-step **linear value chain** (sourcing, manufacturing, reselling, service). A **platform** creates value by **mediating interactions** in a **multi-sided market**, without needing to own the physical infrastructure (Van Alstyne et al., 2016).',
  defJA:'**Pipeline**（パイプライン）は「仕入→製造→販売」の **linear value chain** を最適化して価値を生みます。**Platform**（プラットフォーム）は外部の生産者と消費者の **interactions を仲介** して価値を生み、物理インフラを所有する必要がありません。試験頻出：pipelineの価値創造＝**optimizing a linear value chain**。',
  example:'How do pipeline businesses primarily create value? By optimizing a linear value chain \u2014 not by facilitating interactions, subsidizing a side, or leveraging user data (those describe platforms).',
  whyNeeded:'プラットフォーム戦略・hub・統合戦略すべての出発点。「物理インフラを所有しなくてよい」点がデジタル市場の新しさ。',
  mistakes:['Pipelineの価値創造を「facilitating interactions between users」と答えるのは誤り（それはplatform）。',
    'プラットフォームは新しくない（新聞・モールも platform）。新しいのは **physical infrastructure を所有しなくてよい** 点。'],
  memorize:'Pipeline = pipe (linear); Platform = mediator (multi-sided)'
},
{
  id:'cDF_three_transitions', ch:'DF', name:'Three Transitions to Platform Strategy', star:false,
  scene:'パイプライン企業がプラットフォームになるには、考え方を3つ転換する必要があります（Van Alstyne et al., 2016）。',
  compare:null,
  punchline:'Van Alstyne et al. (2016): from resource control to resource orchestration; from internal optimization to external interaction; from customer value to ecosystem value.',
  defEN:'The three strategic transitions are: (1) from **resource control** to **resource orchestration** (the network, not assets, is the asset); (2) from **internal optimization** to **external interaction** (govern producers and consumers); (3) from **customer value** to **ecosystem value**.',
  defJA:'プラットフォーム化に必要な3つの転換：①**resource control → resource orchestration**（所有する資源より、外部参加者のネットワークを編成する）②**internal optimization → external interaction**（社内の生産ラインより、外部の生産者・消費者の相互作用を統治する）③**customer value → ecosystem value**（個別顧客より、エコシステム全体の価値）。',
  example:'A pipeline optimizes its own factory (internal optimization); a platform instead governs millions of external producers and consumers (external interaction).',
  whyNeeded:'「なぜ既存の優良企業が数年で市場を失うのか」というPorter/Van Alstyneの問いへの答え。',
  mistakes:['3つの転換を「効率化の話」と矮小化しない。核心は資産支配からネットワーク編成への発想転換。'],
  memorize:'Control\u2192Orchestrate; Internal\u2192External; Customer\u2192Ecosystem'
},
{
  id:'cDF_economies_scale', ch:'DF', name:'Economies of Scale: Supply vs Demand Side', star:true,
  scene:'工場は「作るほど安くなる」（供給側）。プラットフォームは「参加者が増えるほど価値が上がる」（需要側）。スケールの効き方が違います。',
  compare:{ a:'Supply-side (traditional)', b:'Demand-side (platform)', table:[
    {dim:'Source', a:'Spread large fixed costs over volume', b:'Network value attracts participants'},
    {dim:'Marginal cost', a:'Low marginal costs', b:'\u2248 No marginal cost'},
    {dim:'Targets', a:'Resource control, efficiency, fend off 5 forces', b:'More participants, more transactions, more value per transaction'} ]},
  punchline:'Traditional economies of scale are supply-side (spread fixed costs over volume); platform economies of scale are demand-side (network value attracts participants).',
  defEN:'Traditional firms gain **supply-side economies of scale**: large fixed costs and low marginal costs reward high volume. Platforms gain **demand-side economies of scale**: greater network value attracts more participants, with near-zero marginal cost.',
  defJA:'**Supply-side economies of scale**（供給側）は、大きな固定費を大量生産で薄める伝統的な仕組み。**Demand-side economies of scale**（需要側）は、ネットワーク価値が参加者を引き寄せる仕組みで、限界費用がほぼゼロ。プラットフォームは需要側で効きます。',
  example:'A factory lowers unit cost by producing more (supply side). Spotify becomes more valuable as more listeners and artists join, at almost no extra cost (demand side).',
  whyNeeded:'需要側スケール＝network effectsの経済的表現。winner-takes-allの説明に直結。',
  mistakes:['プラットフォームのスケールを「supply side」と答えない。正解は **demand side**。',
    '両者とも **large fixed costs** を持つ点は共通（違いは marginal cost と targets）。'],
  memorize:'Traditional = Supply side; Platform = Demand side'
},
{
  id:'cDF_hub_firms', ch:'DF', name:'Hub Firms', star:true,
  scene:'Google, Apple, Amazon——少数の企業がボトルネックを握り、つながる全産業から不釣り合いに大きな価値を吸い上げます（Iansiti & Lakhani, 2017）。',
  compare:null,
  punchline:'Hub firms control bottlenecks connecting many users, capture a disproportionate and expanding share of value, and are self-reinforcing.',
  defEN:'**Hub firms** (Iansiti & Lakhani, 2017) connect consumers with the technology of other parties, **control bottlenecks**, **capture a disproportionate and expanding share of value**, and are **self-reinforcing**. They use network-based assets from one setting to enter and transform another market from product-driven to network-driven.',
  defJA:'**Hub firms**（ハブ企業）は、多数のユーザーをつなぐプラットフォームを支配し、**bottleneck**（ボトルネック）を握って不釣り合いに大きく拡大する価値を獲得し、**self-reinforcing**（自己強化的）に成長します。あるネットワーク資産を使って隣接産業に参入し、その市場を製品駆動からネットワーク駆動へ転換します。',
  example:'What mechanism causes successful hubs to grow faster over time? **Positive feedback loops from usage** \u2014 not state funding, manufacturing economies of scale, or exclusive licensing.',
  whyNeeded:'デジタル経済の権力集中を説明する中心概念。規制論(Tirole)の動機。',
  mistakes:['Hub firmsを「主に物理財を生産する企業」と答えない。正解は「多数のユーザーをつなぐプラットフォームを支配する企業」。',
    'hubが速く成長する原因は **positive feedback loops from usage**（利用の正のフィードバック）であって、国家保護や独占ライセンスではない。'],
  memorize:'Hub = bottleneck + disproportionate value + self-reinforcing'
},
{
  id:'cDF_boundary_resources', ch:'DF', name:'Boundary Resources Model', star:true,
  scene:'AppleはSDK・API・App Store・規約を第三者開発者に渡します。これらが「プラットフォーム所有者」と「外部開発者」をつなぐ接着剤です（Ghazawneh & Henfridsson, 2013）。',
  compare:null,
  punchline:'Boundary resources (SDKs, APIs, tools, agreements) let a platform owner support third-party development while balancing openness against control.',
  defEN:'**Boundary resources** are resources \u2014 software development kits (SDKs), APIs, tools, and regulations \u2014 initiated by the **platform owner** to support **third-party developers** who build applications for end users. They are the interface that balances external contribution with platform control.',
  defJA:'**Boundary resources**（境界資源）は、**platform owner** が **third-party developer**（第三者開発者）の開発を支援するために提供する資源——**SDK**・**API**・ツール・規約（developer agreements）——です。プラットフォームの中核モジュールへ簡単にアクセスさせ、外部の貢献と統制のバランスをとる「接着剤」です。',
  example:'Apple\u2019s SDK and APIs (e.g., GPS) let independent developers build apps for iPhone users \u2014 classic boundary resources connecting owner and third parties.',
  whyNeeded:'**Resourcing vs Securing** のバランス論の前提。第三者開発の定義も頻出。',
  mistakes:['Third-party developmentを「開発者はプラットフォーム所有者の従業員」と答えない。正解は「独立したアクターがエンドユーザー向けにアプリを開発」。'],
  memorize:'Boundary resources = SDK + API + tools + agreements'
},
{
  id:'cDF_resourcing_securing', ch:'DF', name:'Resourcing vs Securing', star:true,
  scene:'プラットフォーム所有者は2つの相反する力でバランスをとります：もっと開かせる(resourcing) vs もっと統制する(securing)。Appleの歴史がその綱引きの記録です。',
  compare:{ a:'Resourcing', b:'Securing', table:[
    {dim:'Goal', a:'Expand scope & diversity of the platform', b:'Increase control over the platform'},
    {dim:'Mechanism', a:'New apps by third parties; APIs, SDK', b:'Developer agreements, licensing, app review'},
    {dim:'Risk if overdone', a:'Loss of control, malicious apps', b:'Reduced third-party participation'} ]},
  punchline:'Resourcing expands a platform\u2019s scope and diversity; securing increases the owner\u2019s control \u2014 owners must balance the two.',
  defEN:'**Resourcing** is the process by which the **scope and diversity** of a platform is enhanced (more third-party apps, more APIs). **Securing** is the process by which the **control** of a platform and its services is increased (developer agreements, licensing, review). Control ranges on a continuum from tight (automotive) to loose (open-source communities).',
  defJA:'**Resourcing**（リソーシング）は、第三者アプリやAPIを増やしてプラットフォームの **scope and diversity** を拡大する過程。**Securing**（セキュアリング）は、規約・ライセンス・審査で所有者の **control** を強める過程。統制レベルは厳格（自動車）〜緩やか（OSSコミュニティ）の連続体。',
  example:'What is the main risk of focusing only on securing while neglecting resourcing? **Reduced third-party participation** \u2014 over-control drives developers away.',
  whyNeeded:'Appleのjailbreak→SDK導入→新規制という歴史を説明。statisticな統制過剰のリスクが頻出。',
  mistakes:['Securing偏重のリスクを「regulatory penalties」「excessive competition」と答えない。正解は **reduced third-party participation**。',
    'ResourcingとSecuringを「同じ方向の戦略」と捉えない。openness vs control の綱引き。'],
  memorize:'Resourcing = open up (scope); Securing = lock down (control)'
},
{
  id:'cDF_three_platform_types', ch:'DF', name:'Three Types of Platforms', star:true,
  scene:'Uberは売買を仲介、iOSは開発者にイノベーションさせ、Redditは仲間が交流する。プラットフォームは大きく3類型に分かれます（Schreieck et al., 2024）。',
  compare:{ a:'Type', b:'Example / mechanism', table:[
    {dim:'Transaction platform', a:'Uber, Amazon, Airbnb', b:'Matching & transactions between buyers and sellers'},
    {dim:'Innovation platform', a:'iOS, Windows, Android', b:'Generativity: complementors create innovations'},
    {dim:'Community platform', a:'Facebook, Reddit, Twitter', b:'Communication & content sharing among members'} ]},
  punchline:'Schreieck et al. (2024): transaction platforms match buyers/sellers; innovation platforms enable complementors to innovate; community platforms enable communication among members.',
  defEN:'Three platform types: **Transaction platforms** (Uber, Amazon) facilitate matching and transactions between user groups; **Innovation platforms** (iOS, Android) provide an extensible system enabling **complementors** to create innovations (generativity); **Community platforms** (Facebook, Reddit) enable communication and content sharing among members who are both producers and consumers.',
  defJA:'プラットフォーム3類型：①**Transaction platform**（取引型：Uber, Amazon）＝買い手と売り手をマッチングし取引を仲介。②**Innovation platform**（イノベーション型：iOS, Android）＝拡張可能な基盤で補完者(complementor)がイノベーションを生む（**generativity**）。③**Community platform**（コミュニティ型：Facebook, Reddit）＝メンバー間の交流とコンテンツ共有。',
  example:'Which best describes a "transaction platform"? A platform that enables value-creating interactions between buyers and sellers \u2014 not co-innovation (innovation) or content sharing (community).',
  whyNeeded:'統合戦略（同型 vs 異型）の前提分類。',
  mistakes:['Innovation platform（開発者の共創）と Transaction platform（売買仲介）を取り違えない。'],
  memorize:'Transaction (trade) / Innovation (build) / Community (talk)'
},
{
  id:'cDF_integration_levels', ch:'DF', name:'Partial vs Full Platform Integration', star:false,
  scene:'FacebookとWhatsAppは別物として「連携」(partial)。WeChatは1つの巨大アプリに「融合」(full)。ユーザーから見た区別可能性が違います。',
  compare:{ a:'Partial integration', b:'Full integration', table:[
    {dim:'Description', a:'Connected while remaining distinct', b:'Merged into a single coherent system'},
    {dim:'Level', a:'Data & functional level', b:'User interface level'},
    {dim:'User perspective', a:'Platforms remain distinguishable', b:'No longer distinguishable (superapp)'} ]},
  punchline:'Partial integration links platforms at the data/functional level (still distinguishable); full integration merges them at the UI level into one indistinguishable superapp.',
  defEN:'**Partial integration** connects platforms at the **data and functional level** while they remain distinguishable to users (Facebook & WhatsApp). **Full integration** merges platforms at the **user-interface level** into a single system that users can no longer distinguish (superapps like WeChat).',
  defJA:'**Partial integration**（部分統合）は、データ・機能レベルで連携しつつ、ユーザーには別々のプラットフォームとして区別可能（Facebook & WhatsApp）。**Full integration**（完全統合）は、UIレベルで1つに融合し区別不可能（**superapp**、例：WeChat）。',
  example:'Facebook and WhatsApp share data but stay separate apps (partial); WeChat bundles everything into one indistinguishable superapp (full).',
  whyNeeded:'4統合戦略マトリクス（同型/異型 × 部分/完全）の片軸。',
  mistakes:['superappは **full integration**（UIレベル融合）。partialと混同しない。'],
  memorize:'Partial = data/function (still 2); Full = UI (one superapp)'
},
{
  id:'cDF_integration_strategies', ch:'DF', name:'Four Integration Strategies (Assemblage)', star:true,
  scene:'統合は「同型/異型 × 部分/完全」の2×2で4戦略になります。最大の補完性とsuperappを生むのは右上の**Assemblage**（Schreieck et al., 2024）。',
  compare:{ a:'Strategy', b:'Type & integration', table:[
    {dim:'1. Collection', a:'Partial integration of same-type platforms', b:'Shared data/functionality (Meta Group)'},
    {dim:'2. Consolidation', a:'Full integration of same type', b:'Enlarged base, direct network effects (Amazon Prime Video)'},
    {dim:'3. Symbiosis', a:'Partial integration of different types', b:'Shared infrastructure (Google Photos, SAP)'},
    {dim:'4. Assemblage', a:'Full integration of different types', b:'Most complementarities \u2192 superapps (Facebook Apps)'} ]},
  punchline:'Of the four integration strategies, Assemblage (full integration of different platform types) yields the most complementarities and brings superapps.',
  defEN:'Combining type (same/different) and integration (partial/full) gives four strategies: **Collection** (partial, same type), **Consolidation** (full, same type), **Symbiosis** (partial, different types), and **Assemblage** (full, different types). **Assemblage yields the most complementarities and brings superapps.**',
  defJA:'2軸（同型/異型 × 部分/完全）で4戦略：①**Collection**（部分・同型）②**Consolidation**（完全・同型）③**Symbiosis**（部分・異型）④**Assemblage**（完全・異型）。**Assemblage** が最大の補完性を生み、**superapp** をもたらします。',
  example:'Why choose partial integration (Collection/Symbiosis) over full? E.g., operating in a **highly regulated industry with data-protection constraints** that prevents full UI merging.',
  whyNeeded:'デジタル企業の成長戦略を体系化。superappの理論的根拠。',
  mistakes:['superappを生む戦略は **Assemblage**（完全・異型）。Consolidation（完全・同型）と混同しない。'],
  memorize:'Same/Diff \u00d7 Partial/Full \u2192 Collection/Consolidation/Symbiosis/Assemblage'
},
{
  id:'cDF_dma_gatekeeper', ch:'DF', name:'Digital Markets Act (DMA) & Gatekeepers', star:true,
  scene:'EUは事後・個別の独占摘発（Google Shopping＝14年かけて€2.42bn罰金）が遅すぎると気づき、**事前規制**のDMAを導入しました（Tirole, 2023）。',
  compare:null,
  punchline:'The DMA is ex-ante regulation that imposes do\u2019s and don\u2019ts on gatekeepers possessing Core Platform Services to keep digital markets fair and contestable.',
  defEN:'The **Digital Markets Act (DMA)** is **ex-ante** (before-the-fact) regulation to keep digital markets fair and contestable. It designates **gatekeepers** that possess **Core Platform Services (CPS)** (e.g., social media, search engines, messaging) and sets 6 do\u2019s and 6 don\u2019ts plus an enforcement authority.',
  defJA:'**DMA**（デジタル市場法）は、デジタル市場を公正で競争可能に保つための **ex-ante**（事前）規制。**Core Platform Services (CPS)** を持つ企業を **gatekeeper**（ゲートキーパー）に指定し、6つの義務と6つの禁止、執行機関を定めます。EU従来の **ex-post**（事後・個別）方式が遅すぎた反省（Google Shopping＝開始2014→確定2024）から生まれました。',
  example:'Under the DMA, Article 7 forces gatekeepers to make basic messaging functionalities interoperable with rival services on request and free of charge.',
  whyNeeded:'Tiroleが挙げる独占抑制の第一の代替策。ex-ante vs ex-post の区別が頻出。',
  mistakes:['DMAは **ex-ante**（事前規制）。事後・個別の competition policy と混同しない。',
    'gatekeeperの定義は **CPS保有**。単に大企業という意味ではない。'],
  memorize:'DMA = ex-ante rules on gatekeepers (CPS), 6 do\u2019s + 6 don\u2019ts'
},
{
  id:'cDF_monopoly_measures', ch:'DF', name:'Four Measures to Limit Monopoly Power', star:false,
  scene:'DMA以外に、独占を抑える手段が4つ。ただしテック業界ではどれも一長一短で、特に「分割」は難しい（Tirole, 2023）。',
  compare:null,
  punchline:'Tirole lists four alternatives: public utility regulation, breakups, competition policy, and new sectoral regulation \u2014 each problematic for tech.',
  defEN:'Beyond the DMA, Tirole (2023) discusses four measures: (1) **public utility regulation** (set a fixed price, but pricing is hard); (2) **breakups** (insulate a natural monopoly/bottleneck, but may destroy network externalities and the data advantage); (3) **competition policy** (slow and backward-looking); (4) **new regulation** (sectoral agencies).',
  defJA:'独占抑制の4手段：①**public utility regulation**（公益事業規制：価格を固定。だが公正価格の設定が困難）②**breakups**（分割：自然独占を切り離す。だが**network externalities**を破壊し、**data advantage**を失わせるため困難）③**competition policy**（競争政策：遅く後ろ向き）④**new regulation**（新たな部門別規制機関）。',
  example:'Why are breakups hard in tech? There is no stable essential facility, a breakup may destroy network externalities, and it may lose the data advantage.',
  whyNeeded:'なぜTiroleが「完全分割は非現実的」と結論するかの根拠。',
  mistakes:['breakupが容易だと答えない。テックでは network externalities・data advantage の喪失で困難。'],
  memorize:'Utility / Breakup / Competition policy / New regulation'
},
{
  id:'cDF_data_issues', ch:'DF', name:'Tirole: Data Issues', star:false,
  scene:'私たちはGmailやYouTubeを「無料」で使い、代わりにデータで支払っています。この仕組みにはプライバシー問題があり、代替案も難しい（Tirole, 2023）。',
  compare:null,
  punchline:'We pay for "free" services with our data; alternatives (no collection, micropayments, data licensing, data trusts) each have serious drawbacks.',
  defEN:'Tirole notes we receive great services (Gmail, YouTube) and **pay with our data**, raising **privacy** issues. Alternatives all have drawbacks: no data collection (lowers quality), micropayments (bots steal money), **data licensing** (hard to implement, like patents), and customer-centric data trusts (operational issues).',
  defJA:'私たちは優れたサービスを受け、その対価を**data**（データ）で支払っており、**privacy**問題が生じます。代替案：データ収集をやめる（品質低下）、**micropayments**（ボットに盗まれる）、**data licensing**（特許のように困難）、**data trusts**（運用が難しい）。どれも一長一短。',
  example:'Gmail is "free" but Google monetizes your data; proposed fixes like micropayments risk bots draining the payments.',
  whyNeeded:'デジタル経済の核心的政策課題（データの価値評価）と接続。',
  mistakes:['「無料サービス」を額面通り受け取らない。対価はデータ。'],
  memorize:null
},
{
  id:'cDF_industrial_policy', ch:'DF', name:'Tirole: Industrial Policy & Institutional Innovation', star:false,
  scene:'政府が市場の失敗を直す介入には2種類。さらにTiroleは、より良い規制機関の必要性を訴えます（Tirole, 2023）。',
  compare:{ a:'Non-targeted intervention', b:'Industrial policy (targeted)', table:[
    {dim:'Definition', a:'Broad, not aimed at specific sectors', b:'Targets sectors, technologies, or companies'},
    {dim:'Example', a:'Carbon pricing, R&D tax credits', b:'Cluster support, infrastructure sharing'} ]},
  punchline:'Governments correct market failures via non-targeted tools (carbon pricing, R&D credits) or targeted industrial policy; Tirole urges adaptive, independent, mission-oriented regulators.',
  defEN:'Governments have two intervention types: **non-targeted** (carbon pricing, R&D tax credits) and **industrial policy** (targeted at sectors/technologies/companies). Industrial policy can create cluster effects and shared learning but history makes economists cautious. Tirole calls for **institutional innovation**: regulators that are global, independent, mission-oriented, and adaptive.',
  defJA:'政府の市場失敗是正には2種類：**non-targeted**（非標的：carbon pricing, R&D税額控除）と **industrial policy**（産業政策：特定の部門・技術・企業を標的）。産業政策はクラスター効果や学習共有を生むが、歴史的失敗から経済学者は慎重。Tiroleは**institutional innovation**——グローバルで政治・企業から独立し、使命志向で適応的な規制機関——を提唱。',
