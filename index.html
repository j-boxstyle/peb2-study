  punchline:'Ehrenfeld (2005): \u201cReducing unsustainability is not the same as creating sustainability\u201d; corporate efforts have been \u201clittle more than Band-Aids.\u201d',
  defEN:'**Ehrenfeld (2005)** argues \u201c**Reducing unsustainability is not the same as creating sustainability**\u201d (the **complication**). The **common ground** is eco-efficiency (\u201cmore value for less environmental burden\u201d \u2248 absolute decoupling). His **concern**: current efforts are \u201clittle more than **Band-Aids**.\u201d His **contribution**: a definition rooted in **eudaimonia** \u2014 \u201cthe possibility that all forms of life will flourish forever.\u201d Mechanisms firms use: **shifting the burden**, **enlightenment** (world-as-machine), and the **Friedman doctrine**.',
  defJA:'**Ehrenfeld (2005)** の核心（complication）：「**持続不可能性を減らすこと**は、**持続可能性を作ること**と同じではない」。common ground＝eco-efficiency（環境負荷あたりの価値を高める≒絶対的デカップリング）。concern＝企業の取組みは「**Band-Aids**（ばんそうこう）に過ぎない」。contribution＝**eudaimonia**（万物の繁栄）に根ざす定義。企業が使う機構：**shifting the burden**（症状だけ対処）、**enlightenment**（世界＝機械観）、**Friedman doctrine**。',
  example:'A firm cutting emissions per unit (eco-efficiency) reduces unsustainability but, per Ehrenfeld, does not by itself create sustainability \u2014 a Band-Aid.',
  whyNeeded:'business case批判(Busch)・normalizing(Wright&Nyberg)の思想的土台。',
  mistakes:['「持続不可能性を減らせば持続可能になる」と読み替えない。Ehrenfeldはそれを否定。'],
  memorize:'Ehrenfeld: reduce unsustainability \u2260 create sustainability (Band-Aids)'
},
{
  id:'cSUST_friedman', ch:'SUST', name:'The Friedman Doctrine', star:true,
  scene:'「企業の社会的責任は利益を増やすこと」。FriedmanはCEOの唯一の責任は株主の利益最大化だと主張しました。',
  compare:null,
  punchline:'The Friedman doctrine: the social responsibility of business is to increase its profits \u2014 a CEO\u2019s sole duty is maximizing shareholder profit, within the law.',
  defEN:'The **Friedman doctrine (1970)**: \u201c**The social responsibility of business is to increase its profits.**\u201d A CEO\u2019s sole responsibility is to **maximize profits for shareholders** (within the law); otherwise they spend shareholders\u2019 money or tax consumers. Like Smith\u2019s **invisible hand**, business best serves society through profitability and efficiency. Main counter-arguments: **weak governments / government failure** and **telecoupling** (distant impacts).',
  defJA:'**Friedman doctrine (1970)**：「**企業の社会的責任は利益を増やすこと**」。CEOの唯一の責任は法の範囲内で**株主利益を最大化**すること。さもなくば株主の金を使い消費者に課税するのと同じ。Smithの**invisible hand**（見えざる手）同様、企業は利益と効率の追求で社会に最も貢献する。主な反論：**weak governments / government failure**（政府の失敗）と**telecoupling**（遠隔地への影響）。',
  example:'Under the Friedman doctrine, a CEO should focus only on lawful profit maximization, leaving equity and justice to other social mechanisms \u2014 a stance Ehrenfeld critiques.',
  whyNeeded:'business case for sustainabilityの思想的背景。Busch批判の対象。',
  mistakes:['Friedman doctrineは「利益最大化が企業の責任」。CSRを企業の第一義務とする立場ではない。'],
  memorize:'Friedman: business\u2019s responsibility = increase profits (shareholders)'
},
{
  id:'cSUST_business_case_critique', ch:'SUST', name:'Busch et al.: Case Against \u201cthe\u201d Business Case', star:true,
  scene:'「持続可能性は儲かる(win-win)」という主張は魅力的。でも多くの取組みは儲からない。Buschらは3つの批判を挙げます（2024）。',
  compare:null,
  punchline:'Busch et al. (2024) criticize "the" business case via three points: the suboptimality of optimization, pessimism about techno-optimism (Jevons), and consumerism.',
  defEN:'**Busch et al. (2024)** note the **common ground**: \u201cthe\u201d business case has **win-win appeal**, but many sustainability efforts are **not profitable**. The **case against** it has three criticisms: (1) **the suboptimality of optimization** (merely reducing unsustainability), (2) **the pessimism regarding techno-optimism** (e.g., Jevons paradox), and (3) **consumerism** (e.g., Patagonia\u2019s \u201cdon\u2019t buy this jacket\u201d). It does NOT claim the business case \u201cprioritizes social over environmental goals.\u201d',
  defJA:'**Busch et al. (2024)**：common ground＝「the」business caseは**win-win**で魅力的だが、多くの取組みは**儲からない**。3つの批判：①**suboptimality of optimization**（最適化の準最適性＝持続不可能性を減らすだけ）②**pessimism regarding techno-optimism**（技術楽観への悲観、例：Jevons）③**consumerism**（消費主義、例：Patagonia「このジャケットを買うな」）。「社会目標を環境問題より優先する」は批判に**含まれない**。',
  example:'Which is NOT a Busch et al. criticism? \u201cThe business case prioritizes social goals over environmental problems\u201d \u2014 the real three are optimization-suboptimality, techno-optimism pessimism, and consumerism (Mock Q23).',
  whyNeeded:'business case批判の3本柱。Jevons・consumerismへの橋渡し。',
  mistakes:['「社会目標を環境より優先」はBuschの批判では**ない**（ひっかけ）。'],
  memorize:'Busch 3 critiques: optimization / techno-optimism / consumerism'
},
{
  id:'cSUST_jevons', ch:'SUST', name:'Jevons\u2019 Paradox (Rebound Effect)', star:true,
  scene:'燃料を効率的に使えば消費は減る？Jevonsは「逆だ」と言いました。効率化が総消費を増やすのです。',
  compare:null,
  punchline:'Jevons\u2019 paradox: efficiency improvements can RAISE total resource consumption (rebound), via profitability, new uses, and consumer behavior.',
  defEN:'**Jevons\u2019 paradox** (1865): \u201cIt is wholly a confusion of ideas to suppose that the economical use of fuel is equivalent to a diminished consumption. The very contrary is the truth.\u201d Efficiency can **raise** consumption through (1) increased profitability, (2) inventions/new uses, and (3) consumer behavior. **Rebound effects** range \u201cfrom less than 1% to several hundred percent, but never zero or less than one\u201d (Alcott, 2005).',
  defJA:'**Jevons\u2019 paradox**（ジェヴォンズのパラドックス、1865）：「燃料の節約的利用が消費の減少に等しいと考えるのは完全な誤り。真実は正反対だ」。効率化は①利益増②新発明・新用途③消費者行動を通じて消費を**増やす**ことがある。**rebound effect**（リバウンド効果）は「1%未満〜数百%、ただしゼロや1未満には決してならない」（Alcott, 2005）。',
  example:'More fuel-efficient engines lower running costs, so people drive more and new uses appear \u2014 total fuel use can rise (Jevons\u2019 rebound).',
  whyNeeded:'techno-optimism批判の実体。green growthがJevons型リバウンドで「complicated」になる根拠。',
  mistakes:['効率化が必ず総消費を減らすと考えない。リバウンドで増えうる（never zero）。'],
  memorize:'Jevons: efficiency \u2192 MORE consumption (rebound, never < 1)'
},
{
  id:'cSUST_business_solutions', ch:'SUST', name:'Making Business Cases Work', star:false,
  scene:'では持続可能性をビジネスで機能させるには？Buschは3つのcourse of actionを示します。',
  compare:null,
  punchline:'Busch et al.: make business cases work via sustainable entrepreneurship, business-model transformation, and sensitivity to market failures (need for government intervention).',
  defEN:'Busch et al.\u2019s **course of action**: (1) **sustainable entrepreneurship** (social mission central, e.g., B Corporations), (2) **business model transformation** (circular/sharing economy, e.g., BlaBlaCar), and (3) **sensitivity to market failures** \u2014 \u201cthere remains a clear need for **government interventions**.\u201d **Contribution**: a systems-lens reorientation (impact orientation, collaboration, economic restraint/degrowth).',
  defJA:'Buschの**course of action**：①**sustainable entrepreneurship**（社会的使命が事業の中核、例：B Corporation）②**business model transformation**（循環・シェアリング経済、例：BlaBlaCar）③**sensitivity to market failures**＝「**government interventions**（政府介入）が明確に必要」。**contribution**：システムレンズへの転換（impact志向・collaboration・economic restraint/degrowth）。',
  example:'Beyond profit-seeking, Busch argues firms need business-model transformation and that government intervention remains necessary where markets fail.',
  whyNeeded:'business case批判の建設的帰結。政府介入の必要性が頻出。',
  mistakes:['Buschは「市場だけで解決できる」とは言わない。**government intervention**が必要と強調。'],
  memorize:'Make it work: entrepreneurship / model transformation / market-failure sensitivity (govt)'
},
{
  id:'cSUST_wright_nyberg', ch:'SUST', name:'Wright & Nyberg: Back to Business as Usual', star:true,
  scene:'企業の環境への熱意は、やがて「通常業務」に薄められる。Wright & Nyberg (2017)は、その3段階を描きます。',
  compare:null,
  punchline:'Wright & Nyberg (2017): firms translate climate ambition into business-as-usual through framing, localizing, and normalizing.',
  defEN:'**Wright & Nyberg (2017)** studied five 10-year Australian cases. **Complication**: corporate environmentalism is hard to sustain for long-term grand challenges. **Concern**: initial engagement becomes business-as-usual. Process: **Framing** (association: win-win, leadership; disassociation: not altruism), **Localizing** (incorporation, commensuration via KPIs, proselytization), and **Normalizing** (purification, dilution).',
  defJA:'**Wright & Nyberg (2017)**：豪州5社の10年ケース。complication＝企業の環境主義は長期的大課題には維持困難。concern＝当初の関与が**business-as-usual**（通常業務）に戻る。過程：**Framing**（フレーミング：association＝win-win/リーダーシップ、disassociation＝利他でない）、**Localizing**（取り込み・KPI化(commensuration)・布教(proselytization)）、**Normalizing**（正常化：purification, dilution）。',
  example:'A firm first frames climate action as a win-win opportunity, then localizes it into KPIs, and finally normalizes it \u2014 diluting ambition back to business-as-usual.',
  whyNeeded:'greenwashing/normalizingの理論。Mock Q25の根拠。',
  mistakes:['3段階の順序：Framing→Localizing→Normalizing。最後が業務化(dilution)。'],
  memorize:'Wright & Nyberg: Framing \u2192 Localizing \u2192 Normalizing (\u2192 business-as-usual)'
},
{
  id:'cSUST_normalizing', ch:'SUST', name:'Normalizing: Purification & Dilution', star:true,
  scene:'最終段階「正常化」では、当初の気候の約束が「株主価値の最大化」へ再整合され、希釈されます。',
  compare:null,
  punchline:'In the "normalizing" stage, climate practices are realigned with the dominant discourse of maximizing shareholder value, diluting earlier initiatives.',
  defEN:'During **normalizing**, \u201ccorporate practices are realigned with the dominant organizational discourse of **maximizing shareholder value**, often involving the **dilution** of earlier climate initiatives.\u201d It works through **purification** and **dilution**: \u201ccontinuous critique of competing demands eventually purifies dominant market discourses and practices.\u201d',
  defJA:'**Normalizing**（正常化）段階では、「企業実践が支配的言説である**maximizing shareholder value**（株主価値最大化）へ再整合され、初期の気候イニシアチブが**dilution**（希釈）される」。機構は**purification**（純化）と**dilution**：「競合する要求への継続的批判が、支配的な市場言説と実践を純化する」。',
  example:'What occurs during \u201cnormalizing\u201d? Practices are realigned with maximizing shareholder value, diluting earlier climate initiatives \u2014 not solidifying them (Mock Q25).',
  whyNeeded:'Wright & Nybergモデルの最終段階。greenwashing評価の核心。',
  mistakes:['normalizingを「気候への約束が長期戦略に固まる段階」と誤読しない。実際は希釈(dilution)。'],
  memorize:'Normalizing = realign to shareholder value + dilute climate ambition'
},
{
  id:'cSUST_carbon_offsets', ch:'SUST', name:'Carbon Offsets & Uber Planet (West)', star:true,
  scene:'Uber Planetは+5%でCO2を相殺できると言う。でもオフセットは本当に効くのか？West et al. (2023)が検証します。',
  compare:null,
  punchline:'Carbon offsets are a >$1bn market, but West et al. (2023) find only ~6% of promised offsets delivered real emission reductions.',
  defEN:'**Carbon offsets** have become common (>$1bn market). **Uber Planet** lets customers pay ~+5% to offset emissions. Critics: it **shifts responsibility to consumers**, the symbolic amount is insufficient, and **offsets do not deliver promised reductions**. **West et al. (2023)** evaluated 26 forest projects and found **only ~6% of promised offsets gave real emission reductions**.',
  defJA:'**Carbon offsets**（炭素オフセット）は一般化（>$1bn市場）。**Uber Planet**は+5%で排出を相殺できるとする。批判：**責任を消費者に転嫁**、象徴的な額では不十分、**オフセットは約束した削減を実現しない**。**West et al. (2023)**は26の森林プロジェクトを評価し、**約束されたオフセットの約6%しか実際の排出削減をもたらさなかった**と発見。',
  example:'Uber Planet\u2019s +5% offset fee shifts responsibility to riders, yet West et al. find ~94% of such promised offsets do not reduce real emissions.',
  whyNeeded:'additionality/counterfactualの実証的文脈。greenwashing評価。',
  mistakes:['オフセットが約束通り機能すると考えない。Westでは**約6%のみ**有効。'],
  memorize:'West et al.: only ~6% of offsets = real reductions'
},
{
  id:'cSUST_additionality', ch:'SUST', name:'Additionality', star:true,
  scene:'オフセットが「追加的」とは、そのプロジェクトがなければ起きなかった削減のこと。基準(counterfactual)の取り方で結論が激変します。',
  compare:null,
  punchline:'Additionality exists when a project\u2019s actual deforestation is lower than its counterfactual scenario derived from observable control areas.',
  defEN:'**Additionality** means the emission reduction is **additional** \u2014 it would not have happened without the project. West et al.: **\u201cthere is additionality when a project\u2019s actual deforestation is lower than its counterfactual scenario derived from observable control areas.\u201d** A weakness is that additionality is often set on the developers\u2019 **ex-ante baseline**, which can be strategically inflated.',
  defJA:'**Additionality**（追加性）：その排出削減が**追加的**＝プロジェクトがなければ起きなかったこと。West et al.：「**プロジェクトの実際の森林減少が、観測可能なコントロール地域から導いた counterfactual シナリオより低いとき、追加性がある**」。弱点：追加性は開発者の**ex-ante baseline**（事前ベースライン）で設定されがちで、戦略的に水増しされうる。',
  example:'Additionality holds when actual deforestation in the project area is lower than the counterfactual estimated from comparable control areas (Mock Q24).',
  whyNeeded:'counterfactual/synthetic controlとセットで頻出。West分析の核心。',
  mistakes:['additionalityの基準は「予測 vs 観測」ではなく「実際 vs counterfactual（観測可能なコントロール由来）」。',
    'ex-ante baselineだけで判定すると水増しされやすい点が批判。'],
  memorize:'Additionality = actual < counterfactual (from control areas)'
},
{
  id:'cSUST_counterfactual', ch:'SUST', name:'Counterfactual & Synthetic Control', star:true,
  scene:'「もしプロジェクトがなかったら？」という仮想の結果がcounterfactual。実験できないときは、似た地域から「合成コントロール」を作ります。',
  compare:null,
  punchline:'A counterfactual is the hypothetical outcome under a different treatment ("what if"); synthetic controls build a comparable control group from similar pre-treatment observations.',
  defEN:'A **counterfactual** is \u201ca hypothetical outcome describing what would have happened under a different treatment (the \u2018what if\u2019).\u201d Randomization creates counterfactuals; when experiments are impossible, **quasi-experimental methods** (regression discontinuity, diff-in-diff, instrumental variables, matching) are used. West et al. use **matching** to build a **\u2018synthetic\u2019 control** \u2014 areas with similar historical deforestation and characteristics before treatment.',
  defJA:'**Counterfactual**（反事実）：「別の処置だったら何が起きたか（もし〜なら）」という仮想の結果。ランダム化が反事実を作るが、実験不可能なときは**quasi-experimental methods**（回帰不連続・差の差・操作変数・matching）を使う。West et al.は**matching**で**synthetic control**（合成コントロール）——処置前に森林減少の履歴と特性が似た地域——を作る。',
  example:'To judge whether a forest project reduced deforestation, West et al. compare it to a synthetic control of similar areas \u2014 the counterfactual \u201cwhat would have happened.\u201d',
  whyNeeded:'additionality判定の方法論。因果推論の基礎。',
  mistakes:['counterfactualは「実際に起きたこと」ではなく「起きなかった仮想」。'],
  memorize:'Counterfactual = the "what if"; synthetic control = matched comparison group'
},
{
  id:'cSUST_biodiversity', ch:'SUST', name:'Why Biodiversity Conservation Matters', star:false,
  scene:'生物多様性の喪失は、生態系の効率・安定性を損ない、感染症リスクを高めます。',
  compare:null,
  punchline:'Biodiversity loss harms ecosystem efficiency and stability and increases the risk of infectious diseases.',
  defEN:'Biodiversity conservation matters because biodiversity loss: (1) **harms ecosystem efficiency** \u2014 fewer genes/species reduce how well communities capture resources and convert them to biomass (Cardinale et al., 2012); (2) **harms ecosystem stability** \u2014 systems reliant on few species are vulnerable to disturbance (Rockstr\u00f6m et al., 2009); and (3) **increases infectious-disease risk** \u2014 loss tends to increase pathogen transmission (Keesing et al., 2010).',
  defJA:'生物多様性保全が重要な理由：生物多様性の喪失は①**生態系効率を損なう**——遺伝子・種が減ると資源を捕捉しバイオマスに変える効率が落ちる(Cardinale et al., 2012)②**生態系の安定性を損なう**——少数種に依存する系は撹乱に脆弱(Rockström et al., 2009)③**感染症リスクを高める**——喪失は病原体伝播を増やす(Keesing et al., 2010)。',
  example:'Losing key species lowers how efficiently an ecosystem captures nutrients and makes it less stable and more disease-prone.',
  whyNeeded:'L8の経済学的動機。生態系サービス評価の前提。',
  mistakes:['生物多様性喪失の影響を「効率」だけと捉えない。安定性・感染症も含む。'],
  memorize:'Biodiversity loss: \u2193efficiency, \u2193stability, \u2191disease'
},
{
  id:'cSUST_boulding_malthus', ch:'SUST', name:'Cowboy vs Spaceman Economy; Malthus', star:false,
  scene:'Bouldingは「無限のフロンティアがあるカウボーイ経済」と「資源が閉じた宇宙船経済」を対比。Malthusは人口の幾何級数的増加を警告しました。',
  compare:{ a:'Cowboy economy', b:'Spaceman economy', table:[
    {dim:'View', a:'Open frontier, unlimited resources', b:'Closed system, finite resources'},
    {dim:'Behavior', a:'Consume & pollute freely', b:'Recycle, live within limits'} ]},
  punchline:'Boulding contrasts the open "cowboy economy" with the closed "spaceman economy"; Malthus warned population grows geometrically while subsistence grows arithmetically.',
  defEN:'**Boulding (1966)** contrasts the **cowboy economy** (open frontier, unlimited resources) with the **spaceman economy** (closed, finite Earth). **Malthus (1798)**: \u201cPopulation, when unchecked, increases in a **geometrical ratio** [exponential]\u2026 Subsistence increases only in an **arithmetical ratio** [linear].\u201d Malthus was **critiqued** because fertility falls with income and food production grew faster than population.',
  defJA:'**Boulding (1966)**：**cowboy economy**（開かれたフロンティア・無限資源）と**spaceman economy**（閉じた有限の地球）を対比。**Malthus (1798)**：「人口は抑制なしでは**幾何級数(geometrical)**＝指数的に増えるが、食料は**算術級数(arithmetical)**＝線形にしか増えない」。Malthusへの**批判**：所得上昇で出生率は低下し、食料生産は人口より速く増えた。',
  example:'A \u201ccowboy\u201d treats Earth as an open frontier; a \u201cspaceman\u201d treats it as a closed ship that must recycle \u2014 Boulding\u2019s contrast.',
  whyNeeded:'Limits to Growth(Kallis)の思想的系譜。',
  mistakes:['Malthus: 人口=幾何級数、食料=算術級数。逆にしない。'],
  memorize:'Cowboy (open) vs Spaceman (closed); Malthus: pop geometric > food arithmetic'
},
{
  id:'cSUST_limits_growth', ch:'SUST', name:'Limits to Growth & Double Resources', star:true,
  scene:'「成長の限界」モデルの再検証では、現実は「Double Resources」シナリオに最も近く、崩壊は資源枯渇ではなく汚染（sink限界）が駆動すると分かりました（Kallis et al., 2025）。',
  compare:{ a:'Source limit', b:'Sink limit', table:[
    {dim:'Driver of collapse', a:'Scarcity of non-renewable resources', b:'Persistent pollution & regenerative-capacity limit'},
    {dim:'Scenario', a:'Standard Run', b:'Double Resources (closest to reality)'} ]},
  punchline:'Kallis et al. (2025): historical data since 1970 most closely follows the "Double Resources" scenario, where collapse is driven by persistent pollution and sink limits, not resource scarcity.',
  defEN:'\u201cLimits to Growth\u201d (Meadows et al., 1972) inherited Malthus\u2019s logic. **Kallis et al. (2025)**: data since 1970 most closely track the **\u201cDouble Resources\u201d scenario** (initial non-renewable stock twice the Standard Run). There, **collapse occurs later and is driven NOT by resource scarcity (a source limit) but by persistent pollution and its impact on ecosystem stability (a sink limit / regenerative-capacity limit).**',
  defJA:'「Limits to Growth」（Meadows et al., 1972）はMalthusの論理を継承。**Kallis et al. (2025)**：1970年以降のデータは**「Double Resources」シナリオ**（非再生資源の初期ストックがStandard Runの2倍）に最も近い。そこでは**崩壊はより遅く起き、資源枯渇（source limit）ではなく、持続的汚染とその生態系安定性への影響（sink limit＝再生能力の限界）が駆動する**。',
  example:'Under the Double Resources scenario, collapse is driven by **persistent pollution and sink limits to ecosystem stability**, not resource depletion or population decline (Mock Q28).',
  whyNeeded:'post-growthの実証的根拠。source vs sink limitの区別が頻出。',
  mistakes:['Double Resourcesの崩壊要因を「資源枯渇」や「人口減少」と答えない。正解は**持続的汚染(sink limit)**。'],
  memorize:'Double Resources: collapse from POLLUTION/sink limit, not source scarcity'
},
{
  id:'cSUST_solow', ch:'SUST', name:'Solow: Relative Scarcity & Substitution', star:true,
  scene:'資源が枯れても価格が上がれば、より豊富で安い代替材へ移る——Solowは「限界はない」という相対的希少性の立場です。',
  compare:null,
  punchline:'Solow (1973): rising prices of exhaustible resources drive substitution toward cheaper, plentiful materials, automatically reducing resource use per unit of GDP.',
  defEN:'**Solow (1973)** argues **relative scarcity** handles exhaustion: \u201chigher and rising prices of exhaustible resources lead producers to **substitute** other materials that are more plentiful and therefore cheaper,\u201d reducing resource requirements per unit of GDP. **Caveats**: (i) unpriced externalities and unmarketable services, and (ii) substitution is **not a sufficient condition for sustainability**.',
  defJA:'**Solow (1973)**：**relative scarcity**（相対的希少性）が枯渇に対処する。「枯渇資源の価格が上昇すると、生産者はより豊富で安い材料へ**substitute**（代替）する」ため、GDP当たりの資源必要量が減る。**Caveats（留保）**：(i) 価格のつかない外部性・市場にならないサービス、(ii) 代替は持続可能性の**十分条件ではない**。',
  example:'As oil prices rise, firms substitute toward cheaper, more abundant inputs \u2014 Solow\u2019s mechanism \u2014 but this ignores unpriced externalities.',
  whyNeeded:'weak sustainability（環境経済学）の代表的立場。Kallisとの対立軸。',
  mistakes:['Solowの立場は「代替で限界を回避」。だが externalities を無視し、持続可能性の十分条件ではない点が留保。'],
  memorize:'Solow: price \u2191 \u2192 substitution (relative scarcity); caveats = externalities, not sufficient'
},

  punchline:'Easterlin paradox: income correlates with happiness within a country at a point in time, but income is unrelated to happiness across countries and over time.',
  defEN:'The **Easterlin paradox (1974)**: (1) income is **positively correlated** with happiness **within** countries at one point in time, but (2) income is **unrelated** to happiness **across** countries, and (3) **unrelated over time**. Explanations: **relative income** (status), **hedonic adaptation**, and **uneconomic growth**.',
  defJA:'**Easterlin paradox**（イースタリンの逆説、1974）：①ある時点で国**内**では所得と幸福は**正に相関**するが、②国**間**では所得と幸福は**無関係**、③**時間を通じても無関係**。説明：**relative income**（相対所得＝地位）、**hedonic adaptation**（快楽順応）、**uneconomic growth**（不経済な成長）。',
  example:'Within a country richer people report more happiness, yet decades of GDP growth do not raise average happiness \u2014 the Easterlin paradox.',

  id:'ep_DF_1', ch:'DF', badge:'DF \u2014 Digital Firm Practice Exam',
  title:'Platforms, Hubs & Regulation',
  scenario:'A big-tech firm runs an app store (an innovation platform) and a marketplace (a transaction platform). It controls a key bottleneck connecting millions of developers and users, and the EU is considering how to regulate it. Apply the L1\u2013L2 concepts (Birkinshaw, Van Alstyne et al., Iansiti & Lakhani, Ghazawneh & Henfridsson, Schreieck et al., Tirole).',
  transactions:[
    'The firm provides SDKs, APIs and developer agreements to third parties.',
    'It is designated a gatekeeper possessing Core Platform Services under the DMA.'
  ],
  questions:[
    '(a) How do pipeline businesses primarily create value, and how does this differ from a platform?',
    '(b) What is the main risk of focusing only on securing while neglecting resourcing?',
    '(c) Which integration strategy yields the most complementarities and brings superapps?',
    '(d) Is the DMA an ex-ante or ex-post instrument, and on whom does it impose obligations?'
  ],
  solHtml:
    '<div class="exam-sol-label">(a) Pipeline vs platform</div>'+
    '<p>A <b>pipeline</b> creates value by <b>optimizing a linear value chain</b> (sourcing \u2192 manufacturing \u2192 reselling \u2192 service). A <b>platform</b> creates value by <b>mediating interactions</b> between external producers and consumers in a multi-sided market, without needing to own physical infrastructure.</p>'+
    '<div class="exam-sol-label">(b) Securing without resourcing</div>'+
    '<p>The main risk is <b>reduced third-party participation</b>. Over-control makes the platform unattractive to developers; resourcing (SDKs, APIs) must balance securing (agreements, review).</p>'+
    '<div class="exam-sol-label">(c) Integration strategy</div>'+
    '<p><b>Assemblage</b> \u2014 full integration of <i>different</i> platform types \u2014 yields the most complementarities and brings superapps (vs Collection, Consolidation, Symbiosis).</p>'+
    '<div class="exam-sol-label">(d) DMA</div>'+
    '<p>The DMA is <b>ex-ante</b> (before-the-fact) regulation imposing 6 do\u2019s and 6 don\u2019ts on <b>gatekeepers</b> that possess <b>Core Platform Services (CPS)</b>, replacing slow ex-post case-by-case enforcement.</p>'
},
{

  title:'Neutrality, PE & the Digital Economy',
  scenario:'A multinational resident in country A invests and earns abroad, while a big-tech firm registered in A and B serves customers in C with no physical presence. Apply L3\u2013L4 concepts (Elliffe ch1\u20133, Beretta).',

    '(b) What cannot be achieved with the tax exemption method?',
    '(c) Define a permanent establishment and explain why it is outdated for digital firms.',
    '(d) Which principle justifies source taxation, and which justifies residence taxation?'
  ],
  solHtml:
    '<div class="exam-sol-label">(a) Source-only world</div>'+
    '<p><b>Capital import neutrality (CIN)</b> is achieved: every investor in a country faces that country\u2019s rate, so domestic and foreign investors are taxed equally on inbound investment.</p>'+
    '<div class="exam-sol-label">(b) Exemption method</div>'+
    '<p>It <b>cannot achieve capital export neutrality (CEN)</b>. The exemption method gives CIN, not CEN.</p>'+
    '<div class="exam-sol-label">(c) Permanent establishment</div>'+
    '<p>A <b>PE</b> is <b>a fixed place of business through which an enterprise carries on its business</b> (branch, office, factory). It is the threshold for source-taxing business income. Digital firms need no physical presence, so PE is <b>outdated</b> \u2014 a firm can serve country C with no PE there.</p>'+
    '<div class="exam-sol-label">(d) Principles</div>'+
    '<p><b>Benefit principle</b> \u2192 justifies <b>source taxation</b> (you pay where you benefit). <b>Ability-to-pay principle</b> \u2192 justifies <b>residence taxation</b> (you pay by income).</p>'
},

  questions:[

    '(d) Distinguish a positive from a normative statement with an example.'
  ],
  solHtml:
    '<div class="exam-sol-label">(a) Maximin ranking</div>'+
    '<p>Compare the <b>worst-off</b> group in each society: A=100, B=50, C=99, D=101. The lowest worst-off is <b>Society B</b> (50), so B is ranked lowest. Maximin maximizes the worst-off, not the average.</p>'+
    '<div class="exam-sol-label">(b) Full information</div>'+
    '<p>When traders know exactly what is being traded, <b>adverse selection does not exist</b>, and <b>trades that occur will be mutually beneficial</b> (hidden information is what creates adverse selection before a trade).</p>'+
    '<div class="exam-sol-label">(c) Ratings & moral hazard</div>'+
    '<p>Ratings can fail if <b>not all products are reviewed</b>, or if <b>ratings are faked or exaggerated</b>. (Pre-2007\u201309, MBS were over-rated because the <b>sellers</b> of the securities paid for the ratings.)</p>'+
    '<div class="exam-sol-label">(d) Positive vs normative</div>'+
    '<p><b>Positive</b> describes what is and is testable: \u201cHigher education was under-funded for years.\u201d <b>Normative</b> prescribes what ought to be: \u201cHigher education should receive less funding.\u201d</p>'
},
{

  ],
  solHtml:
    '<div class="exam-sol-label">(a) Weak sustainability</div>'+
    '<p>Developments that maintain a <b>non-decreasing sum of human-made and natural capital</b> (capital is substitutable) \u2014 the environmental-economics lens. Strong sustainability instead maintains them <b>separately</b>.</p>'+
    '<div class="exam-sol-label">(b) Decoupling & green growth</div>'+
    '<p>Only <b>absolute decoupling</b> (GDP up, impact down) counts as green growth. Achieving it through innovation is <b>complicated</b> by <b>Jevons-type rebound effects</b>; Hickel & Kallis find no global evidence of absolute decoupling.</p>'+
    '<div class="exam-sol-label">(c) Additionality & counterfactual</div>'+
    '<p>There is additionality when a project\u2019s <b>actual deforestation is lower than its counterfactual</b> derived from observable control areas (synthetic controls). West et al. found <b>only ~6%</b> of promised offsets delivered real emission reductions.</p>'+
    '<div class="exam-sol-label">(d) Valuation & boundaries</div>'+
    '<p><b>Intrinsic values</b> (rights of nature) are least suitable to express as monetary value. Among Earth systems, <b>ozone depletion</b> is within safe planetary boundaries, while climate change, biodiversity loss and the nitrogen cycle are exceeded.</p>'
}
];

/* Textbook tab render functions (PEB2). Track-based (DF/TAX/MLM/SUST). Uses esc() from engine. */
var CONCEPTS = [].concat(window.CONCEPTS_DF||[], window.CONCEPTS_TAX||[], window.CONCEPTS_MLM||[], window.CONCEPTS_SUST||[]);
var TB_GLOSSARY = window.TB_GLOSSARY||[];
var EXAM_PROBLEMS = window.TB_EXAM_PROBLEMS||[];
var TRACKS = [
  {key:'DF',   title:'Digital Firm & Markets', sub:'L1\u20132 \u00b7 Birkinshaw / Van Alstyne / Iansiti / Ghazawneh / Schreieck / Tirole'},
  {key:'TAX',  title:'Economics of Taxation',  sub:'L3\u20134 \u00b7 Elliffe ch1\u20133 / Beretta'},
  {key:'MLM',  title:'Moral Limits of Markets',sub:'L5\u20136 \u00b7 Falk & Szech / Awad / Cowen & Tabarrok'},
  {key:'SUST', title:'Sustainability',         sub:'L7\u20138 \u00b7 Ehrenfeld / Busch / Wright & Nyberg / West / Fanning & Raworth / Kallis / Costanza'}
];
var currentTrack = 'DF';
function escTB(s){return esc(s);}
function mdInline(str){
  if(!str) return '';
  var s = escTB(str);
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  return s;
}
/* renderMd: bold + line breaks + bullet lines */
function renderMd(str){
  if(!str) return '';
  var s = escTB(str);
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/(^|<br>)\s*[•\-]\s+/g,'$1<span class="def-bullet">\u2022 </span>');
  s = s.replace(/\n/g,'<br>');
  return s;
}
/* renderDefEN: bold + pipe tables + bullets + paragraph breaks (faithful, compact) */
function renderDefEN(str){
  if(!str) return '';
  var tables=[];
  var raw = str.replace(/(?:^|\n)((?:\|[^\n]*\|\s*\n?){2,})/g, function(m,body){
    var rows = body.trim().split('\n').map(function(line){
      return line.replace(/^\|/,'').replace(/\|\s*$/,'').split('|').map(function(c){return c.trim();});
    });
    rows = rows.filter(function(r){ return !r.every(function(c){return /^-+:?$|^:?-+$|^$/.test(c);}); });
    var idx=tables.length; tables.push(rows); return '\n\x02T'+idx+'\x02';
  });
  function renderTable(rows){
    if(!rows.length) return '';
    var h='<div class="md-table-wrap"><table class="md-table"><thead><tr>';
    rows[0].forEach(function(c){h+='<th>'+mdInline(c)+'</th>';});
    h+='</tr></thead><tbody>';
    for(var r=1;r<rows.length;r++){h+='<tr>';rows[r].forEach(function(c){h+='<td>'+mdInline(c)+'</td>';});h+='</tr>';}
    h+='</tbody></table></div>'; return h;
  }
  var parts = raw.split(/\n\n+/);
  var html='';
  parts.forEach(function(p){
    p=p.trim(); if(!p) return;
    var t=p.match(/^\x02T(\d+)\x02$/);
    if(t){ html+=renderTable(tables[+t[1]]); return; }
    var s=escTB(p);
    s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/\x02T(\d+)\x02/g,function(_,i){return renderTable(tables[+i]);});
    s=s.replace(/(^|\n)\s*[•\-]\s+/g,'$1<span class="def-bullet">\u2022 </span>');
    s=s.replace(/\n/g,'<br>');
    html+='<div class="def-entry def-plain">'+s+'</div>';
  });
  return html;
}
function renderCompareTable(compare){
  if(!compare) return '';
  var h='<div style="overflow-x:auto"><table class="compare-table">';
  if(compare.headers && compare.rows){
    h+='<thead><tr>'; compare.headers.forEach(function(c){h+='<th>'+escTB(c)+'</th>';}); h+='</tr></thead><tbody>';
    compare.rows.forEach(function(row){h+='<tr>';row.forEach(function(c){h+='<td>'+escTB(c||'')+'</td>';});h+='</tr>';});
    h+='</tbody></table></div>'; return h;
  }
  if(compare.table){
    h+='<thead><tr><th>Dimension</th><th>'+escTB(compare.a)+'</th><th>'+escTB(compare.b)+'</th></tr></thead><tbody>';
    compare.table.forEach(function(o){h+='<tr><td>'+escTB(o.dim)+'</td><td>'+mdInline(o.a)+'</td><td>'+mdInline(o.b||'')+'</td></tr>';});
    h+='</tbody></table></div>'; return h;
  }
  return '';
}
function renderInlineGlossary(conceptName){
  var nl = conceptName? conceptName.toLowerCase():'';
  var matched=[];
  for(var i=0;i<TB_GLOSSARY.length;i++){
    var g=TB_GLOSSARY[i], tl=g.term.toLowerCase();
    if(nl.indexOf(tl)>=0 || tl.split(' ').some(function(w){return w.length>4 && nl.indexOf(w)>=0;})) matched.push(g);
  }
  if(!matched.length) return '';
  var h='<div class="glossary-chips">';
  for(var j=0;j<matched.length && j<6;j++){ h+='<div class="glossary-chip" title="'+escTB(matched[j].def)+'">'+escTB(matched[j].term)+'</div>'; }
  h+='</div>'; return h;
}
/* Mini-quiz: pick up to 3 questions from this track, sequential, deduped across the page */
var _tbQuizUsed = {};
function renderInlineQuiz(track, slot){
  var pool = (window.QUESTIONS||[]).filter(function(q){return q.ch===track;});
  if(!pool.length) return '';
  var picks=[], used=_tbQuizUsed[track]||(_tbQuizUsed[track]={});
  for(var i=0;i<pool.length && picks.length<3;i++){ if(!used[pool[i].id]){picks.push(pool[i]); used[pool[i].id]=1;} }
  if(picks.length<3){ for(var k=0;k<pool.length && picks.length<3;k++){ if(picks.indexOf(pool[k])<0) picks.push(pool[k]); } }
  if(!picks.length) return '';
  var dom='iq-'+track+'-'+slot;
  var h='<div class="inline-quiz"><div class="inline-quiz-title">\ud83d\udcdd '+track+' Mini Quiz</div>';
  picks.forEach(function(qu,qi){
    var qid=dom+'-q'+qi;
    h+='<div style="margin-bottom:16px" id="'+qid+'-wrap">';
    h+='<div class="iq-q">'+(qi+1)+'. '+escTB(qu.q)+'</div>';
    for(var o=0;o<qu.opts.length;o++){
      h+='<div class="iq-opt" id="'+qid+'-o'+o+'" data-q="'+qid+'" data-i="'+o+'" data-a="'+qu.ans+'">'+escTB(qu.opts[o])+'</div>';
    }
    h+='<div class="iq-exp" id="'+qid+'-exp" style="display:none">'+escTB(qu.exp)+'</div></div>';
  });
  h+='</div>'; return h;
}
function checkInlineAnswer(qid, sel, correct){
  for(var i=0;i<6;i++){ var el=document.getElementById(qid+'-o'+i); if(!el) continue; el.onclick=null; el.style.pointerEvents='none';
    if(i===correct) el.classList.add('correct'); else if(i===sel) el.classList.add('wrong'); }
  var exp=document.getElementById(qid+'-exp'); if(exp) exp.style.display='block';
}
function renderTrackContent(track){
  var info=null; TRACKS.forEach(function(t){if(t.key===track)info=t;});
  var concepts = CONCEPTS.filter(function(c){return c.ch===track;});
  var html='<div class="chapter-header"><div class="chapter-title">'+escTB(info.title)+'</div><div class="chapter-sub">'+escTB(info.sub)+'</div></div>';
  concepts.forEach(function(c,idx){
    html+='<div class="concept-card'+(c.star?' star-card':'')+'" id="concept-'+c.id+'">';
    html+='<div class="concept-header"><div class="concept-num">'+(idx+1)+'</div><div class="concept-title">'+escTB(c.name)+'</div>'+(c.star?'<div class="star-badge">\u2605 \u8a66\u9a13\u91cd\u8981</div>':'')+'</div>';
    html+=renderInlineGlossary(c.name);
    html+='<div class="scene-block"><div class="section-label" style="color:#4aa3ff">\ud83c\udfac Scene</div><div>'+renderMd(c.scene)+'</div></div>';
    if(c.compare) html+='<div style="margin:12px 0">'+renderCompareTable(c.compare)+'</div>';
    html+='<div class="punch-block"><div class="section-label" style="color:#d29922">\u26a1 Punchline</div><div class="punch-text">'+renderMd(c.punchline)+'</div></div>';
    html+='<div class="def-block"><div class="section-label">\ud83d\udcdd Definition (EN)</div><div>'+renderDefEN(c.defEN)+'</div></div>';
    html+='<div class="def-block"><div class="section-label">\ud83d\udcdd \u5b9a\u7fa9 (JA)</div><div>'+renderMd(c.defJA)+'</div></div>';
    html+='<div class="example-block"><div class="section-label" style="color:#3fb950">\ud83d\udca1 Example</div><div>'+renderMd(c.example)+'</div></div>';
    html+='<div class="why-block"><div class="section-label" style="color:#a371f7">\ud83d\udd0d Why It Matters</div><div>'+renderMd(c.whyNeeded)+'</div></div>';
    if(c.mistakes && c.mistakes.length){
      html+='<div class="mistakes-block"><div class="section-label" style="color:#f85149">\u26a0\ufe0f Common Mistakes</div>';
      c.mistakes.forEach(function(m){html+='<div class="def-bullet">\u2022 '+renderMd(m)+'</div>';});
      html+='</div>';
    }
    if(c.memorize) html+='<div class="memorize-block"><div class="section-label">\ud83e\udde0 Memorize</div><div class="memorize-text">'+escTB(c.memorize)+'</div></div>';
    html+='</div>';
    if((idx+1)%2===0) html+=renderInlineQuiz(track, idx);
  });
  html+=renderExamProblems(track);
  return html;
}
function renderExamProblems(track){
  var probs=EXAM_PROBLEMS.filter(function(p){return p.ch===track;});
  if(!probs.length) return '';
  var html='<div class="exam-section"><div class="exam-section-title">\ud83d\udccb Comprehensive Exam Practice</div>';
  probs.forEach(function(p){
    html+='<div class="exam-card">';
    html+='<div class="exam-badge">'+escTB(p.badge)+'</div>';
    html+='<div style="font-size:1.15rem;font-weight:700;margin-bottom:10px">'+escTB(p.title)+'</div>';
    html+='<div class="exam-scenario">'+escTB(p.scenario).replace(/\n/g,'<br>')+'</div>';
    if(p.transactions && p.transactions.length){ html+='<ul class="doit-items">'; p.transactions.forEach(function(t){html+='<li>'+escTB(t)+'</li>';}); html+='</ul>'; }
    if(p.questions && p.questions.length){ html+='<ol class="exam-qs" style="padding-left:22px">'; p.questions.forEach(function(q){html+='<li>'+escTB(q)+'</li>';}); html+='</ol>'; }
    html+='<button class="exam-reveal">\ud83d\udc41 \u89e3\u7b54\u3092\u898b\u308b</button>';
    html+='<div class="exam-solution"><div class="exam-sol-block">'+p.solHtml+'</div></div>';
    html+='</div>';
  });
  html+='</div>'; return html;
}
function toggleExamSolution(btn){
  var card=btn.parentNode, sol=card.querySelector('.exam-solution');
  if(sol.classList.contains('visible')){sol.classList.remove('visible');btn.textContent='\ud83d\udc41 \u89e3\u7b54\u3092\u898b\u308b';}
  else{sol.classList.add('visible');btn.textContent='\ud83d\ude48 \u89e3\u7b54\u3092\u96a0\u3059';}
}
function selectTrack(track){
  currentTrack=track;
  var pills=document.querySelectorAll('#tb-pills .ch-pill');
  Array.prototype.forEach.call(pills,function(p){p.classList.toggle('active', p.getAttribute('data-track')===track);});
  _tbQuizUsed={};
  document.getElementById('textbook-content').innerHTML = renderTrackContent(track);
  bindTextbookEvents();
  window.scrollTo(0,0);
}
function bindTextbookEvents(){
  var root=document.getElementById('textbook-content');
  if(!root) return;
  Array.prototype.forEach.call(root.querySelectorAll('.iq-opt'),function(el){
    el.onclick=function(){ checkInlineAnswer(el.getAttribute('data-q'), +el.getAttribute('data-i'), +el.getAttribute('data-a')); };
  });
  Array.prototype.forEach.call(root.querySelectorAll('.exam-reveal'),function(b){ b.onclick=function(){toggleExamSolution(b);}; });
}
function renderTextbook(){
  var panel=document.getElementById('p-textbook');
  var pills='<div class="tb-intro note">本タブの全内容は UvA Canvas の教材（講義スライド L1\u2013L8・指定論文・Mock Exam）のみに基づきます。英語の用語を主キーに、日本語で解説。トラックを選んで学習してください。</div>';
  pills+='<div class="ch-pills" id="tb-pills">';
  TRACKS.forEach(function(t){ pills+='<div class="ch-pill'+(t.key===currentTrack?' active':'')+'" data-track="'+t.key+'">'+t.key+'</div>'; });
  pills+='</div><div id="textbook-content"></div>';
  panel.innerHTML=pills;
  Array.prototype.forEach.call(panel.querySelectorAll('#tb-pills .ch-pill'),function(p){
    p.onclick=function(){ selectTrack(p.getAttribute('data-track')); };
  });
  document.getElementById('textbook-content').innerHTML = renderTrackContent(currentTrack);
  bindTextbookEvents();
}

</script>
