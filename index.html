<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>PEB2 学習サイト — Principles of Economics and Business 2</title>
<style>
:root{
  --bg:#0f1419; --panel:#1a2128; --panel2:#222b34; --line:#2e3a45;
  --tx:#e7edf3; --mut:#9fb0bf; --acc:#4aa3ff; --acc2:#2d7fd6;
  --ok:#3fb950; --okbg:#10231a; --ng:#f85149; --ngbg:#2a1416;
  --warn:#d29922; --dk:#8b949e; --rev:#a371f7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:16px;line-height:1.6}
a{color:var(--acc)}
.wrap{max-width:820px;margin:0 auto;padding:0 12px 90px}
header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0f1419,#0f1419f0);
  border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.hd{max-width:820px;margin:0 auto;padding:10px 12px 0}
.title{font-size:1.05rem;font-weight:700;letter-spacing:.2px}
.subtitle{font-size:.72rem;color:var(--mut);margin-top:2px}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto}
.tab{flex:1;min-width:70px;text-align:center;padding:9px 4px;font-size:.82rem;font-weight:600;
  color:var(--mut);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab.active{color:var(--acc);border-bottom-color:var(--acc)}
.panel{display:none;padding-top:14px}
.panel.active{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2{font-size:1.15rem;margin:18px 0 8px;border-left:4px solid var(--acc);padding-left:8px}
h3{font-size:1rem;margin:16px 0 6px;color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.muted{color:var(--mut)}
.pill{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:20px;background:var(--panel2);color:var(--mut);margin:2px 3px 2px 0;border:1px solid var(--line)}
ul{padding-left:20px;margin:6px 0}
li{margin:3px 0}
.kw{color:var(--acc);font-weight:600}
/* filters */
.filters{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px}
.frow{margin:6px 0}
.flabel{font-size:.72rem;color:var(--mut);margin-bottom:4px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;padding:6px 11px;border-radius:18px;background:var(--panel2);color:var(--mut);
  border:1px solid var(--line);cursor:pointer;user-select:none}
.chip.on{background:var(--acc2);color:#fff;border-color:var(--acc)}
.chip.mode.on{background:var(--rev);border-color:var(--rev)}
/* quiz */
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:.74rem;color:var(--mut);margin-bottom:6px}
.src{font-size:.68rem;padding:2px 7px;border-radius:5px;background:var(--panel2);border:1px solid var(--line)}
.src.exam{color:#ffd479;border-color:#5a4a1a}
.qtext{font-size:1.02rem;font-weight:600;margin:8px 0 12px;line-height:1.55}
.fig{margin:8px 0;overflow-x:auto}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;margin:7px 0;color:var(--tx);font-size:.95rem;cursor:pointer;transition:.12s}
.opt:hover{border-color:var(--acc)}
.opt.correct{background:var(--okbg);border-color:var(--ok);color:#b5f5c0}
.opt.wrong{background:var(--ngbg);border-color:var(--ng);color:#ffb3ad}
.opt.disabled{cursor:default}
.opt .lt{font-weight:700;margin-right:6px;color:var(--mut)}
.exp{background:var(--okbg);border:1px solid #1f4a2e;border-radius:10px;padding:11px 13px;margin-top:10px;font-size:.9rem;display:none}
.exp.show{display:block}
.exp .h{font-weight:700;color:var(--ok);font-size:.8rem;margin-bottom:4px}
.we{margin-top:8px;font-size:.85rem;color:var(--mut)}
.we div{margin:3px 0}
.aibtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.aibtn{flex:1;min-width:130px;font-size:.82rem;font-weight:600;padding:10px;border-radius:9px;border:1px solid var(--acc);
  background:var(--panel2);color:var(--acc);cursor:pointer}
.aibtn.alt{border-color:var(--rev);color:var(--rev)}
.aibtn:active{transform:scale(.98)}
.sm2{margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.sm2 .h{font-size:.78rem;font-weight:700;color:var(--rev);margin-bottom:4px}
.sm2-meta{font-size:.74rem;color:var(--mut);margin-bottom:8px}
.sm2-row{display:flex;gap:5px}
.sm2-btn{flex:1;font-size:.7rem;line-height:1.25;padding:7px 2px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--tx);cursor:pointer;text-align:center}
.sm2-btn:active{transform:scale(.96)}
.sm2-btn.picked{border-color:var(--rev);background:var(--rev);color:#fff}
.sm2-btn:disabled{opacity:.35}
/* footer nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:#11171 df;background:#11171d;border-top:1px solid var(--line);
  padding:9px 12px;display:flex;gap:10px;max-width:820px;margin:0 auto;z-index:40}
.nav button{flex:1;padding:13px;border-radius:10px;border:1px solid var(--line);font-size:.95rem;font-weight:700;cursor:pointer}
.nav .prev{background:var(--panel2);color:var(--tx)}
.nav .prev:disabled{opacity:.4;cursor:default}
.nav .next{background:var(--acc2);color:#fff;border-color:var(--acc)}
.progress{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:4px 0 12px}
.progress>i{display:block;height:100%;background:var(--acc);width:0;transition:.2s}
.stat{display:flex;gap:8px;flex-wrap:wrap;font-size:.74rem;margin-bottom:8px}
.stat span{padding:3px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06210f;
  padding:10px 18px;border-radius:24px;font-weight:700;font-size:.85rem;opacity:0;transition:.25s;z-index:99;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
table{font-size:.85rem}
details{margin:8px 0;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel)}
summary{cursor:pointer;font-weight:600;color:var(--acc)}
.gloss{display:grid;grid-template-columns:1fr;gap:0}
.gitem{border-bottom:1px solid var(--line);padding:9px 2px}
.gen{font-weight:600}
.gja{color:var(--mut);font-size:.88rem}
.note{font-size:.78rem;color:var(--mut);background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:10px;margin:10px 0}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:.8em}
</style>
</head>

<script>
window.QUESTIONS = [{"id":1,"conceptId":"cMLM_rawls_difference","ch":"MLM","type":"C","source":"PEB2 Mock Exam Q1","q":"[Mock Exam Q1] According to Rawls’ theory of justice, which country best adheres to the difference principle based on their income distribution?","opts":["A) A country with the least disparity between the highest and lowest income quartiles.","B) A country where the lowest income quartile has the highest income relative to other countries.","C) A country where the middle-income quartiles have the most balanced distribution.","D) A country where all income quartiles are approximately equal.","E) わからない"],"ans":1,"exp":"Rawlsの格差原理(difference principle)とマキシミン原理は、社会で最も恵まれない層(最下位層)の状況を最大化することを正義とする。よって最下位所得層の所得が他国より最も高い国が、格差原理に最もよく従っている。平等そのものではなく「最下層の底上げ」が基準である点が核心。","we":{"0":"最高層と最低層の格差が最小、というだけでは最下層の絶対水準を最大化しているとは限らない。格差原理は格差の小ささではなく最下層の水準を見る。","2":"中間層の均衡はRawlsの基準ではない。格差原理が見るのは最も恵まれない層。","3":"全層がほぼ等しい(完全平等)は平等主義の基準であって、Rawlsの格差原理は不平等でも最下層が最大化されていれば許容する。"}},{"id":2,"conceptId":"cMLM_info_symmetry","ch":"MLM","type":"A","source":"PEB2 Mock Exam Q2","q":"[Mock Exam Q2] When traders know exactly what is being traded:","opts":["A) adverse selection exists.","B) moral hazard exists.","C) trades that occur will be mutually beneficial.","D) trades will not be mutually beneficial.","E) わからない"],"ans":2,"exp":"取引対象が双方に完全に分かっている(情報の非対称性がない)とき、自発的な取引は買い手・売り手双方の利益になる(相互に有益)。情報が完全であれば、両者は自分が損する取引を選ばないため。","we":{"0":"逆選択(adverse selection)は情報の非対称性があるときに生じる。完全情報下では生じない。","1":"モラルハザードも情報の非対称性・隠れた行動から生じる問題で、完全情報の前提と矛盾する。","3":"完全情報下では自発的取引は相互に有益になるので、これは逆。"}},{"id":3,"conceptId":"cMLM_ratings_moralhazard","ch":"MLM","type":"C","source":"PEB2 Mock Exam Q3","q":"[Mock Exam Q3] Ratings and reviews can fail at mitigating moral hazard if:","opts":["A) ratings fully inform consumers of the quality of the product.","B) reviewers always review honestly.","C) not all products are reviewed.","D) ratings are faked or exaggerated.","E) わからない"],"ans":3,"exp":"評価・レビュー制度は情報を提供することでモラルハザードを緩和するが、評価が捏造・誇張されると正しい品質情報が伝わらず、緩和機能が失われる。信頼できる情報源であることが前提条件。","we":{"0":"評価が品質を完全に伝えるなら、それはモラルハザードを緩和する成功例であり失敗ではない。","1":"レビュアーが常に正直なら制度は機能する。失敗の原因にならない。","2":"一部の製品が未評価でも、評価される製品については情報が機能する。捏造ほど直接的に制度を無効化しない(最も明確な失敗要因はD)。"}},{"id":4,"conceptId":"cMLM_mbs_ratings","ch":"MLM","type":"E","source":"PEB2 Mock Exam Q4","q":"[Mock Exam Q4] The overrating of mortgage-backed securities prior to the financial crash of 2007–2009 was generally attributed to:","opts":["A) the fact that the sellers of the securities paid for the ratings.","B) the fact that customers desiring the ratings paid for them.","C) overzealousness in the securities market.","D) the wave of foreclosures prior to and during the financial crash.","E) わからない"],"ans":0,"exp":"証券の「売り手」が格付け会社に報酬を払う構造(issuer-pays)が利益相反を生み、格付けが甘くなった。格付けを欲する側ではなく、格付けされる証券を売る側が支払うことで、格付け会社が顧客(売り手)に有利な高評価を付ける誘因が働いた。","we":{"1":"格付けを欲しがる顧客が払ったのではなく、証券の発行者・売り手が払った点が利益相反の核心。","2":"市場の過熱は背景要因にすぎず、過大評価の「直接の原因」として一般に挙げられるのは支払構造。","3":"差し押さえの波は危機の結果・進行であり、事前の過大評価の原因ではない。"}},{"id":5,"conceptId":"cMLM_positive_normative","ch":"MLM","type":"A","source":"PEB2 Mock Exam Q5","q":"[Mock Exam Q5] Which is an example of a positive economic statement?","opts":["A) Higher education should receive less funding.","B) Weaker higher education is associated with less innovation.","C) Higher education was under-funded for years.","D) All three are an example of positive economic statements.","E) わからない"],"ans":1,"exp":"実証的(positive)言明は「事実として何がそうであるか」を述べ、検証可能。「高等教育の弱体化はイノベーション低下と相関する」は事実関係の主張で検証可能なので実証的。価値判断を含まない。","we":{"0":"\"should\"(〜すべき)は規範的(normative)言明で、価値判断を含むため実証的ではない。","2":"\"under-funded\"(資金不足だった)は十分性の評価=規範的判断を含むため実証的とは言い切れない(基準依存)。","3":"3つ全てが実証的なのではない。AとBは規範的要素を含むので誤り。"}},{"id":6,"conceptId":"cMLM_falkszech_mouse","ch":"MLM","type":"E","source":"PEB2 Mock Exam Q6","q":"[Mock Exam Q6] Based on the study by Falk and Szech on market interactions and moral values, what effect does trading in a multilateral market have on the decision-making regarding the life of a mouse compared to individual decision-making?","opts":["A) The willingness to trade the life of a mouse for money remains unchanged due to the inherent moral values of the traders.","B) Traders in a multilateral market are less likely to trade the life of a mouse for money than in individual decision-making, due to increased moral scrutiny.","C) There is a higher willingness among traders in a multilateral market to accept lower prices for the life of a mouse compared to individual decision-making, indicating a degradation of moral values.","D) The multilateral market enhances moral responsibility, resulting in higher prices required to trade the life of a mouse.","E) わからない"],"ans":2,"exp":"Falk & Szech (2013)では、個人判断(45.9%)→双方向市場(72.2%)→多者間市場(75.9%)とマウスを殺す意思が高まり、より低い価格でも命を取引する。市場が道徳価値を侵食する(market erodes morality)ことを示す。原因は責任の分散・社会規範の形成・物質主義的フレーミング。","we":{"0":"市場参加で意思は「不変」ではなく上昇した。固有の道徳価値が市場で保持されるという結論ではない。","1":"多者間市場では道徳的吟味が増えて取引が減る、ではなく、逆に取引意思が増えた。","3":"市場が道徳的責任を高め高価格を要するのではなく、市場は価値を侵食し低価格でも取引させた。"}},{"id":7,"conceptId":"cMLM_moralmachine","ch":"MLM","type":"E","source":"PEB2 Mock Exam Q7","q":"[Mock Exam Q7] Based on the “Moral Machine” experiment, how did the inclusion of additional character details in accident scenarios affect the decisions made by participants regarding autonomous vehicle behavior?","opts":["A) Additional details had no significant impact, with participants showing consistent choices across scenarios.","B) Participants made quicker decisions in scenarios with more character details due to increased clarity.","C) The complexity of scenarios with additional details reduced the overall number of decisions made.","D) The inclusion of additional character details led to a greater differentiation in choices, highlighting a stronger preference for sparing certain types of characters.","E) わからない"],"ans":3,"exp":"Awad et al. (2018)のMoral Machine実験では、登場人物の詳細(年齢・社会的地位など)を加えると選択の差別化が大きくなり、特定の人物類型を助ける選好が強まった。人々は中立ではなく、属性に応じた道徳的選好を示した。","we":{"0":"詳細の追加は選択に有意な影響を与えた(差別化が増えた)ので「影響なし」は誤り。","1":"判断速度が論点ではない。実験の知見は選好の差別化。","2":"詳細追加で決定数が減ったわけではない。"}},{"id":8,"conceptId":"cMLM_forprofit_nursing","ch":"MLM","type":"E","source":"PEB2 Mock Exam Q8","q":"[Mock Exam Q8] How might the issues surrounding public and private prisons be similar to those of nonprofit and for-profit nursing homes?","opts":["A) For-profit nursing homes might have lower costs than nonprofit ones, but the lower costs might result in poor quality patient care.","B) For-profit nursing homes might have higher costs than nonprofit ones, but the higher costs are from better patient care.","C) For-profit nursing homes might have higher costs than nonprofit ones, but the higher costs might result in superior patient care.","D) Compared with nonprofit ones, for-profit nursing homes are less likely to adapt to changing market conditions.","E) わからない"],"ans":0,"exp":"営利施設はコスト削減の誘因が強く、コストは下がるが、その削減が患者ケアの質の低下を招きうる。営利刑務所と同様、利潤動機がサービス質を犠牲にしうるという「価値の腐敗」の論点。","we":{"1":"営利施設の特徴はコスト「削減」であり、高コスト+良質ケアという組合せは営利の典型的懸念とずれる。","2":"同上。営利の懸念は低コスト化による質低下であり、高コストで優れたケアではない。","3":"営利施設はむしろ市場条件に敏感に適応する。適応しにくいという主張は逆。"}},{"id":9,"conceptId":"cMLM_maximin_table","ch":"MLM","type":"D","source":"PEB2 Mock Exam Q9","q":"[Mock Exam Q9] Refer to the table of group incomes. According to the maximin (Rawls) principle, which society does the principle judge to be the best (ranked highest)?","opts":["A) Society A","B) Society D","C) Society B","D) Society C","E) わからない"],"ans":1,"exp":"マキシミン原理は各社会の「最下位グループの所得(最小値)」を比較し、それが最大の社会を最善と判断する。各社会の最小値: A=100, B=50, C=99, D=101。最大の最小値はD(101)なので、Rawlsの原理はDを最善(最高位)と判定する。平均所得ではなく最下層の水準で評価する点が核心。","we":{"0":"Aの最小値は100でDの101より低い。マキシミンでは最下層が最も高いDが上位。","2":"Bの最小値は50で最も低く、マキシミンでは最下位に評価される(最善ではない)。","3":"Cの最小値は99でDより低い。平均は同じ433だが、マキシミンは平均でなく最小値で評価する。"},"fig":"<table style=\"border-collapse:collapse;margin:6px 0;font-size:.92em\"><tr><th style=\"border:1px solid #999;padding:3px 8px\">Society</th><th style=\"border:1px solid #999;padding:3px 8px\">Red</th><th style=\"border:1px solid #999;padding:3px 8px\">Blue</th><th style=\"border:1px solid #999;padding:3px 8px\">Green</th><th style=\"border:1px solid #999;padding:3px 8px\">Average</th></tr><tr><td style=\"border:1px solid #999;padding:3px 8px\">A</td><td style=\"border:1px solid #999;padding:3px 8px\">100</td><td style=\"border:1px solid #999;padding:3px 8px\">100</td><td style=\"border:1px solid #999;padding:3px 8px\">100</td><td style=\"border:1px solid #999;padding:3px 8px\">100</td></tr><tr><td style=\"border:1px solid #999;padding:3px 8px\">B</td><td style=\"border:1px solid #999;padding:3px 8px\">150</td><td style=\"border:1px solid #999;padding:3px 8px\">100</td><td style=\"border:1px solid #999;padding:3px 8px\">50</td><td style=\"border:1px solid #999;padding:3px 8px\">100</td></tr><tr><td style=\"border:1px solid #999;padding:3px 8px\">C</td><td style=\"border:1px solid #999;padding:3px 8px\">600</td><td style=\"border:1px solid #999;padding:3px 8px\">600</td><td style=\"border:1px solid #999;padding:3px 8px\">99</td><td style=\"border:1px solid #999;padding:3px 8px\">433</td></tr><tr><td style=\"border:1px solid #999;padding:3px 8px\">D</td><td style=\"border:1px solid #999;padding:3px 8px\">1096</td><td style=\"border:1px solid #999;padding:3px 8px\">102</td><td style=\"border:1px solid #999;padding:3px 8px\">101</td><td style=\"border:1px solid #999;padding:3px 8px\">433</td></tr></table>"},{"id":10,"conceptId":"cMLM_markets_work_best","ch":"MLM","type":"A","source":"PEB2 Mock Exam Q10","q":"[Mock Exam Q10] Markets work best when:","opts":["A) buyers know exactly what they are buying.","B) sellers signal exactly what they are selling.","C) both buyers and sellers know what is being exchanged.","D) both buyers and sellers have at least some information about what is being exchanged.","E) わからない"],"ans":2,"exp":"市場が最もよく機能するのは、買い手・売り手の双方が交換対象を正確に知っているとき(情報の非対称性が無い)である。双方が完全な情報を持てば、成立する取引は相互に有益となる。","we":{"0":"買い手だけが知っていても、売り手側の情報非対称が残れば最適ではない。双方の完全情報が条件。","1":"売り手のシグナリングだけでは不十分。買い手側の情報も必要で、双方が知ることが理想。","3":"「ある程度の情報」では非対称性が残りうる。最良に機能するのは双方が正確に知るとき。"}},{"id":11,"conceptId":"cTAX_source_only_CIN","ch":"TAX","type":"C","source":"PEB2 Mock Exam Q11","q":"[Mock Exam Q11] Assume that all countries in the world are source jurisdictions only, taxing a source of income generated on the soil of that country. Which of the following would then be achieved?","opts":["A) Capital export neutrality.","B) Capital import neutrality.","C) Capital import and export neutrality.","D) Double taxation.","E) わからない"],"ans":1,"exp":"全ての国が源泉地(source)課税のみを行うと、ある国に投資される資本は、投資家の居住地に関係なく同じ源泉地税率で課税される。これは資本輸入中立性(CIN: 国内・外国投資家が同一に課税)を達成する。居住地課税が無いため資本輸出中立性は得られない。","we":{"0":"資本輸出中立性(CEN)は居住地課税(世界所得への同率課税)で達成される。源泉地のみではCENは得られない。","2":"CINとCENの両立は源泉地のみの体系では生じない。両立は特定条件下のみ。","3":"各国が自国源泉のみ課税するなら、同じ所得が二重に課税されることは原則生じない。"}},{"id":12,"conceptId":"cTAX_exemption_method","ch":"TAX","type":"C","source":"PEB2 Mock Exam Q12","q":"[Mock Exam Q12] What cannot be achieved with the tax exemption method?","opts":["A) Capital import neutrality.","B) Capital import and export neutrality.","C) Capital export neutrality.","D) Stateless or white income.","E) わからない"],"ans":2,"exp":"免税方式(exemption method)は外国所得を居住地で免税し源泉地税率に委ねるため、源泉地での同一課税=資本輸入中立性(CIN)を実現するが、居住地が投資先で税率差を均さないため資本輸出中立性(CEN)は達成できない。CENには税額控除方式が必要。","we":{"0":"免税方式は源泉地での課税に委ねるため資本輸入中立性(CIN)は達成できる。これは「できない」ものではない。","1":"CINは達成できるので「両方できない」は誤り。免税方式で達成できないのはCENのみ。","3":"免税方式はむしろstateless/white income(無国籍所得=どこでも課税されない)を生み出しうる。達成「できない」ものではない。"}},{"id":13,"conceptId":"cTAX_CEN_definition","ch":"TAX","type":"A","source":"PEB2 Mock Exam Q13","q":"[Mock Exam Q13] What does the concept of Capital Export Neutrality (CEN) primarily focus on in international taxation?","opts":["A) Tax treatment of capital gains for domestic investors.","B) Tax incentives for exporting goods and services.","C) The impact of inflation on capital investments.","D) Equal taxation of domestic and foreign investments for domestic investors.","E) わからない"],"ans":3,"exp":"資本輸出中立性(CEN)は、ある国の居住者(国内投資家)が、国内に投資しても外国に投資しても同じ実効税率に直面することを重視する。投資先で課税が変わらないため、投資判断が税で歪まず効率的な資本配分が保たれる。方法は世界所得を同率で課税。","we":{"0":"CENはキャピタルゲインの扱いそのものではなく、国内外投資の課税の同等性に焦点を当てる。","1":"CENは財・サービスの輸出促進策(輸出インセンティブ)とは無関係。名称の\"export\"は資本の輸出を指す。","2":"インフレの影響はCENの論点ではない。"}},{"id":14,"conceptId":"cTAX_benefit_arbitrage","ch":"TAX","type":"A","source":"PEB2 Mock Exam Q14","q":"[Mock Exam Q14] Consider: (1) The “benefits principle” is a justification for taxation in a domestic setting, linking public expenditure provided by the state to citizens’ obligation to pay tax. (2) International tax arbitrage can be referred to as the exploitation of regulatory differences between the involved jurisdictions.","opts":["A) Both statements are correct.","B) Only statement 1 is correct.","C) Only statement 2 is correct.","D) None of the statements are correct.","E) わからない"],"ans":0,"exp":"両方正しい。受益者原則(benefit principle)は、市民が国家提供の公共支出から受ける便益に応じて納税義務を負うとし、源泉地課税を正当化する。国際的タックスアービトラージは、関係する法域間の規制(税制)の差を利用する行為を指す。どちらも講義の定義通り。","we":{"1":"文1だけでなく文2(国際的タックスアービトラージの定義)も正しい。","2":"文2だけでなく文1(受益者原則の説明)も正しい。","3":"両文とも正しいので「どちらも誤り」は不適切。"}},{"id":15,"conceptId":"cTAX_BEPS_residence","ch":"TAX","type":"A","source":"PEB2 Mock Exam Q15","q":"[Mock Exam Q15] Consider: (1) Limiting taxation at source and strengthening residence taxation may generally weaken strong economies and benefit developing countries. (2) Preventing that stateless income is not taxed is in line with the objectives of the OECD-G20 BEPS project.","opts":["A) Both statements are correct.","B) Only statement 2 is correct.","C) Only statement 1 is correct.","D) None of the statements are correct.","E) わからない"],"ans":1,"exp":"文2のみ正しい。BEPS(税源浸食・利益移転)プロジェクトは、どこでも課税されない無国籍所得(stateless income)の発生防止を目的の一つとするため文2は正しい。文1は逆で、源泉地課税を弱め居住地課税を強めると、資本輸出国(先進国)が有利になり途上国(源泉地)に不利になるのが一般的見解。","we":{"0":"文1が誤り。源泉地課税の制限+居住地課税強化は先進国に有利・途上国に不利になりやすく、記述は逆。","2":"文1は逆の効果を述べており誤り。正しいのは文2のみ。","3":"文2は正しいので「どちらも誤り」は不適切。"}},{"id":16,"conceptId":"cTAX_transfer_pricing","ch":"TAX","type":"A","source":"PEB2 Mock Exam Q16","q":"[Mock Exam Q16] What is true in relation to transfer pricing?","opts":["A) Unrelated companies pay the fair market value in case of a transaction.","B) If a related company pays 100 for a product with a fair market value of 1,000, it can be considered at arm’s length.","C) Related companies must act on an at arm’s length basis.","D) None of the above.","E) わからない"],"ans":2,"exp":"移転価格税制では、関連会社(グループ内)間の取引は独立企業間原則(at arm’s length)に従い、無関係な独立企業同士なら付けるであろう公正市場価格で取引しなければならない。これにより低税国への人為的な利益移転を防ぐ。","we":{"0":"無関係な企業が市場価格で取引するのは事実だが、移転価格税制が「関連会社」に課す規律(独立企業間原則)を述べたBの方が問いの核心。Aは前提説明にとどまる。","1":"公正市場価値1,000の製品を100で取引するのは独立企業間価格から大きく乖離しており、arm’s lengthとは見なせない。","3":"Bが正しいので「いずれも該当せず」は誤り。"}},{"id":17,"conceptId":"cTAX_CEN_resident_rate","ch":"TAX","type":"A","source":"PEB2 Mock Exam Q17","q":"[Mock Exam Q17] Which statement is true for capital export neutrality?","opts":["A) All investors in a country face the same effective tax rate on income sourced in that country.","B) Capital export neutrality means that countries introduce low corporate tax rates to discourage foreign investment.","C) A country treats the difference between the fair market value of the entity at the beginning and end of the taxable year as income.","D) Investors that are resident in a country are always subject to the same effective domestic tax rate irrespective of whether they invest at home or abroad.","E) わからない"],"ans":3,"exp":"CENは、ある国の居住投資家が国内・国外いずれに投資しても同じ実効国内税率を負担することを意味する。これにより投資地選択が税で歪まない。世界所得を同率課税することで達成される。","we":{"0":"これは資本輸入中立性(CIN)の説明(源泉地での全投資家同一税率)であり、CENではない。","1":"CENは外国投資を抑制する低法人税の導入を意味しない。これは税競争の話で定義が誤り。","2":"期首と期末の公正価値の差を所得とみなすのはmark-to-market課税の説明で、CENとは無関係。"}},{"id":18,"conceptId":"cTAX_permanent_establishment","ch":"TAX","type":"A","source":"PEB2 Mock Exam Q18","q":"[Mock Exam Q18] In international tax law, what does the term \"permanent establishment\" refer to?","opts":["A) A fixed place of business through which an enterprise carries on its business activities, either wholly or partly.","B) A long-term contractual agreement between two multinational corporations.","C) The physical location where a business is registered and conducts its daily operations.","D) The duration of time a foreign entity operates within a host country’s borders.","E) わからない"],"ans":0,"exp":"恒久的施設(permanent establishment, PE)とは、企業が事業活動の全部または一部を行う「固定的な事業の場所」を指す(支店・事務所・工場・作業場・鉱山など)。源泉地国はPEがある場合に事業所得を課税できる。デジタル企業は物理的存在を要さないためPE概念が時代遅れとされる。","we":{"1":"PEは多国籍企業間の長期契約ではなく、固定的な事業の場所を指す。","2":"登記地(本店所在地)はPEの定義ではない。PEは事業を行う固定的な場所で、登記の有無とは別概念。","3":"外国企業が活動する「期間」ではなく「固定的な場所」がPEの本質。"}},{"id":19,"conceptId":"cTAX_beretta_sharing","ch":"TAX","type":"A","source":"PEB2 Mock Exam Q19","q":"[Mock Exam Q19] Which types of transactions are specifically recognized by Beretta as part of the sharing economy?","opts":["A) Credit card payments.","B) Cost-sharing arrangements.","C) Interest free loans.","D) Subsidies.","E) わからない"],"ans":1,"exp":"Beretta(2017)はシェアリングエコノミーの取引類型として、現金取引・物々交換(barter)・コストシェアリング(cost-sharing)・贈与/寄付などを挙げる。コストシェアリング(費用分担)は典型例として明示される。","we":{"0":"クレジットカード決済は単なる支払手段であり、Berettaがシェアリングエコノミーの取引類型として特に挙げたものではない。","2":"無利子融資はBerettaの列挙する代表的取引類型ではない。","3":"補助金(subsidies)はシェアリングエコノミーの取引類型ではない。"}},{"id":20,"conceptId":"cTAX_beretta_separate_laws","ch":"TAX","type":"C","source":"PEB2 Mock Exam Q20","q":"[Mock Exam Q20] Beretta argues policy makers should not create separate laws that apply only to the sharing economy. What argument does Beretta give as a disadvantage of creating such separate laws?","opts":["A) This creates a system that is too difficult to understand or apply.","B) It takes too long to create a separate law.","C) Taxpayers that provide similar services and goods could potentially be taxed differently, violating one of the principles of good taxation.","D) None of the statements are correct.","E) わからない"],"ans":2,"exp":"Berettaは、シェアリングエコノミー専用の別個の法を作ると、類似の財・サービスを提供する納税者が異なる扱いを受けうるとする。これは「良い税制の原則(公平・中立=同様の状況は同様に課税)」に反するため不利だと論じる。","we":{"0":"適用が難しいという実務的困難はBerettaの主たる論拠ではない。中心は公平性原則の侵害。","1":"立法に時間がかかることはBerettaの挙げる不利益ではない。","3":"Aが正しいので「いずれも誤り」は不適切。"}},{"id":21,"conceptId":"cSUST_ecological_econ","ch":"SUST","type":"A","source":"PEB2 Mock Exam Q21","q":"[Mock Exam Q21] Ecological economics can be characterized by the central role of (i) ____ scarcity and (ii) ____ substitution possibilities of natural capital. Which words should be substituted at (i) and (ii)?","opts":["A) (i) absolute; (ii) unlimited.","B) (i) absolute; (ii) limited.","C) (i) relative; (ii) limited.","D) (i) relative; (ii) unlimited.","E) わからない"],"ans":1,"exp":"生態経済学(ecological economics, 強い持続可能性の立場)は、自然資本の(i)絶対的(absolute)希少性と、(ii)限定的(limited)な代替可能性を中心に据える。自然資本は人工資本で容易に代替できないと考える。対照的に環境経済学(弱い持続可能性)は相対的希少性と無限の代替を前提とする(Solowの議論)。","we":{"0":"代替可能性は「無限」ではなく「限定的」とするのが生態経済学。自然資本は容易に代替できない。","2":"希少性は「相対的」ではなく「絶対的」とするのが生態経済学の立場。相対的希少性は環境経済学側。","3":"絶対的希少性かつ限定的代替が生態経済学。相対的+無限は環境経済学(弱い持続可能性)。"}},{"id":22,"conceptId":"cSUST_weak_sustainability","ch":"SUST","type":"A","source":"PEB2 Mock Exam Q22","q":"[Mock Exam Q22] How do economists define developments that satisfy a weak sustainability criterion?","opts":["A) Developments that increase human-made capital at the expense of a larger loss of natural capital.","B) Developments that increase natural capital at the expense of a larger loss of human-made capital.","C) Developments that maintain a non-decreasing sum of human-made and natural capital.","D) Developments that maintain a non-decreasing human-made and natural capital separately.","E) わからない"],"ans":2,"exp":"弱い持続可能性(weak sustainability)は、人工資本と自然資本の「合計」が非減少であれば持続可能とみなす(Costanza & Daly 1992)。自然資本の減少を人工資本の増加で補える=両者は代替可能と前提する。","we":{"0":"自然資本のより大きな損失を伴う人工資本の増加は、合計が減るので弱い持続可能性すら満たさない。","1":"人工資本のより大きな損失を伴う自然資本増加も合計が減り、弱い持続可能性の定義に合わない。","3":"人工資本と自然資本を「別々に」非減少に保つのは強い持続可能性(strong sustainability)の定義。弱い持続可能性は合計で見る。"}},{"id":23,"conceptId":"cSUST_busch_criticism","ch":"SUST","type":"C","source":"PEB2 Mock Exam Q23","q":"[Mock Exam Q23] Which of the following is NOT listed by Busch et al. (2024) as a key criticism of “the” business case for corporate sustainability?","opts":["A) The business case is built on a techno-optimistic rather than a holistic approach.","B) The business case optimizes rather than prioritizes environmental problems.","C) The business case promotes consumerism, which is a root cause of environmental unsustainability.","D) The business case prioritizes social goals over environmental problems.","E) わからない"],"ans":3,"exp":"Busch et al.(2024)が挙げるビジネスケース批判は、(1)最適化の準最適性(optimizeするだけでprioritizeしない)、(2)技術楽観主義(Jevonsのパラドックス)、(3)消費主義の助長、の3つ。「社会的目標を環境問題より優先する」はリストに無いのでこれがNOT。","we":{"0":"技術楽観主義(holisticでない)はBuschの挙げる批判の一つなので、NOTではない。","1":"環境問題を優先せず最適化するだけ(suboptimality of optimization)は挙げられた批判。NOTではない。","2":"消費主義の助長(Patagonia例)は挙げられた批判の一つ。NOTではない。"}},{"id":24,"conceptId":"cSUST_west_additionality","ch":"SUST","type":"C","source":"PEB2 Mock Exam Q24","q":"[Mock Exam Q24] Which statement best captures the relation between \"additionality\" and \"counterfactual\" in West et al. (2023)’s analysis of carbon offsets?","opts":["A) There is additionality when a project’s actual deforestation is lower than its counterfactual scenario derived from observable control areas.","B) There is additionality when a project’s predicted deforestation is lower than observed deforestation in the project areas.","C) The additionality of a project is determined based on the project developers’ initial ex ante baseline, since counterfactual analysis is impossible.","D) The additionality of a project is impossible to verify if counterfactuals can be strategically inflated.","E) わからない"],"ans":0,"exp":"West et al.(2023)は、観測可能な対照地域から作った「合成コントロール(counterfactual=もし保全しなかったら)」と比べ、プロジェクトの実際の森林減少がそれより低いときに追加性(additionality)があるとする。事前ベースラインではなく事後の合成対照で評価する点が貢献。結果は約6%しか約束された削減を生まなかった。","we":{"1":"予測値と観測値の比較ではなく、実際の減少と反事実シナリオの比較で追加性を判断する。","2":"West et al.はまさに反事実分析(合成コントロール)が可能だと示した。事前ベースライン依存はむしろ批判対象。","3":"反事実が戦略的に水増しされる懸念はあるが、本論文の追加性の定義はAの反事実比較。"}},{"id":25,"conceptId":"cSUST_wright_nyberg_normalizing","ch":"SUST","type":"C","source":"PEB2 Mock Exam Q25","q":"[Mock Exam Q25] What typically occurs during the \"normalizing\" stage of a corporation’s response to climate change, according to Wright and Nyberg (2017)?","opts":["A) Initial strong commitments to climate action are solidified into long-term strategy by investing heavily in a decarbonization culture.","B) Corporate practices are realigned with the dominant discourse of maximizing shareholder value, often diluting earlier climate initiatives.","C) Corporations push for decarbonization of the entire industry by advocating strong government regulation.","D) The company pre-empts greenwashing criticism by committing to decarbonization and using offsets only for unabatable emissions.","E) わからない"],"ans":1,"exp":"Wright & Nyberg(2017)は、企業の気候対応がframing→localizing→normalizingと進み、最終のnormalizing段階で当初の気候への取組が支配的言説(株主価値最大化)に再整合され、希釈(dilution)・純化(purification)される=「通常業務(business as usual)」に戻ると論じる。","we":{"0":"当初のコミットメントが長期戦略として「固定化」されるのではなく、むしろ希釈される。これは逆の結論。","2":"業界全体の脱炭素を政府規制で推進する、はWright & Nybergのnormalizingの説明ではない。","3":"グリーンウォッシング批判の先回りは本モデルのnormalizing段階の記述ではない。"}},{"id":26,"conceptId":"cSUST_nonrival_goods","ch":"SUST","type":"A","source":"PEB2 Mock Exam Q26","q":"[Mock Exam Q26] Which one of the following goods has non-rival consumption?","opts":["A) Public transport.","B) Timber.","C) Fireworks.","D) Vaccines.","E) わからない"],"ans":2,"exp":"非競合的(non-rival)消費とは、ある人の消費が他者の消費可能量を減らさない財。花火(fireworks)は一人が見ても他者が見られる量は減らないため非競合的。","we":{"0":"公共交通は座席・容量に限りがあり、混雑時は一人の利用が他者の利用可能性を下げる(競合的)。","1":"木材(timber)は使えば無くなる私的財で競合的。","3":"ワクチンは1本接種すれば他者は使えない競合的な財。"}},{"id":27,"conceptId":"cSUST_decoupling","ch":"SUST","type":"A","source":"PEB2 Mock Exam Q27","q":"[Mock Exam Q27] Complete: Only _(I)_ decoupling can be described as green growth. Achieving green growth through innovation is _(II)_ by Jevons paradox type of rebound effects.","opts":["A) (I) = absolute, (II) = facilitated.","B) (I) = relative, (II) = complicated.","C) (I) = relative, (II) = facilitated.","D) (I) = absolute, (II) = complicated.","E) わからない"],"ans":3,"exp":"グリーン成長と呼べるのは(I)絶対的(absolute)デカップリング(GDP増加かつ環境影響減少)のみ。そして革新によるグリーン成長は、Jevonsのパラドックス型のリバウンド効果(効率改善が消費増を招く)によって(II)困難になる(complicated)。相対的デカップリングは影響がGDPより緩やかに増えるだけで成長中も影響は増える。","we":{"0":"(II)はリバウンド効果で「促進(facilitated)」ではなく「困難化(complicated)」される。Jevonsは効率化が消費を増やす逆効果。","1":"(I)は相対的ではなく絶対的デカップリングのみがグリーン成長。相対的では影響が増え続ける。","2":"(I)が相対的、(II)が促進、どちらも誤り。正しくは絶対的+困難化。"}},{"id":28,"conceptId":"cSUST_kallis_doubleresources","ch":"SUST","type":"C","source":"PEB2 Mock Exam Q28","q":"[Mock Exam Q28] According to Kallis et al. (2025), recent assessments of The Limits to Growth show historical data since 1970 most closely follows the \"Double Resources\" scenario, where collapse is driven by:","opts":["A) Persistent pollution and sink limits to ecosystem stability.","B) A lack of technological innovation to offset resource depletion.","C) Financial shocks caused by stranded assets.","D) Population decline due to lower birth rates.","E) わからない"],"ans":0,"exp":"Kallis et al.(2025)によれば、現実はLimits to Growthの「Double Resources(資源2倍)」シナリオに最も近く、崩壊は資源(source)枯渇ではなく、持続的な汚染とその生態系安定性への影響=シンク(sink)限界/再生能力の限界によって駆動される。標準シナリオより崩壊が遅れて起きる点が特徴。","we":{"1":"Double Resourcesシナリオでは資源枯渇(source limit)が原因ではない。標準シナリオの話で混同。","2":"座礁資産による金融ショックはLimits to Growthモデルの崩壊要因ではない。","3":"出生率低下による人口減少は崩壊の駆動要因として挙げられていない。崩壊は汚染(sink限界)による。"}},{"id":29,"conceptId":"cSUST_costanza_intrinsic","ch":"SUST","type":"C","source":"PEB2 Mock Exam Q29","q":"[Mock Exam Q29] Which values of nature are least suitable to express as (relative) monetary value according to Costanza (2024)?","opts":["A) Cultural values.","B) Intrinsic values.","C) Instrumental values.","D) Regulating values.","E) わからない"],"ans":1,"exp":"Costanza(2024)は、内在的価値(intrinsic values=自然の権利。例: ニュージーランドのWhanganui川の法人格)は貨幣価値に翻訳できず、金銭評価に最も適さないとする。生態系サービス評価は権利ベースのアプローチと補完的であり、内在的価値は金銭化の対象外。","we":{"0":"文化的価値は評価が難しい面はあるが、Costanzaが金銭化に最も不適とするのは内在的価値。","2":"手段的価値(instrumental)はまさに生態系サービスとして金銭評価しやすい類型。","3":"調整サービス(regulating values)も生態系サービスとして金銭評価の対象になりうる。"}},{"id":30,"conceptId":"cSUST_doughnut_ozone","ch":"SUST","type":"C","source":"PEB2 Mock Exam Q30","q":"[Mock Exam Q30] According to the recent doughnut by Fanning and Raworth (2025), which Earth system is thought to be within safe planetary boundaries?","opts":["A) Climate change.","B) Biodiversity loss.","C) Ozone depletion.","D) Disturbance to the nitrogen cycle.","E) わからない"],"ans":2,"exp":"Fanning & Raworth(2025)の更新版ドーナツでは、オゾン層破壊(ozone depletion)は安全な惑星限界の「内側」にあるとされる(モントリオール議定書の成功例)。気候変動・生物多様性損失・窒素循環の撹乱はいずれも限界を超過している。","we":{"0":"気候変動は安全限界を超過しており、内側ではない。","1":"生物多様性損失は深刻に限界を超えており、内側ではない。","3":"窒素循環の撹乱も限界を超過している。安全圏内なのはオゾン層。"}},{"id":31,"conceptId":"cDF_birkinshaw_policy","ch":"DF","type":"E","source":"PEB2 Mock Exam Q31","q":"[Mock Exam Q31] According to Birkinshaw, what is a central policy challenge introduced by the digital revolution?","opts":["A) Financing physical infrastructure.","B) Valuing data and intangible assets.","C) Pricing consumer goods fairly.","D) Preventing international trade.","E) わからない"],"ans":1,"exp":"Birkinshaw(2018)は、デジタル革命が突きつける中心的な政策課題として、データや無形資産(intangible assets)の価値評価を挙げる。従来の有形資産中心の枠組み(知財・競争政策など)が、データや無形物の価値づけに対応できていない。","we":{"0":"物理インフラの資金調達は産業時代の課題で、デジタル革命の中心的な新課題ではない。","2":"消費財の公正な価格設定はBirkinshawの中心論点ではない。","3":"国際貿易の阻止は論点ではない。"}},{"id":32,"conceptId":"cDF_pipeline_value","ch":"DF","type":"A","source":"PEB2 Mock Exam Q32","q":"[Mock Exam Q32] How do pipeline businesses primarily create value?","opts":["A) By facilitating interactions between users.","B) By subsidizing one side of a market.","C) By optimizing a linear value chain.","D) By leveraging user-generated data.","E) わからない"],"ans":2,"exp":"パイプライン型ビジネスは、線形のバリューチェーン(調達→製造→販売→サービス)を最適化することで価値を生む。これに対しプラットフォームは外部の生産者と消費者の相互作用を仲介して価値を生む。","we":{"0":"ユーザー間の相互作用を仲介するのはプラットフォーム型の価値創造であり、パイプラインではない。","1":"市場の片側への補助(subsidizing)はプラットフォームの立ち上げ戦略であり、パイプラインの主たる価値創造ではない。","3":"ユーザー生成データの活用はプラットフォーム/デジタル企業の特徴で、伝統的パイプラインの本質ではない。"}},{"id":33,"conceptId":"cDF_platform_asset","ch":"DF","type":"A","source":"PEB2 Mock Exam Q33","q":"[Mock Exam Q33] What is the main asset of a successful platform?","opts":["A) Intellectual property patents.","B) Physical infrastructure.","C) Brand reputation.","D) The community and its interactions.","E) わからない"],"ans":3,"exp":"プラットフォームの主要資産は、コミュニティ(参加者ネットワーク)とその相互作用である。ネットワーク効果により、参加者と取引が増えるほど価値が高まる。物理資産や特許ではなくネットワークの価値が競争の核心。","we":{"0":"特許(知財)はパイプライン型企業の重要資産だが、プラットフォームの主要資産はコミュニティ。","1":"物理インフラを所有しなくてよいのがプラットフォームの新しさ。主要資産ではない。","2":"ブランド評判は補助的要素で、プラットフォームの中核資産はネットワーク/コミュニティ。"}},{"id":34,"conceptId":"cDF_hub_characteristics","ch":"DF","type":"A","source":"PEB2 Mock Exam Q34","q":"[Mock Exam Q34] What characterizes economic actors that function as hubs?","opts":["A) They control platforms that connect many users.","B) They mainly produce physical goods.","C) They operate only within national markets.","D) They rely on public ownership by the national state.","E) わからない"],"ans":0,"exp":"ハブ企業(Iansiti & Lakhani)は、多数のユーザーをつなぐプラットフォームを支配し、ボトルネックを制御して不釣り合いに大きな価値を獲得する。ネットワークベースの資産を使い別市場にも参入し、製品駆動の市場をネットワーク駆動に転換する。","we":{"1":"ハブ企業は物理財の生産が中心ではなく、ネットワーク/プラットフォームの支配が特徴。","2":"ハブ企業は国内市場に限定されず、グローバルに数十億の消費者へアクセスする。","3":"ハブ企業は国家による公的所有に依存しない。民間のプラットフォーム支配が特徴。"}},{"id":35,"conceptId":"cDF_hub_growth","ch":"DF","type":"C","source":"PEB2 Mock Exam Q35","q":"[Mock Exam Q35] What mechanism causes successful hubs to grow faster over time?","opts":["A) State protection and national funding.","B) Positive feedback loops from usage.","C) Economies of scale in manufacturing.","D) Exclusive licensing agreements competitors do not have.","E) わからない"],"ans":1,"exp":"成功したハブは、利用が利用を呼ぶ正のフィードバックループ(ネットワーク効果)で自己強化的に加速する。参加者が増えるほど価値が増し、さらに参加者を引き寄せる。これが「勝者総取り」を生む。","we":{"0":"国家の保護や資金はハブ成長の機構ではない。むしろ自己強化的ネットワーク効果による。","2":"製造業の規模の経済(供給側)ではなく、需要側のネットワーク効果(正のフィードバック)が加速の機構。","3":"独占的ライセンスではなく、利用からの正のフィードバックがハブの加速要因。"}},{"id":36,"conceptId":"cDF_thirdparty_dev","ch":"DF","type":"A","source":"PEB2 Mock Exam Q36","q":"[Mock Exam Q36] What is a primary characteristic of third-party development?","opts":["A) Developers work as employees of the platform owner.","B) Applications are developed for internal use.","C) Independent actors develop applications for end users.","D) Development occurs only through open-source licenses.","E) わからない"],"ans":2,"exp":"サードパーティ開発(Ghazawneh & Henfridsson)では、独立した主体(プラットフォーム所有者の従業員ではない)が、エンドユーザーのためにアプリを開発する。所有者は境界資源(boundary resources: SDK・API等)を提供して外部開発を支援する。","we":{"0":"サードパーティ開発者は所有者の「従業員ではない」独立主体である点が核心。","1":"内部利用のための開発ではなく、エンドユーザー向けのアプリ開発。","3":"オープンソースのみに限定されない。所有者の提供する境界資源を通じ多様な形態で行われる。"}},{"id":37,"conceptId":"cDF_thirdparty_motive","ch":"DF","type":"A","source":"PEB2 Mock Exam Q37","q":"[Mock Exam Q37] What primarily motivates platform owners to involve third-party developers?","opts":["A) Reducing legal responsibility.","B) Lowering hardware costs.","C) Avoiding platform updates.","D) Increasing application variety.","E) わからない"],"ans":3,"exp":"プラットフォーム所有者がサードパーティ開発者を巻き込む主因は、アプリの多様性を増やすこと(resourcing)。外部開発でエコシステムの範囲と多様性が拡大し、ユーザーにとっての価値とネットワーク効果が高まる。","we":{"0":"法的責任の軽減が主たる動機ではない。エコシステムの多様性拡大が目的。","1":"ハードウェアコスト削減は主目的ではない。","2":"プラットフォーム更新の回避ではなく、むしろ機能拡張(多様性)が目的。"}},{"id":38,"conceptId":"cDF_transaction_platform","ch":"DF","type":"A","source":"PEB2 Mock Exam Q38","q":"[Mock Exam Q38] Which of the following best describes a \"transaction platform\"?","opts":["A) A platform that enables value-creating interactions between buyers and sellers.","B) A platform that allows users to co-innovate software applications.","C) A platform focused exclusively on social communication and content sharing.","D) A platform that provides only backend data integration without a user interface.","E) わからない"],"ans":0,"exp":"取引プラットフォーム(transaction platform; Schreieck et al.)は、買い手と売り手など複数の利用者群の間の価値創造的な相互作用・取引を仲介する(例: Uber, Amazon Marketplace, Airbnb)。マッチングと取引が中核機構。","we":{"1":"ソフトウェアの共創を可能にするのはイノベーション・プラットフォーム(iOS, Android等)であり、取引プラットフォームではない。","2":"社会的コミュニケーション・コンテンツ共有に特化するのはコミュニティ・プラットフォーム(Facebook等)。","3":"UIの無いバックエンドのデータ統合のみ、は取引プラットフォームの説明ではない。"}},{"id":39,"conceptId":"cDF_securing_resourcing","ch":"DF","type":"C","source":"PEB2 Mock Exam Q39","q":"[Mock Exam Q39] What is the main risk of focusing only on securing while neglecting resourcing for a platform owner?","opts":["A) Excessive competition.","B) Reduced third-party participation.","C) Regulatory penalties.","D) Increased hardware fragmentation.","E) わからない"],"ans":1,"exp":"Securing(統制強化)ばかりでResourcing(外部開発支援)を怠ると、開発者にとって魅力が下がり、サードパーティの参加が減る。境界資源モデルでは統制と貢献のバランスが重要で、統制過剰はエコシステムの活力を損なう。","we":{"0":"過度の競争は統制偏重の主たるリスクではない。むしろ参加の減少が問題。","2":"規制上の罰則はsecuring偏重の直接的帰結ではない。","3":"ハードウェアの断片化増大ではなく、サードパーティ参加の減少が主リスク。"}},{"id":40,"conceptId":"cDF_partial_integration","ch":"DF","type":"C","source":"PEB2 Mock Exam Q40","q":"[Mock Exam Q40] Which factor might lead a platform owner to choose a partial integration strategy (like collection or symbiosis) over a full integration strategy?","opts":["A) Desire to maximize complementarities in use for consumers.","B) Targeting a market with homogeneous user needs.","C) Operating in a highly regulated industry with data protection constraints.","D) Aiming to create a single, unified brand identity.","E) わからない"],"ans":2,"exp":"部分統合(collection/symbiosis; Schreieck et al.)は、プラットフォームを別個のまま連携させる戦略。データ保護規制が強い業界では、完全統合(UIレベルで一体化)が法的制約に触れうるため、データ・機能レベルで留める部分統合が選ばれやすい。","we":{"0":"利用上の補完性を最大化したいなら、補完性が最大の完全統合(assemblage)を選ぶ。部分統合の理由ではない。","1":"同質的なニーズの市場は単一プラットフォームで足り、部分統合を選ぶ特段の理由にならない。","3":"単一の統一ブランドを作りたいなら完全統合を選ぶ。部分統合は別個性を残す戦略。"}},{"id":101,"conceptId":"cDF_software_consequences","ch":"DF","type":"A","source":"PEB2 Textbook","q":"[L1] Which set of properties does the slide list as consequences of software businesses and markets?","opts":["A) Diminishing returns to scale and low switching costs","B) Rivalrous consumption and high marginal costs","C) Perfect competition and stable market shares","D) Network effects, great switching costs, non-rivalrous, winner-takes-all, no diminishing returns to scale","E) わからない"],"ans":3,"exp":"L1スライドはソフトウェア事業の帰結として、ネットワーク効果・大きなスイッチングコスト・非競合性(non-rivalrous)・勝者総取り(winner takes all)・規模に対する収穫逓減が無い、を挙げる。これらが伝統的市場と異なる動学を生む。","we":{"0":"収穫逓減や低スイッチングコストはむしろ伝統的財の特徴。ソフトは収穫逓減が無く高スイッチングコスト。","1":"非競合・低限界費用が特徴で、競合的消費・高限界費用は逆。","2":"勝者総取りで市場シェアは不安定。完全競争・安定シェアではない。"}},{"id":102,"conceptId":"cDF_three_transitions","ch":"DF","type":"A","source":"PEB2 Textbook","q":"[L1] Van Alstyne et al. describe three transitions in the new business logic. Which correctly states one of them?","opts":["A) From resource control to resource orchestration","B) From resource orchestration to resource control","C) From external interaction to internal optimization","D) From ecosystem value to individual customer value","E) わからない"],"ans":0,"exp":"3つの転換は (1)資源の「支配」から「オーケストレーション」へ、(2)内部最適化から外部相互作用へ、(3)顧客価値からエコシステム価値へ。パイプラインは資源支配、プラットフォームはネットワーク価値のオーケストレーションが核心。","we":{"1":"方向が逆。支配からオーケストレーションへ移る(その逆ではない)。","2":"方向が逆。内部最適化から外部相互作用へ移る。","3":"方向が逆。個別顧客価値からエコシステム価値へ移る。"}},{"id":103,"conceptId":"cDF_economies_scale_side","ch":"DF","type":"C","source":"PEB2 Textbook","q":"[L1] In the platform economy, economies of scale shift to which side compared to the traditional economy?","opts":["A) From the demand side to the supply side","B) From the supply side to the demand side","C) They disappear entirely","D) They remain purely on the supply side","E) わからない"],"ans":1,"exp":"伝統的経済では規模の経済は供給側(大きな固定費を大量生産で薄める)。プラットフォーム経済では需要側に移る=巨大なネットワーク価値で参加者を引き寄せる。限界費用はほぼゼロで、ネットワーク規模が価値を生む。","we":{"0":"方向が逆。需要側から供給側ではなく、供給側から需要側へ移る。","2":"規模の経済は消えず、需要側(ネットワーク効果)として現れる。","3":"供給側に留まるのではなく需要側へ移る。"}},{"id":104,"conceptId":"cDF_hub_firms_diff","ch":"DF","type":"A","source":"PEB2 Textbook","q":"[L1] According to Iansiti & Lakhani, how do hub firms differ from traditional firms?","opts":["A) They compete mainly on product features and cost","B) They avoid entering adjacent industries","C) They use network-based assets from one setting to enter and transform another market","D) They depend on physical bottlenecks rather than network control","E) わからない"],"ans":2,"exp":"ハブ企業は機能や費用で競争するのではなく、ある領域で築いたネットワークベースの資産を使って別市場に参入し、その市場を製品駆動からネットワーク駆動へ転換する。隣接産業を同一プラットフォームに取り込む。","we":{"0":"ハブ企業は機能・費用での競争ではなくネットワーク資産で競争する。","1":"むしろ積極的に隣接産業へ参入し取り込む。","3":"物理的ボトルネックではなくネットワーク支配(ボトルネック制御)が核心。"}},{"id":105,"conceptId":"cDF_boundary_resources","ch":"DF","type":"A","source":"PEB2 Textbook","q":"[L2] In Ghazawneh & Henfridsson’s boundary resources model, boundary resources are best described as:","opts":["A) Physical assets the platform owner sells to users","B) The internal source code kept secret from all developers","C) Government regulations imposed on the platform","D) Resources (e.g., SDKs, APIs, regulations) the owner provides to support third-party development","E) わからない"],"ans":3,"exp":"境界資源(boundary resources)は、プラットフォーム所有者が第三者開発を支援するために提供する資源(ソフトウェアツール、SDK、API、規約など)で、コアモジュールへの容易なアクセスを与える「接着剤」。統制(securing)と貢献(resourcing)のバランスを取る。","we":{"0":"境界資源は売却する物理資産ではなく、開発支援のためのツール・インターフェース群。","1":"秘匿されるソースコードではなく、開発者に公開・提供される資源。","2":"政府が課す規制ではなく、所有者が自ら提供する資源。"}},{"id":106,"conceptId":"cDF_securing_def","ch":"DF","type":"A","source":"PEB2 Textbook","q":"[L2] How is \"securing\" defined as a platform owner strategy?","opts":["A) The process by which the control of a platform and its related services is increased","B) The process by which the scope and diversity of a platform is enhanced","C) Subsidizing one side of the market to start network effects","D) Merging two platforms into a single interface","E) わからない"],"ans":0,"exp":"Securingは、プラットフォームとその関連サービスに対する所有者の「統制を高める」過程。開発者契約の変更やライセンスモデル等で、プラットフォームを侵害しうるアプリ開発を抑える。統制度は自動車(厳格)からOSSコミュニティ(緩い)まで連続的。","we":{"1":"これはresourcing(範囲と多様性の拡大)の定義であり、securingではない。","2":"片側補助はプラットフォーム立ち上げ戦略で、securingの定義ではない。","3":"2プラットフォームの統合はSchreieckの統合戦略の話で、securingとは別。"}},{"id":107,"conceptId":"cDF_platform_types","ch":"DF","type":"A","source":"PEB2 Textbook","q":"[L2] Schreieck et al. distinguish three types of digital platforms. Which trio is correct?","opts":["A) Pipeline, hub, and keystone platforms","B) Transaction, innovation, and community platforms","C) Supply, demand, and hybrid platforms","D) Public, private, and government platforms","E) わからない"],"ans":1,"exp":"Schreieck et al.は3類型を区別: 取引(transaction: Uber, Amazon)、イノベーション(innovation: iOS, Android)、コミュニティ(community: Facebook, Reddit)。各々価値創造機構とネットワーク効果の型が異なる。","we":{"0":"pipeline/hub/keystoneは別概念(Iansiti等)で、Schreieckの3類型ではない。","2":"supply/demand/hybridという分類ではない。","3":"public/private/governmentという分類でもない。"}},{"id":108,"conceptId":"cDF_innovation_platform","ch":"DF","type":"A","source":"PEB2 Predicted","q":"[L2] Which is an example of an innovation platform in Schreieck et al.’s typology?","opts":["A) Airbnb","B) Reddit","C) iOS / Android","D) Amazon Marketplace","E) わからない"],"ans":2,"exp":"イノベーション・プラットフォームは拡張可能なソフト基盤を提供し、補完者(開発者)が革新を生む。iOSやAndroidが典型例。開発者とユーザーの間に間接ネットワーク効果が働く。","we":{"0":"Airbnbは買い手と売り手をマッチングする取引プラットフォーム。","1":"Redditはコミュニティ・プラットフォーム。","3":"Amazon Marketplaceは取引プラットフォーム。"}},{"id":109,"conceptId":"cDF_four_integration","ch":"DF","type":"C","source":"PEB2 Textbook","q":"[L2] In Schreieck et al.’s multi-platform integration matrix, which strategy yields the most complementarities and brings superapps?","opts":["A) Collection (partial, same type)","B) Consolidation (full, same type)","C) Symbiosis (partial, different types)","D) Assemblage (full, different types)","E) わからない"],"ans":3,"exp":"4戦略のうちAssemblage(完全統合×異種プラットフォーム)が最大の補完性を生み、スーパーアプリ(WeChat, Grab等)をもたらす。異なる型を一体化し、プラットフォーム内・間でネットワーク効果が働く。","we":{"0":"Collectionは同種の部分統合で、補完性は最大ではない。","1":"Consolidationは同種の完全統合(例: Amazon Prime Video統合)で、異種統合のAssemblageほどの補完性は生まない。","2":"Symbiosisは異種の部分統合(SAP Cloud等)で、完全統合のAssemblageより補完性は小さい。"}},{"id":110,"conceptId":"cDF_partial_full","ch":"DF","type":"A","source":"PEB2 Textbook","q":"[L2] What distinguishes full integration from partial integration of platforms?","opts":["A) In full integration platforms are merged at the user-interface level and are no longer distinguishable; in partial they stay distinguishable","B) In full integration platforms remain distinguishable to users; in partial they are merged at the UI level","C) Partial integration always creates superapps","D) Full integration only connects platforms at the data level","E) わからない"],"ans":0,"exp":"完全統合(full)はUIレベルで一体化し、ユーザーから区別できなくなる(例: Grab, WeChat superapp)。部分統合(partial)はデータ・機能レベルで連携するがプラットフォームは別個のまま区別できる(例: Facebook+WhatsApp)。","we":{"1":"逆。完全統合では区別できなくなり、部分統合では区別できる。","2":"スーパーアプリを生むのは完全統合(assemblage)であり、部分統合が常に生むわけではない。","3":"データレベルのみで連携するのは部分統合の特徴。完全統合はUIレベルで一体化。"}},{"id":111,"conceptId":"cDF_tirole_dma","ch":"DF","type":"A","source":"PEB2 Textbook","q":"[L2] According to Tirole, the EU’s Digital Markets Act (DMA) is best characterized as:","opts":["A) An ex post, case-by-case approach based on consumer welfare","B) Ex ante regulation to keep digital markets fair and contestable, setting do’s and don’ts for gatekeepers","C) A breakup mandate for all large tech firms","D) A tax on digital advertising revenue","E) わからない"],"ans":1,"exp":"DMAは事前(ex ante)規制で、デジタル市場を公正かつ競争可能(contestable)に保つ。中核プラットフォームサービス(CPS)を持つゲートキーパーに6つの「すべきこと/してはならないこと」を課し、執行機関を置く。従来のEUの事後・個別審査(Google Shopping事件等)の遅さへの対応。","we":{"0":"事後・個別審査(consumer welfare基準)はDMA以前の従来手法。DMAは事前規制。","2":"","3":"DMAは全大手の分割命令ではない。義務付けと禁止行為の枠組み。"}},{"id":112,"conceptId":"cDF_tirole_alternatives","ch":"DF","type":"C","source":"PEB2 Textbook","q":"[L2] Tirole notes breaking up tech firms is difficult. Which is a reason he gives?","opts":["A) There is always a stable essential facility easy to separate","B) Tech firms have no fixed costs","C) Break-ups may destroy network externalities or lose the data advantage","D) Breakups always lower consumer prices","E) わからない"],"ans":2,"exp":"Tiroleは技術企業の分割が難しい理由として、安定的なessential facilityが存在しないこと、分割がネットワーク外部性を破壊しうること、データ優位を失う/分割自体が不可能なこと等を挙げる。Bell分割やStandard Oilのようにはいかない。","we":{"0":"むしろ安定的なessential facilityが「無い」ことが分割を難しくする。記述が逆。","1":"","3":"分割が必ず消費者価格を下げるとは限らず、Tiroleの論点でもない。"}},{"id":113,"conceptId":"cDF_industrial_era","ch":"DF","type":"A","source":"PEB2 Textbook","q":"[L1] Birkinshaw lists changes in the industrial era. Which is an example of a change in \"institutional structures\"?","opts":["A) Scaling up of firms from 300 to 300,000 employees","B) Shift from informal to formalized structures and bureaucracy","C) Start of employees and careers","D) Creation of the limited liability company and intellectual property rights / patents","E) わからない"],"ans":3,"exp":"Birkinshawの産業時代の変化のうち「制度的構造(institutional structures)」は、有限責任会社の創設や知的財産権・特許の整備を指す。Aは企業規模/範囲、Bは企業構造/組織、Dは付随的変化。","we":{"0":"企業規模の拡大は\"firm size and scope\"の変化であり、制度的構造ではない。","1":"非公式から公式・官僚制化は\"firm structure and organization\"の変化。","2":"被雇用者やキャリアの登場は付随的変化で、制度的構造の主例ではない。"}},{"id":114,"conceptId":"cDF_competition_policy","ch":"DF","type":"E","source":"PEB2 Textbook","q":"[L1] Birkinshaw notes that traditional competition policy measured monopoly via increased consumer prices. Why is this problematic for big digital firms?","opts":["A) Big digital firms often offer very low (or zero) prices, so the price indicator fails to detect monopoly","B) Big digital firms always charge very high prices","C) Consumer prices are irrelevant to all markets","D) Digital firms never reach monopoly positions","E) わからない"],"ans":0,"exp":"従来は独占の指標を「消費者価格の上昇」としたが、大手デジタル企業はしばしば極めて低価格(またはゼロ価格)を提供するため、価格指標では独占を検出できない。独占の測り方の再考が必要になる。","we":{"1":"大手デジタル企業はむしろ低価格を提供するため、高価格を常に課すという前提が誤り。","2":"消費者価格が全市場で無関係なのではなく、デジタル市場で指標として機能しにくいだけ。","3":"デジタル企業は実際に独占的地位に達しうる。"}},{"id":115,"conceptId":"cDF_pipeline_vs_platform","ch":"DF","type":"A","source":"PEB2 Predicted","q":"[L1] Which statement best contrasts pipelines and platforms?","opts":["A) Pipelines facilitate interactions between external producers and consumers; platforms optimize a linear chain","B) Pipelines optimize a linear production chain; platforms create value by facilitating interactions between external producers and consumers","C) Both pipelines and platforms must own the physical infrastructure","D) Platforms focus on internal optimization while pipelines focus on ecosystem value","E) わからない"],"ans":1,"exp":"パイプラインは線形の生産チェーンを最適化して価値を生む。プラットフォームは外部の生産者と消費者の相互作用を仲介して価値を生む。プラットフォームは物理インフラを所有せずネットワーク効果を活用する点が新しい。","we":{"0":"役割が逆に記述されている。相互作用の仲介はプラットフォーム側。","2":"プラットフォームは物理インフラを所有しなくてよいのが新しさ。両者所有は誤り。","3":"内部最適化はパイプライン、エコシステム価値はプラットフォーム。逆。"}},{"id":116,"conceptId":"cDF_data_issues","ch":"DF","type":"C","source":"PEB2 Textbook","q":"[L2] Among Tirole’s alternatives for the \"data issue\", which describes data licensing?","opts":["A) Collecting no data at all, which may reduce service quality","B) Paying users via micropayments that may be stolen by bots","C) A licensing system where data owners are remunerated, like patents, but very hard to implement","D) Customer-centric data trusts with no operational issues","E) わからない"],"ans":2,"exp":"データ・ライセンシングは、特許のようにデータ所有者に報酬を払うライセンス制度。ただし実装が非常に難しいとTiroleは指摘する。他の代替: 無収集(質低下)、マイクロペイメント(ボットによる搾取リスク)、データ信託(運用課題)。","we":{"0":"これはデータ無収集の代替案であり、ライセンシングではない。","1":"これはマイクロペイメントの説明。","3":"データ信託にも運用課題があるとされ、「課題なし」は誤り。"}},{"id":117,"conceptId":"cDF_exam_scope","ch":"DF","type":"A","source":"PEB2 Textbook","q":"[L2] The DF exam scope (per the lecture) consists of:","opts":["A) 10 questions, based only on the Tirole article","B) 40 questions on the digital firm alone","C) Only the recommendations in Tirole section 2.4.2 and 4.2","D) 10 questions, based on 6 articles and 2 slide decks","E) わからない"],"ans":3,"exp":"デジタル経済(DF)の試験範囲は、6本の論文+2つのスライドデック(L1, L2)に基づく10問。なお、Tiroleの本質インフラに関する2.4.2と国際貿易の4.2は試験範囲外と明示される。","we":{"0":"Tirole論文のみではなく6論文+2スライド。","1":"40問全体ではなくDFは10問。40問は4分野合計。","2":"2.4.2と4.2はむしろ試験範囲「外」。"}},{"id":118,"conceptId":"cDF_network_effects","ch":"DF","type":"A","source":"PEB2 Predicted","q":"[L1] Why are ecosystems more important in digital markets than standalone products?","opts":["A) Because of network effects and switching costs that make the surrounding ecosystem decisive","B) Because physical assets always dominate value creation","C) Because governments mandate ecosystem participation","D) Because marginal costs rise sharply with scale","E) わからない"],"ans":0,"exp":"デジタル市場ではネットワーク効果とスイッチングコストにより、単体製品ではなく周囲のエコシステム(第三者の補完)が決定的になる。モバイル・エコシステムが第三者効果を示す例。","we":{"1":"デジタル市場では物理資産ではなくネットワーク/エコシステムが価値の中心。","2":"政府の義務付けではなく、ネットワーク効果という経済的機構が理由。","3":"デジタル財はむしろ限界費用がほぼゼロで収穫逓減が無い。"}},{"id":119,"conceptId":"cDF_resourcing_def","ch":"DF","type":"A","source":"PEB2 Textbook","q":"[L2] \"Resourcing\" as a platform-owner strategy is defined as the process by which:","opts":["A) the control of a platform is increased","B) the scope and diversity of a platform is enhanced through third-party applications","C) two different platforms are fully merged","D) a platform sets a fixed regulated price","E) わからない"],"ans":1,"exp":"Resourcingは、第三者によるアプリ追加を通じてプラットフォームの範囲と多様性を高める過程。エコシステムのアクターを広げ、新たな資源・知識・能力を取り込む。Securing(統制強化)と対をなす。","we":{"0":"これはsecuring(統制強化)の定義。","2":"2プラットフォームの完全統合はSchreieckの統合戦略で、resourcingではない。","3":"規制価格の設定はTiroleのpublic utility regulationの話。"}},{"id":120,"conceptId":"cDF_gatekeeper_cps","ch":"DF","type":"A","source":"PEB2 Predicted","q":"[L2] Under the DMA, \"gatekeepers\" are firms that possess:","opts":["A) Only physical retail stores","B) Government licenses to operate utilities","C) Core Platform Services (CPS) such as social media, search engines, messaging services","D) No significant market position","E) わからない"],"ans":2,"exp":"DMAのゲートキーパーは、中核プラットフォームサービス(CPS: SNS、検索エンジン、メッセージングサービス等)を保有する企業。DMAは彼らに6つの義務と6つの禁止、相互運用性(Article 7)等を課す。","we":{"0":"物理小売店のみを指すのではなく、デジタルのCPSを持つ大手。","1":"公益事業の政府ライセンスではない。","3":"むしろ重要な市場地位を持つ企業がゲートキーパー指定される。"}},{"id":201,"conceptId":"cTAX_definition","ch":"TAX","type":"A","source":"PEB2 Textbook","q":"[L3] Which best matches the lecture’s definition of taxation?","opts":["A) A voluntary donation to a charity chosen by the taxpayer","B) A market price paid for a private good","C) A fee paid only by companies for using public roads","D) A compulsory financial charge imposed on a taxpayer by a governmental organization to fund public expenditures","E) わからない"],"ans":3,"exp":"課税(taxation)は、公共支出を賄うために、政府組織が納税者に課す強制的な金銭的負担と定義される。任意の寄付や市場価格とは異なる。","we":{"0":"課税は任意の寄付ではなく強制的な負担。","1":"私的財への市場価格ではない。政府が課す強制負担。","2":"企業のみの道路使用料ではなく、広く納税者に課される。"}},{"id":202,"conceptId":"cTAX_purposes","ch":"TAX","type":"A","source":"PEB2 Textbook","q":"[L3] Which is a \"policy purpose\" of taxation (as opposed to a budgetary purpose)?","opts":["A) Influencing behavior and redistributing income","B) Financing law and order, healthcare, and infrastructure","C) Paying civil servants’ salaries directly","D) Recording the national accounts","E) わからない"],"ans":0,"exp":"課税の目的は予算目的(公共支出の財源確保)と政策目的に分かれる。政策目的は行動への影響(誘導)や所得再分配、総厚生の増大など。法と秩序・医療・インフラの財源確保は予算目的。","we":{"1":"公共支出の財源確保は予算目的(budgetary purpose)であり政策目的ではない。","2":"","3":"国民経済計算の記録は課税の目的ではない。"}},{"id":203,"conceptId":"cTAX_residence_source","ch":"TAX","type":"A","source":"PEB2 Textbook","q":"[L3] What is the difference between residence and source jurisdiction?","opts":["A) Residence taxes non-residents on local activity; source taxes residents on worldwide income","B) Residence taxes a resident’s (often worldwide) income; source taxes a non-resident’s activity within the country","C) Both tax only foreign companies","D) Both refer to the place where a company is listed on a stock exchange","E) わからない"],"ans":1,"exp":"居住地管轄(residence jurisdiction)は、A国の居住者がどこで活動しても課税(例: 世界所得課税)。源泉地管轄(source jurisdiction)は、非居住者がA国内で行う活動に課税(例: 非居住者の不動産取得への不動産取得税)。","we":{"0":"説明が逆。居住地は居住者の世界所得、源泉地は非居住者の国内活動。","2":"両方とも外国企業のみを課税するわけではない。","3":"上場場所ではなく、居住/活動の場所に基づく課税概念。"}},{"id":204,"conceptId":"cTAX_CIN_def","ch":"TAX","type":"A","source":"PEB2 Textbook","q":"[L3] Capital Import Neutrality (CIN) means:","opts":["A) A resident is taxed equally whether investing at home or abroad","B) Capital is always exported to low-tax countries","C) Domestic and foreign investors are taxed equally for inbound investments in a country","D) Investors pay no tax on foreign income","E) わからない"],"ans":2,"exp":"資本輸入中立性(CIN)は、ある国への対内投資について国内投資家と外国投資家が同等に課税されること。方法は両者に同率を適用。CINが欠けると資本が国外へ移転される。","we":{"0":"これは資本輸出中立性(CEN)の説明。居住者が国内外で同等課税。","1":"低税国への資本輸出はCINの定義ではない。","3":"外国所得が非課税というのはCINの定義ではない。"}},{"id":205,"conceptId":"cTAX_relief_methods","ch":"TAX","type":"A","source":"PEB2 Textbook","q":"[L3] Which is listed as a method of relief from double taxation?","opts":["A) Profit-shifting method","B) Transfer pricing method","C) Race-to-the-bottom method","D) Tax credit method and exemption method","E) わからない"],"ans":3,"exp":"二重課税の救済方法として、税額控除方式(tax credit)、免税方式(exemption)、比例課税方式(proportional)、割当方式(allocation)が挙げられる。税額控除はCEN寄り、免税はCIN寄り。","we":{"0":"利益移転(profit shifting)は租税回避の手法であり、二重課税の救済方法ではない。","1":"","2":"race to the bottomは税競争の話で、救済方法ではない。"}},{"id":206,"conceptId":"cTAX_evasion_avoidance","ch":"TAX","type":"A","source":"PEB2 Textbook","q":"[L3] What is the key difference between tax evasion and tax avoidance?","opts":["A) Evasion is illegal; avoidance is within the law (though it can be seen as aggressive)","B) Evasion is within the law; avoidance is illegal","C) Both are always illegal","D) Both are always fully legal and never criticized","E) わからない"],"ans":0,"exp":"脱税(tax evasion)は違法。租税回避(tax avoidance)は法の枠内(合法)だが、「攻撃的(aggressive)」と受け取られ評判リスクを伴いうる。法の文言は満たすが精神を回避するグレーゾーン。","we":{"1":"逆。脱税が違法、回避が合法。","2":"回避は合法なので「両方常に違法」は誤り。","3":"回避は合法だが攻撃的と批判されうるため「決して批判されない」は誤り。"}},{"id":207,"conceptId":"cTAX_profit_shifting","ch":"TAX","type":"C","source":"PEB2 Textbook","q":"[L3] How does profit shifting reduce a multinational’s tax?","opts":["A) By increasing profits booked in high-tax jurisdictions","B) By increasing profits booked in low-tax jurisdictions and reducing payments in high-tax ones, via intercompany transactions","C) By paying all tax in the country of the parent company","D) By raising the arm’s length price above fair market value","E) わからない"],"ans":1,"exp":"利益移転は、グループ内取引を通じて低税国に計上する利益を増やし、高税国での納税を減らす。移転価格の濫用(債務移転、IP移転、ロイヤルティ等)で行われる。","we":{"0":"逆。高税国の利益を増やすのではなく低税国に移す。","2":"親会社国で全額納税するのは利益移転の目的に反する。","3":"独立企業間価格を市場価値超に上げることは利益移転の機構ではない(むしろ歪曲して低税国に利益を寄せる)。"}},{"id":208,"conceptId":"cTAX_arms_length","ch":"TAX","type":"A","source":"PEB2 Textbook","q":"[L3] The arm’s length principle in transfer pricing requires that:","opts":["A) related companies always transact at zero price","B) unrelated companies must use intercompany prices","C) related companies transact as if they were unrelated, at fair market value","D) intangibles are never priced","E) わからない"],"ans":2,"exp":"独立企業間原則(arm’s length)は、関連会社間の取引を、無関係な独立企業同士であるかのように公正市場価格で行うことを求める。理想は比較可能独立価格。無形資産は比較が難しく濫用の温床。","we":{"0":"ゼロ価格での取引ではなく、公正市場価格での取引を求める。","1":"無関係な企業はそもそも市場価格で取引する。原則が規律するのは関連会社。","3":"無形資産も評価が必要(困難だが)。価格付けしないわけではない。"}},{"id":209,"conceptId":"cTAX_dst","ch":"TAX","type":"A","source":"PEB2 Textbook","q":"[L4] In 2019, which country announced a Digital Services Tax (DST) of 3%, prompting the US to threaten 25% tariffs on its wine?","opts":["A) Germany","B) The Netherlands","C) Japan","D) France","E) わからない"],"ans":3,"exp":"2019年、フランスが3%のデジタルサービス税(DST: 広告サービス、デジタルインターフェース、ユーザーデータ販売に課税)を発表し、米国はフランス産ワインへ25%の輸入関税を予告した。国際協調の欠如を示す例。","we":{"0":"DSTを2019年に発表しワイン関税問題を招いたのはドイツではない。","1":"オランダではない。","2":"日本ではない。フランス。"}},{"id":210,"conceptId":"cTAX_benefit_ability","ch":"TAX","type":"A","source":"PEB2 Textbook","q":"[L4] Which pairing of taxation principles and their justification is correct?","opts":["A) Benefit principle justifies source taxation; ability-to-pay justifies residence taxation","B) Benefit principle justifies residence taxation; ability-to-pay justifies source taxation","C) Both principles justify only source taxation","D) Neither principle relates to international taxation","E) わからない"],"ans":0,"exp":"受益者原則(benefit principle: 納税者は政府サービスから便益を得る)は源泉地課税を正当化する。応能原則(ability-to-pay: 所得に応じて納税、垂直的公平)は居住地課税を正当化する。価値創造は受益者原則と整合的。","we":{"1":"対応が逆。受益者原則は源泉地、応能原則は居住地を正当化する。","2":"両原則が源泉地のみを正当化するのではない。","3":"両原則とも国際課税の正当化に関わる。"}},{"id":211,"conceptId":"cTAX_pe_outdated","ch":"TAX","type":"C","source":"PEB2 Textbook","q":"[L4] Why is the concept of permanent establishment (PE) considered outdated for the digital economy?","opts":["A) Because digital firms always have large physical offices","B) Because PE taxes only when there is physical presence, but digital firms can operate without physical presence","C) Because PE applies only to the sharing economy","D) Because digital firms never earn profits","E) わからない"],"ans":1,"exp":"PEは物理的存在(固定的な事業の場所)がある場合にのみ課税する仕組みだが、デジタル企業は物理的存在なしに事業を行えるため、源泉地国が課税できず、PE概念が時代遅れとされる。課税権の配分が課題。","we":{"0":"デジタル企業はむしろ物理的事務所を要さないのが問題の核心。","2":"PEはシェアリングエコノミーに限らず一般に適用される概念。","3":"デジタル企業も利益を上げる。利益の有無が論点ではない。"}},{"id":212,"conceptId":"cTAX_sharing_transactions","ch":"TAX","type":"A","source":"PEB2 Textbook","q":"[L4] Which is listed as a type of transaction in the sharing economy?","opts":["A) Corporate dividend distributions","B) Government bond issuance","C) Cash transactions, barter arrangements, cost-sharing, and gifts/donations","D) Stock buybacks","E) わからない"],"ans":2,"exp":"シェアリングエコノミーの取引類型として、現金取引・物々交換(barter)・コストシェアリング・贈与/寄付が挙げられる。これらは把握・課税が難しい。","we":{"0":"配当分配はシェアリングエコノミーの取引類型ではない。","1":"国債発行は無関係。","3":"自社株買いは無関係。"}},{"id":213,"conceptId":"cTAX_global_schedular","ch":"TAX","type":"A","source":"PEB2 Predicted","q":"[L4] A challenge in taxing the sharing economy is including its transactions in income tax systems. Which systems are contrasted?","opts":["A) Progressive vs. regressive systems only","B) Sales tax vs. property tax","C) Tariff system vs. excise system","D) Global tax system vs. schedular tax system (with hybrid models in between)","E) わからない"],"ans":3,"exp":"所得税制は、すべての所得を合算して課す総合課税(global)と、所得源泉ごとに分けて課す分類課税(schedular)、その中間のハイブリッド型に分かれる。シェアリング取引をどう取り込むかが難しく、解決策はプラットフォーム報告(platform reporting)。","we":{"0":"累進対逆進という対比ではなく、総合対分類の対比。","1":"売上税対財産税ではない。","2":"関税対物品税ではない。"}},{"id":214,"conceptId":"cTAX_double_tax_treaties","ch":"TAX","type":"A","source":"PEB2 Textbook","q":"[L3] What is the purpose of double tax treaties?","opts":["A) To remove double taxation and prevent tax avoidance/evasion (often based on the OECD model)","B) To increase double taxation between two countries","C) To set a single global tax rate enforced by the UN","D) To eliminate all corporate income tax","E) わからない"],"ans":0,"exp":"二重課税条約(double tax treaty)は二国間の協定で、(1)二重課税の除去、(2)租税回避・脱税の防止を目的とする。OECDモデル条約が広く用いられる。","we":{"1":"目的は二重課税の「除去」であり増加ではない。","2":"国連が強制する単一世界税率を設けるものではない。","3":"法人税を全廃するものではない。"}},{"id":215,"conceptId":"cTAX_uber_structure","ch":"TAX","type":"E","source":"PEB2 Textbook","q":"[L3] In the Uber tax case discussed, which mechanism illustrates intra-group profit shifting?","opts":["A) A public utility price cap set by the Dutch government","B) An intercompany loan (€16bn at 8% interest) and royalty/IP arrangements across jurisdictions","C) A direct donation of profits to charity","D) A breakup of Uber into national companies","E) わからない"],"ans":1,"exp":"Uberの法的構造では、グループ内貸付(€16bn・8%利息)やロイヤルティ/IPの配置を法域横断で用い、利益移転(高税国の利益を圧縮)を図る例として示される。シンガポール、オランダ、バミューダ等を経由。","we":{"0":"オランダ政府の公益価格上限は無関係(Tiroleのpublic utility regulationの一般論)。","2":"","3":"国別会社への分割はUberの構造の説明ではない。"}},{"id":216,"conceptId":"cTAX_intangibles","ch":"TAX","type":"C","source":"PEB2 Textbook","q":"[L4] Why do intangible assets pose a special challenge for taxing the digital economy?","opts":["A) They are easy to value and locate physically","B) They are always taxed at source automatically","C) Valuation and transfer pricing of IP, data, and algorithms are difficult, enabling profit shifting","D) They cannot be owned by companies","E) わからない"],"ans":2,"exp":"知的財産・データ・アルゴリズム等の無形資産は、評価と移転価格の算定が難しく、低税国への移転(利益移転)を容易にする。比較可能価格が得にくいため濫用されやすい。","we":{"0":"無形資産はむしろ評価も所在特定も困難。","1":"自動的に源泉地課税されるわけではない。所在が曖昧。","3":"無形資産も企業が所有できる。"}},{"id":217,"conceptId":"cTAX_race_bottom","ch":"TAX","type":"C","source":"PEB2 Predicted","q":"[L3] What does the \"race to the bottom\" refer to in international taxation?","opts":["A) Countries raising tax rates together to maximize revenue","B) A treaty that fixes a minimum global wage","C) The decline of consumer prices on digital platforms","D) Tax competition where countries reduce tax rates to attract companies and investment","E) わからない"],"ans":3,"exp":"「底辺への競争(race to the bottom)」は、企業と投資を誘致するため各国が法人税率を引き下げ合う税競争。各国の税率が下がり続け、その有効性が問われる。","we":{"0":"税率を協調して引き上げるのではなく、引き下げ合う競争。","1":"最低賃金を固定する条約ではない。","2":"プラットフォーム上の消費者価格低下とは無関係。"}},{"id":218,"conceptId":"cTAX_corporate_income_tax","ch":"TAX","type":"A","source":"PEB2 Textbook","q":"[L3] For corporate income tax, what is the \"tax object\" (what is being taxed)?","opts":["A) Profits (earnings minus costs)","B) The companies themselves (the taxable subject)","C) The number of shareholders","D) The market value of listed shares","E) わからない"],"ans":0,"exp":"法人税では、課税主体(taxable subject)は企業、課税対象(tax object)は利益(profit=収益−費用)。利益を減らす(収益を減らす/費用を増やす)ことで税を圧縮しようとする誘因が生じる。","we":{"1":"企業は課税「主体」であって課税「対象」ではない。対象は利益。","2":"株主数は課税対象ではない。","3":"上場株式の時価は課税対象ではない。"}},{"id":219,"conceptId":"cTAX_sharing_approaches","ch":"TAX","type":"A","source":"PEB2 Predicted","q":"[L4] Which correctly matches a country to its approach to taxing the sharing economy (per the slides)?","opts":["A) Australia exempts all sharing transactions from tax","B) Australia treats all sharing transactions as taxable","C) The UK taxes the first GBP 2,000–7,500 at the highest rate","D) Belgium prohibits any platform reporting","E) わからない"],"ans":1,"exp":"各国アプローチ: オーストラリアは全シェアリング取引を課税対象とする。英国は最初のGBP 2,000〜7,500を免税。ベルギーはプラットフォームに報告を求める。","we":{"0":"オーストラリアは免税ではなく全取引を課税対象とする。","2":"","3":"英国は当初分を免税にするのであって最高税率課税ではない。"}},{"id":220,"conceptId":"cTAX_intl_objectives","ch":"TAX","type":"A","source":"PEB2 Predicted","q":"[L3] Which is one of the objectives of international tax rules listed in the lecture?","opts":["A) Maximizing double taxation","B) Eliminating all cross-border investment","C) Economic efficiency (alongside fairness, national wealth maximization, administrative efficiency, international compatibility)","D) Guaranteeing equal tax rates worldwide","E) わからない"],"ans":2,"exp":"国際課税ルールの目的は、(1)国家の富の最大化、(2)税の公平、(3)経済的効率、(4)行政的効率、(5)国際的整合性。課税は投資判断を歪めるため、効率性の確保が重要。","we":{"0":"二重課税の最大化は目的ではなく、むしろ除去が目的。","1":"","3":"越境投資の排除は目的ではない。"}},{"id":301,"conceptId":"cMLM_market_society","ch":"MLM","type":"A","source":"PEB2 Textbook","q":"[L5] The lecture frames a shift from a \"market economy\" to a \"market society\". What does this distinction highlight?","opts":["A) That markets only ever allocate ordinary goods efficiently","B) That societies should abolish all markets","C) That market economies always reduce inequality","D) That market values increasingly govern domains of life where they may corrupt essential values","E) わからない"],"ans":3,"exp":"「市場経済」から「市場社会」への移行とは、市場の論理が生活の様々な領域(命・身体・公共財など)にまで広がり、そこで本質的価値を腐敗させうるという問題提起。市場が適切な領域と不適切な領域があるという論点。","we":{"0":"論点は通常財の効率配分ではなく、市場が不適切な領域に広がる懸念。","1":"全市場の廃止を主張するものではない。","2":"市場社会化が不平等を必ず減らすという主張ではない。"}},{"id":302,"conceptId":"cMLM_arguments_for","ch":"MLM","type":"A","source":"PEB2 Textbook","q":"[L5] Which pair correctly states the two \"arguments for\" allowing markets?","opts":["A) Libertarian (freedom to buy/sell without violating rights) and Utilitarian (exchange benefits both, raising social utility)","B) Fairness and value corruption","C) Paternalism and meddlesome preferences","D) Diffusion of responsibility and social norm formation","E) わからない"],"ans":0,"exp":"市場を認める論拠は、(1)リバタリアン: 他者の権利を侵さない限り売買は自由、(2)功利主義: 市場交換は買い手・売り手双方を益し社会的効用(集合的厚生)を高める。対する反論は公平性と価値の腐敗。","we":{"1":"公平性と価値腐敗は市場に「反対」する論拠。","2":"パターナリズムや干渉的選好はCowen&Tabarrokの反論側の論点。","3":"責任分散・社会規範形成はFalk&Szechの市場が道徳を侵食する機構の説明。"}},{"id":303,"conceptId":"cMLM_arguments_against","ch":"MLM","type":"A","source":"PEB2 Textbook","q":"[L5] The \"value corruption\" argument against markets claims that:","opts":["A) Markets always raise prices unfairly","B) Employing a free market in some cases corrupts essential values (e.g., equal quality of security)","C) Markets benefit buyers and sellers alike","D) People are free to buy and sell as long as no rights are violated","E) わからない"],"ans":1,"exp":"価値の腐敗(value corruption)論は、ある領域に自由市場を導入すると、本質的な価値(例: 安全の平等な質)が腐敗しうると主張する。市場が不適切な領域では、金銭化がその財の意味を損なう。","we":{"0":"価値腐敗論は価格上昇そのものの主張ではない。","2":"双方に益するは功利主義の「賛成」論。","3":"権利不侵害なら自由はリバタリアンの「賛成」論。"}},{"id":304,"conceptId":"cMLM_falkszech_mechanisms","ch":"MLM","type":"C","source":"PEB2 Textbook","q":"[L5] Falk & Szech conclude markets eroded the value of (a mouse’s) life. Which is one mechanism they give?","opts":["A) Increased individual accountability","B) Stronger intrinsic moral values under trade","C) Diffusion of responsibility (multiple people responsible when trading)","D) Reduced materialistic framing","E) わからない"],"ans":2,"exp":"Falk & Szechが挙げる市場が道徳を侵食する機構は、(1)責任の分散(取引では複数人が結果に責任を負う)、(2)社会規範の形成(市場で規範ができる)、(3)物質主義的フレーミング(最良の取引を求める)。","we":{"0":"市場では個人の責任が「分散」する。説明責任が増すのは逆。","1":"","3":"市場はむしろ物質主義的フレーミングを「強める」。減らすのではない。"}},{"id":305,"conceptId":"cMLM_falkszech_numbers","ch":"MLM","type":"D","source":"PEB2 Textbook","q":"[L5] In Falk & Szech, the share willing to kill the mouse for ≤€10 rose across treatments. Which ordering matches the study?","opts":["A) Multilateral > Individual > Bilateral","B) Individual > Bilateral > Multilateral","C) All three treatments were equal","D) Individual (≈46%) < Bilateral (≈72%) < Multilateral (≈76%)","E) わからない"],"ans":3,"exp":"Falk & Szechの結果は、個人判断 約45.9% < 双方向市場 約72.2% < 多者間市場 約75.9% と、市場的相互作用が増すほどマウスを殺す意思が高まった。市場が道徳価値を侵食する証拠。","we":{"0":"順序が誤り。個人が最低で多者間が最高。","1":"","2":"順序が逆。個人が最も低い。"}},{"id":306,"conceptId":"cMLM_crowding_out","ch":"MLM","type":"E","source":"PEB2 Textbook","q":"[L5] In Gneezy & Rustichini’s daycare study, what happened after a fine for late pick-ups was introduced?","opts":["A) The number of late parents increased (the fine crowded out moral motivation)","B) The number of late parents decreased sharply","C) Parents stopped using daycare entirely","D) The fine had no measurable effect","E) わからない"],"ans":0,"exp":"Gneezy & Rustichini(2000)では、遅刻への罰金導入後、遅刻する親が「増えた」。罰金が道徳的動機を締め出し(crowding out)、遅刻を金で買える行為に変えてしまったため。価格設定が動機を変質させる例。","we":{"1":"遅刻は減らず、むしろ増えた。","2":"保育所利用をやめたわけではない。","3":"罰金は遅刻増という明確な効果を持った。"}},{"id":307,"conceptId":"cMLM_willful_ignorance","ch":"MLM","type":"A","source":"PEB2 Textbook","q":"[L6] \"Willful ignorance\" in the moral-markets context refers to:","opts":["A) Forgetting information by accident","B) Avoiding information about the negative externalities of self-serving decisions","C) Sharing all information transparently","D) Always acting altruistically regardless of cost","E) わからない"],"ans":1,"exp":"意図的無知(willful ignorance)は、自己利益的な決定の負の外部性に関する情報を「意図的に避ける」こと。メタ分析(Vu et al. 2023)では40%が情報を避け、利他性が16%低下した。","we":{"0":"偶発的な忘却ではなく、意図的に情報を避ける行為。","2":"情報を透明に共有するのは逆。","3":"常に利他的に行動するのとは逆の概念。"}},{"id":308,"conceptId":"cMLM_six_objections","ch":"MLM","type":"A","source":"PEB2 Textbook","q":"[L6] Cowen & Tabarrok list six objections to standard economic reasoning in moral domains. Which is one of them?","opts":["A) The benefit principle of taxation","B) The boundary resources model","C) The problem of exploitation","D) Capital export neutrality","E) わからない"],"ans":2,"exp":"Cowen & Tabarrokの6つの反論は、(1)搾取の問題、(2)干渉的選好、(3)公平・平等な扱い、(4)文化財とパターナリズム、(5)貧困・不平等・所得分配、(6)誰を数えるか。搾取の問題はその一つ。","we":{"0":"受益者原則は課税(TAX)の概念で、MLMの6反論ではない。","1":"境界資源モデルはDF(プラットフォーム)の概念。","3":"資本輸出中立性はTAXの概念。"}},{"id":309,"conceptId":"cMLM_utilitarianism","ch":"MLM","type":"A","source":"PEB2 Textbook","q":"[L6] According to the utilitarian view of just distribution, the best society:","opts":["A) maximizes the income of the worst-off group","B) requires income to be exactly equal for all","C) is just if property is justly acquired and voluntarily exchanged","D) maximizes the sum of utility (taking incentives into account)","E) わからない"],"ans":3,"exp":"功利主義は、効用の総和を最大化する社会を最善とする(必ずしも弱者を優先しない)。インセンティブも考慮し、富者から取りすぎると稼ぐ意欲が下がり、貧者へ払いすぎると貧困に留まる動機を生むとする。","we":{"0":"最下層の所得最大化はRawlsのマキシミン原理。","1":"","2":"所得の完全平等は功利主義の主張ではない。"}},{"id":310,"conceptId":"cMLM_nozick","ch":"MLM","type":"A","source":"PEB2 Textbook","q":"[L6] Nozick’s entitlement theory holds that a distribution of income is just if:","opts":["A) property is justly acquired and voluntarily exchanged (even if the result is inequality)","B) it maximizes the sum of social utility","C) the worst-off group is made as well-off as possible","D) everyone ends with an equal share","E) わからない"],"ans":0,"exp":"Nozickの権原理論(entitlement theory)は、財産が正当に取得され、自発的に交換されたなら、その結果としての分配は(不平等でも)正義であるとする。人々が望んで取引する限り、他者の権利を侵さなければ自由。","we":{"1":"効用総和の最大化は功利主義。","2":"","3":"最下層の最大化はRawlsのマキシミン。"}},{"id":311,"conceptId":"cMLM_moral_machine_concept","ch":"MLM","type":"A","source":"PEB2 Textbook","q":"[L6] The Moral Machine experiment (Awad et al.) primarily studies:","opts":["A) How to price carbon offsets fairly","B) How people decide whom an autonomous vehicle should spare in unavoidable accidents","C) How platforms tax third-party developers","D) How fines change daycare behavior","E) わからない"],"ans":1,"exp":"Moral Machine実験(Awad et al. 2018)は、自動運転車が不可避な事故で「誰を助けるべきか」を人々がどう判断するかを大規模に調べた研究。アルゴリズムが中立かという問いに関わる。","we":{"0":"炭素オフセットの価格付けはSustのWest et al.の話。","2":"","3":"第三者開発者への課税はDF/TAXの話。"}},{"id":312,"conceptId":"cMLM_survivorship","ch":"MLM","type":"C","source":"PEB2 Textbook","q":"[L6] \"Steve Jobs, Bill Gates, and Mark Zuckerberg dropped out and became billionaires, so will I.\" This reasoning illustrates:","opts":["A) Statistical significance","B) The decoy effect","C) Survivorship bias (and confusing correlation with causation)","D) Hedonic adaptation","E) わからない"],"ans":2,"exp":"成功者だけを見て一般化するのは生存者バイアス(survivorship bias)。中退者全体ではなく成功した少数だけを見ており、相関と因果も混同している。講義の「科学的主張の評価」の例。","we":{"0":"統計的有意性の話ではない。サンプル選択の偏りの問題。","1":"おとり効果(decoy effect)は選択肢設計の話で別概念。","3":"快楽適応はEasterlinパラドックスの説明概念。"}},{"id":313,"conceptId":"cMLM_pay_for_performance","ch":"MLM","type":"C","source":"PEB2 Textbook","q":"[L6] \"Pay teachers by student performance.\" What problem does the lecture flag (managing incentives, ch.22)?","opts":["A) It guarantees better learning with no downside","B) It eliminates all teacher motivation","C) It is identical to a nudge","D) What you pay for may not equal what you want — it can introduce cheating","E) わからない"],"ans":3,"exp":"インセンティブ管理(ch.22)の「You get what you pay for」: 成果連動報酬は、支払う対象(測定指標)が本当に望むもの(真の学習)と一致せず、カンニング等の歪みを招きうる。","we":{"0":"下振れ無しで学習が改善するとは限らない。歪みを生む。","1":"動機を完全に消すのではなく、誤った行動を誘発しうる。","2":"ナッジ(経済的誘因を変えずに行動を変える)とは別概念。"}},{"id":314,"conceptId":"cMLM_nudge","ch":"MLM","type":"A","source":"PEB2 Textbook","q":"[L6] A \"nudge\" is best defined as:","opts":["A) Altering people’s behavior predictably without significantly changing their economic incentives","B) A large financial penalty for non-compliance","C) A legal ban on a product","D) A market price set by supply and demand","E) わからない"],"ans":0,"exp":"ナッジ(nudge)は、経済的インセンティブを大きく変えずに、人々の行動を予測可能な形で変えること(選択アーキテクチャの変更)。例: 臓器提供のデフォルト設定(Johnson & Goldstein)。","we":{"1":"多額の罰金は経済的誘因を変える手段で、ナッジではない。","2":"","3":"製品の法的禁止は強制であり、ナッジ(選択は残す)ではない。"}},{"id":315,"conceptId":"cMLM_default_donation","ch":"MLM","type":"C","source":"PEB2 Predicted","q":"[L6] Johnson & Goldstein’s organ-donation study shows that high donation rates are best explained by:","opts":["A) Higher financial payments to donors","B) The default option (opt-in vs. opt-out) in the choice architecture","C) Stronger criminal penalties for non-donors","D) Differences in national income","E) わからない"],"ans":1,"exp":"Johnson & Goldstein(2003)は、臓器提供率の大きな差が、デフォルト設定(オプトイン対オプトアウト)という選択アーキテクチャで説明されることを示した。ナッジの代表例で、経済的誘因を変えずに行動を変える。","we":{"0":"提供者への金銭支払いの差ではなく、デフォルト設定の差。","2":"","3":"非提供者への刑事罰ではない。"}},{"id":316,"conceptId":"cMLM_motivated_reasoning","ch":"MLM","type":"C","source":"PEB2 Textbook","q":"[L6] In Pittarello et al. (report the number nearest the X), the finding was:","opts":["A) People always report the exact correct number","B) People report lower numbers when high numbers pay","C) When reporting high numbers pays, self-serving \"mistakes\" become common; when accuracy pays, mistakes are rare","D) Incentives had no effect on reported numbers","E) わからない"],"ans":2,"exp":"Pittarello et al.(2015)では、高い数字の報告が得になるとき、自己利益的な「間違い」が多くなり、正確さが報われるときは間違いが稀になる。意図的無知・動機づけられた推論の例。","we":{"0":"常に正確に報告するわけではなく、誘因で歪む。","1":"","3":"高い数字が得なら高い方向へ間違える。低い方向ではない。"}},{"id":317,"conceptId":"cMLM_adverse_selection","ch":"MLM","type":"A","source":"PEB2 Predicted","q":"[L5] Adverse selection arises when:","opts":["A) both parties have full information about what is traded","B) prices are set by a regulator","C) all products are reviewed honestly","D) there is asymmetric information about what is being traded (e.g., hidden quality)","E) わからない"],"ans":3,"exp":"逆選択(adverse selection)は、取引対象の質などについて情報の非対称性があるときに生じる(隠れた情報)。完全情報下では生じない。レビュー・評価は情報非対称を緩和しモラルハザード/逆選択を抑える。","we":{"0":"完全情報下では逆選択は生じない。","1":"","2":"規制価格の有無は逆選択の発生条件ではない。"}},{"id":318,"conceptId":"cMLM_fair_treatment","ch":"MLM","type":"E","source":"PEB2 Textbook","q":"[L6] NYC buses for all vs. cheaper taxi coupons: which captures the tension (Cowen & Tabarrok, \"fair and equal treatment\")?","opts":["A) Economic argument: taxi coupons are cheaper; Moral argument: equal treatment is important","B) Economic argument: equal treatment matters; Moral argument: taxi coupons are cheaper","C) Both arguments conclude buses should never be accessible","D) There is no tension between the two arguments","E) わからない"],"ans":0,"exp":"「公平・平等な扱い」の論点: 経済的議論はタクシークーポンの方が安い(効率)、道徳的議論は平等な扱いが重要、と対立する。標準的経済推論が道徳領域で物足りなくなる例。"
